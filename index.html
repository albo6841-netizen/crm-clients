<html dir="rtl" lang="he">
<head>

<style>
  :root{
    --primary:#0d4d4d; --primary-hover:#12706b; --primary-light:#e6efee; --sidebar-box:#0a3e3e;
    --bg:#eef1f1; --card:#ffffff; --field:#fbfcfc;
    --border:#e3e9e8; --border2:#dde5e4; --border3:#dbe3e2;
    --text:#16302f; --text2:#5d7473; --text3:#7b908e; --on-dark:#bcd6d2; --on-dark2:#8fb5b1;
    --danger:#b4462f; --danger-bg:#fdf6f4; --danger-border:#e6dcd9;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  *{box-sizing:border-box;}
  body{font-family:Assistant,system-ui,sans-serif;color:var(--text);}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus{outline:2px solid #0d4d4d33;border-color:var(--primary)!important;}
  a{color:var(--primary);text-decoration:none;} a:hover{color:var(--primary-hover);}
  .leaflet-popup-content{margin:12px 14px;direction:rtl;font-family:Assistant,sans-serif;}
  .leaflet-container{font-family:Assistant,sans-serif;}
  .ltr{direction:ltr;text-align:right;}
  .row-store{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .row-store:hover{box-shadow:0 6px 18px #0d4d4d14;transform:translateY(-1px);}
  .card-sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;}
  .fld{border:1px solid var(--border2);border-radius:11px;padding:11px 12px;font-size:15px;color:var(--text);background:var(--field);width:100%;}
  .lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text2);font-weight:600;}
  .grid .lbl>.fld{margin-top:auto;}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px #0d4d4d29;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-soft{background:var(--primary-light);color:var(--primary);border:none;border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-soft:hover{background:#d7e6e4;}
  .btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);border-radius:13px;font-weight:600;cursor:pointer;}
  .btn-danger:hover{background:#f7e7e2;}
  .sec-title{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--primary);}
  .grid{display:grid;gap:12px;}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:#cdd8d7;border-radius:8px;}
  .modal-back{position:fixed;inset:0;background:#16302f66;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0d4d4d40;}
  .spinner{width:26px;height:26px;border:3px solid #cfe0de;border-top-color:#0d4d4d;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================================

   ========================================================================== */

/* ---------- configuration Supabase ---------- */
const SUPABASE_URL = 'https://fryxliuhaayyedmskohm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_czw0QR_TnL5SY_Rjaq7lrw_q55YRGny';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'documents';

/* ---------- utilitaires ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'c'+Date.now()+Math.random().toString(36).slice(2));
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bizWord = (n) => n===1 ? 'עסק אחד' : n + ' עסקים';
const cityWord = (n) => n===1 ? 'יישוב אחד' : n + ' יישובים';

const BLANK = { name:'', taxId:'', trade:'', street:'', city:'', zip:'', country:'ישראל', contact:'', phone:'', phone2:'', fax:'', terms:'שוטף', discount:'', key:'', bank:'', branch:'', account:'', gps:'', emails:[''], docs:[], branches:[], lastVisit:'', visitNotes:'', toVisit:false };
const KEYS = ['name','taxId','trade','street','city','zip','country','contact','phone','phone2','fax','terms','discount','key','bank','branch','account','gps'];
const LTR_FIELDS = new Set(['taxId','discount','zip','phone','phone2','fax','branch','account','gps']);

/* ---------- conversion base <-> appli ---------- */
function rowToStore(r){ return { id:r.id, name:r.name||'', taxId:r.tax_id||'', trade:r.trade||'', street:r.street||'', city:r.city||'', zip:r.zip||'', country:r.country||'ישראל', contact:r.contact||'', phone:r.phone||'', phone2:r.phone2||'', fax:r.fax||'', emails:(r.emails&&r.emails.length)?r.emails:[''], terms:r.terms||'שוטף', discount:r.discount_pct||'', key:r.customer_key||'', bank:r.bank_name||'', branch:r.bank_branch||'', account:r.bank_account||'', gps:r.gps||'', docs:r.docs||[], branches:r.branches||[], lastVisit:r.last_visit||'', visitNotes:r.visit_notes||'', toVisit:!!r.to_visit }; }
function storeToRow(s){ const T=v=>{v=(v||'').trim();return v||null;}; return { id:s.id, name:(s.name||'').trim(), tax_id:T(s.taxId), trade:T(s.trade), street:T(s.street), city:T(s.city), zip:T(s.zip), country:(s.country||'ישראל').trim()||'ישראל', contact:T(s.contact), phone:T(s.phone), phone2:T(s.phone2), fax:T(s.fax), emails:(s.emails||[]).map(e=>(e||'').trim()).filter(Boolean), terms:s.terms||'שוטף', discount_pct:T(s.discount), customer_key:T(s.key), bank_name:T(s.bank), bank_branch:T(s.branch), bank_account:T(s.account), gps:T(s.gps), docs:s.docs||[], branches:s.branches||[], updated_at:new Date().toISOString() }; }
/* champs de suivi de visite — séparés car nécessitent la migration SQL (best-effort) */
function visitRow(s){ return { last_visit:(s.lastVisit&&s.lastVisit.trim())?s.lastVisit:null, visit_notes:s.visitNotes||null, to_visit:!!s.toVisit }; }
/* numéro israélien -> format international pour WhatsApp */
function waNumber(p){ let d=(p||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('972')) return d; if(d.startsWith('0')) return '972'+d.slice(1); return d; }

/* ---------- tâches ---------- */
const TASK_TYPES = { payment:{label:'תשלום',icon:'💰'}, new_client:{label:'לקוח חדש',icon:'🆕'}, route:{label:'מסלול',icon:'🚗'}, other:{label:'אחר',icon:'📋'} };
const TASK_BLANK = { title:'', type:'other', customerId:'', city:'', dueDate:'', done:false };
function rowToTask(r){ return { id:r.id, title:r.title||'', type:r.type||'other', customerId:r.customer_id||'', city:r.city||'', dueDate:r.due_date||'', done:!!r.done, doneAt:r.done_at||'', tripId:r.trip_id||'' }; }
function taskToRow(t){ return { id:t.id, title:t.title, type:t.type||'other', customer_id:t.customerId||null, city:t.city||null, due_date:(t.dueDate&&t.dueDate.trim())?t.dueDate:null, done:!!t.done, done_at:t.done?(t.doneAt||new Date().toISOString()):null, trip_id:t.tripId||null }; }
function rowToTrip(r){ return { id:r.id, date:r.date||'', name:r.name||'', startAddr:r.start_addr||'', endAddr:r.end_addr||'' }; }
function tripToRow(t){ return { id:t.id, date:(t.date&&t.date.trim())?t.date:null, name:t.name||null, start_addr:t.startAddr||null, end_addr:t.endAddr||null }; }
const TRIP_BLANK = { date:'', name:'', startAddr:'', endAddr:'' };
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }


/* ---------- comptabilité : documents Morning (חשבונית ירוקה), en lecture seule ----------
   Les documents sont copiés par le serveur (api/morning-sync) ; le calcul du solde est dans ledger.js. */
const MDOC_KINDS = {
  305:{ label:'חשבונית מס',      color:'#0d4d4d', bg:'#e6efee' },
  320:{ label:'חשבונית מס/קבלה', color:'#0d4d4d', bg:'#e6efee' },
  330:{ label:'זיכוי',           color:'#1f7a5c', bg:'#e4f4ec' },
  400:{ label:'קבלה',            color:'#8a5a12', bg:'#fbf1de' }
};
const TONES = { danger:['#fdf6f4','#b4462f'], warning:['#fbf1de','#8a5a12'], success:['#e4f4ec','#1f7a5c'], muted:['#eef1f1','#7b908e'] };
function money(n){ const v=Math.round((Number(n)||0)*100)/100, dec=Number.isInteger(v)?0:2; return '₪ '+v.toLocaleString('he-IL',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtFullDate(d){ const p=String(d||'').split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : (d||''); }
function daysAgo(d){ if(!d) return 0; const t=new Date(d+'T00:00:00'), n=new Date(todayStr()+'T00:00:00'); return Math.round((n-t)/86400000); }
function sinceLabel(iso){ if(!iso) return ''; const m=Math.round((Date.now()-Date.parse(iso))/60000); if(m<1) return 'עכשיו'; if(m<60) return 'לפני '+m+' דק׳'; const h=Math.round(m/60); if(h<24) return 'לפני '+h+' שע׳'; return 'לפני '+Math.round(h/24)+' ימים'; }
function customerDocs(cid){ return state.mdocs.filter(d=>d.customer_id===cid); }
function customerLinks(cid){ return state.mclients.filter(c=>c.customer_id===cid); }
// Dette affichée = ce qui reste à payer sur les factures OUVERTES dans Morning
// (pas de facture ouverte = pas de dette, même si Morning garde un solde comptable)
function debtDue(cid){ return Ledger.openDebt(customerDocs(cid)); }
function oldestOpenDate(cid){
  const o=Ledger.openInvoices(customerDocs(cid));
  return o.length ? (o[0].doc_date||'') : '';
}
async function loadMorning(){
  try{
    const docs=[];
    for(let from=0;;from+=1000){   // Supabase renvoie au plus 1000 lignes par demande
      const { data, error } = await sb.from('morning_documents').select('morning_id,customer_id,morning_client_id,type,number,status,doc_date,amount,amount_opened,description,pdf_path').order('doc_date',{ascending:false}).range(from, from+999);
      if(error) throw error;
      docs.push(...(data||[]));
      if(!data || data.length<1000) break;
    }
    state.mdocs = docs.map(d=>({ ...d, amount:Number(d.amount)||0, amount_opened:d.amount_opened==null?null:Number(d.amount_opened) }));
    const { data:cl } = await sb.from('morning_clients').select('morning_id,customer_id,name,balance_amount,synced_at');
    state.mclients = cl||[];
    const { data:st } = await sb.from('morning_sync').select('*').eq('id',1);
    state.msync = (st&&st[0])||null;
  }catch(e){ console.error(e); state.mdocs=[]; state.mclients=[]; state.msync=null; }
}
// Demande au serveur de mettre à jour depuis Morning (une fiche, ou tout si cid vide)
async function requestMorningSync(cid){
  try{
    const { data } = await sb.auth.getSession();
    const tok = data && data.session && data.session.access_token; if(!tok) return null;
    const r = await fetch('/api/morning-sync'+(cid?'?customer='+encodeURIComponent(cid):''), { method:'POST', headers:{ Authorization:'Bearer '+tok } });
    return await r.json().catch(()=>null);
  }catch(e){ return null; }
}

/* ---------- état global ---------- */
const state = {
  user:null, authReady:false, loading:false,
  tab:'list', sel:null, mode:'view', query:'',
  filterType:'', filterVisit:false,
  form: JSON.parse(JSON.stringify(BLANK)),
  isDesktop: window.matchMedia('(min-width:900px)').matches,
  stores: [], tasks: [], trips: [], mdocs: [], mclients: [], msync: null, moneyFilter:'open', moneyAll:false, ledgerAll:false, selTrip:null, taskFilter:'open', taskModal:null,
  route: { date:'', startAddr:'', endAddr:'', tripId:'', startTime:'', computed:null, computing:false },
  toast:''
};
let _map=null, _markers=[], _didFit=false, _routeMap=null, _tripMap=null;
const _thumbUrls={};
const IL_MAXBOUNDS = [[29.2,33.9],[33.6,36.1]];   // limites de déplacement (Israël + marge)
const IL_VIEW = [[30.9,34.3],[33.3,35.75]];        // cadrage par défaut resserré sur le cœur d'Israël

/* ---------- toast ---------- */
let _toastTimer=null;
function flash(t){ state.toast=t; renderToast(); clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>{state.toast='';renderToast();},2200); }
function renderToast(){
  let el=$('#toast');
  if(!state.toast){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.style.cssText='position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:#0d4d4d;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:1000;box-shadow:0 6px 20px #0d4d4d3d;max-width:88vw;text-align:center';
  el.textContent=state.toast;
}

/* ---------- confirmation intégrée (remplace confirm() — marche aussi en mode appli/PWA) ---------- */
function uiConfirm(msg, okLabel){
  return new Promise(res=>{
    const back=document.createElement('div'); back.className='modal-back'; back.style.zIndex='1100';
    back.innerHTML=`<div class="modal" style="max-width:360px;gap:16px;text-align:center">
      <div style="font-size:15.5px;color:#16302f;font-weight:600;line-height:1.55">${esc(msg)}</div>
      <div style="display:flex;gap:10px">
        <button id="ucCancel" style="flex:1;background:#fff;color:#5d7473;border:1px solid #dde5e4;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer">ביטול</button>
        <button id="ucOk" class="btn-danger" style="flex:1;padding:13px;border-radius:12px;font-size:15px">${esc(okLabel||'מחיקה')}</button>
      </div></div>`;
    document.body.appendChild(back);
    const done=v=>{ back.remove(); res(v); };
    back.onclick=e=>{ if(e.target===back) done(false); };
    $('#ucCancel',back).onclick=()=>done(false);
    $('#ucOk',back).onclick=()=>done(true);
  });
}

/* ---------- icônes ---------- */
function icon(id, active){
  const c = active ? '#0d4d4d' : (state.isDesktop ? '#bcd6d2' : '#7b908e');
  if(id==='list') return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`;
  if(id==='map')  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>`;
  if(id==='tasks') return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
  if(id==='money') return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a3 3 0 0 1 3 3v13l-2.5-1.6L15 20l-2.5-1.6L10 20l-2.5-1.6L5 20V7a3 3 0 0 0-1-2.2z"/><path d="M8 9h8M8 13h5"/></svg>`;
  return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
}

/* ==========================================================================
   RENDU PRINCIPAL
   ========================================================================== */
function render(){
  state.isDesktop = window.matchMedia('(min-width:900px)').matches;
  const app=$('#app');

  if(!state.authReady){ app.innerHTML = centered(`<div class="spinner"></div>`); return; }
  if(!state.user){ app.innerHTML = screenLogin(); wireLogin(); renderToast(); return; }

  app.innerHTML = `
    <div style="display:flex;align-items:stretch;min-height:100vh">
      ${state.isDesktop ? sidebar() : ''}
      <main style="flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:${state.isDesktop?'0':'92px'}">
        ${state.loading ? centered(`<div class="spinner"></div>`) :
          (state.tab==='list' ? screenList() : state.tab==='map' ? screenMap() : state.tab==='tasks' ? screenTasks() : state.tab==='trip' ? screenTrip() : state.tab==='route' ? screenRoute() : state.tab==='money' ? screenMoney() : screenCard())}
      </main>
      ${!state.isDesktop ? bottomNav() : ''}
    </div>`;
  wire();
  if(state.tab==='map' && !state.loading) setTimeout(syncMap,50);
  if(state.tab==='route' && !state.loading && state.route.computed) setTimeout(syncRouteMap,50);
  if(state.tab==='trip' && !state.loading) setTimeout(syncTripMap,50);
  if(state.tab==='card' && !state.loading) setTimeout(fillThumbs,30);
  renderToast();
}
function centered(inner){ return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center">${inner}</div>`; }

/* ---------- écran de connexion ---------- */
function screenLogin(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0d4d4d 0%,#0a3e3e 100%)">
    <div style="background:#fff;border-radius:22px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px #00000030;display:flex;flex-direction:column;gap:6px">
      <div style="text-align:center;margin-bottom:8px">
        <div style="font-size:24px;font-weight:700;color:#0d4d4d">ניהול לקוחות</div>
        <div style="font-size:13.5px;color:#5d7473;margin-top:2px">התחברות למערכת</div>
      </div>
      <label class="lbl" style="margin-top:8px">אימייל
        <input id="loginEmail" type="email" class="fld ltr" placeholder="name@mail.com" autocomplete="username"></label>
      <label class="lbl" style="margin-top:10px">סיסמה
        <input id="loginPass" type="password" class="fld ltr" placeholder="••••••••" autocomplete="current-password"></label>
      <div id="loginErr" style="color:#b4462f;font-size:13px;font-weight:600;min-height:18px;margin-top:8px;text-align:center"></div>
      <button id="loginBtn" class="btn-primary" style="justify-content:center;margin-top:4px;padding:13px">התחבר</button>
    </div>
  </div>`;
}
function wireLogin(){
  const email=$('#loginEmail'), pass=$('#loginPass'), btn=$('#loginBtn'), err=$('#loginErr');
  const submit=async()=>{
    err.textContent='';
    if(!email.value.trim()||!pass.value){ err.textContent='נא למלא אימייל וסיסמה'; return; }
    btn.disabled=true; btn.textContent='מתחבר...';
    const { error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:pass.value });
    if(error){ err.textContent='אימייל או סיסמה שגויים'; btn.disabled=false; btn.textContent='התחבר'; return; }
    // onAuthStateChange s'occupe de charger l'appli
  };
  btn.onclick=submit;
  pass.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  email.onkeydown=e=>{ if(e.key==='Enter') pass.focus(); };
}

async function logout(){ await sb.auth.signOut(); }

/* ---------- navigation ---------- */
function navItemsData(){
  const activeId = state.tab==='card' ? (state.mode==='new'?'add':'list') : (state.tab==='trip'||state.tab==='route') ? 'tasks' : state.tab;
  return [{id:'list',label:'רשימה'},{id:'map',label:'מפה'},{id:'tasks',label:'מסלולים'},{id:'money',label:'כספים'},{id:'add',label:'הוספת לקוח'}].map(n=>({...n, active:n.id===activeId}));
}
function sidebar(){
  const items = navItemsData().map(n=>`
    <button data-nav="${n.id}" style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;text-align:right;background:${n.active?'#ffffff':'transparent'};color:${n.active?'#0d4d4d':'#bcd6d2'}">
      <span style="display:flex;width:20px;justify-content:center">${icon(n.id,n.active)}</span><span>${n.label}</span>
    </button>`).join('');
  return `<aside style="width:248px;flex:0 0 248px;background:#0d4d4d;color:#dcece9;padding:28px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:20px;font-weight:700;color:#fff;letter-spacing:-.2px">ניהול לקוחות</div>
      <div style="font-size:12.5px;color:#8fb5b1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" class="ltr">${esc(state.user?state.user.email:'')}</div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:6px">${items}</nav>

function filterChips(){

      ${missingBox}

function syncMap(){
  const el=$('#map'); if(!el) return;
  if(!window.L){ setTimeout(syncMap,250); return; }   // attendre que Leaflet finisse de charger
  // si on revient sur l'onglet carte, le conteneur a été recréé → recréer la carte dessus
  if(_map && _map.getContainer() !== el){ try{ _map.remove(); }catch(e){} _map=null; _markers=[]; _didFit=false; }
  if(!_map){
    _map=L.map(el,{zoomControl:false,attributionControl:false,minZoom:7,maxBounds:L.latLngBounds(IL_MAXBOUNDS),maxBoundsViscosity:1.0}).setView([31.6,34.9],8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(_map);
    L.control.zoom({position:'topleft'}).addTo(_map);
  }
  _markers.forEach(m=>m.remove()); _markers=[];
  const pts=[];
  const _seen={};
  allMapPoints().forEach(p=>{
    let lat=p.ll[0], lng=p.ll[1];
    const key=lat.toFixed(4)+','+lng.toFixed(4);
    const idx=_seen[key]||0; _seen[key]=idx+1;
    if(idx>0){ const ang=idx*(Math.PI/3); const r=0.00045*Math.ceil(idx/6); lat+=r*Math.cos(ang); lng+=r*Math.sin(ang); } // écarter les points superposés
    pts.push([lat,lng]);
    const color = p.isBranch ? '#12897e' : '#0d4d4d';
    const ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,30],html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;background:'+color+';transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)"></div>'});
    const gmap='https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng;
    const waze='https://waze.com/ul?ll='+lat+','+lng+'&navigate=yes';
    const m=L.marker([lat,lng],{icon:ic}).addTo(_map);
    m.bindPopup('<div style="min-width:190px;text-align:right"><div style="font-size:15px;font-weight:700;color:#16302f">'+esc(p.name)+'</div><div style="font-size:12.5px;color:#5d7473;margin:2px 0 10px">'+esc(p.sub)+'</div><button onclick="window.__openCard(\''+p.id+'\')" style="width:100%;background:#0d4d4d;color:#fff;border:none;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:Assistant,sans-serif;margin-bottom:6px">פתח כרטיס</button><div style="display:flex;gap:6px"><a href="'+waze+'" target="_blank" style="flex:1;text-align:center;background:#e7f6fb;color:#0a7ea4;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;font-family:Assistant,sans-serif">Waze</a><a href="'+gmap+'" target="_blank" style="flex:1;text-align:center;background:#e6efee;color:#0d4d4d;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700;font-family:Assistant,sans-serif">Google</a></div></div>');
    _markers.push(m);
  });
  // Ajustement robuste : attendre que le conteneur ait une vraie taille avant d'afficher/centrer
  let _t=0;
  const ensure=()=>{
    if(!_map||!$('#map')) return;
    _map.invalidateSize();
    if(_map.getSize().x===0 && _t++<40){ setTimeout(ensure,120); return; }
    if(!_didFit){ try{ pts.length ? _map.fitBounds(pts,{padding:[40,40],maxZoom:13}) : _map.fitBounds(L.latLngBounds(IL_VIEW)); }catch(e){} _didFit=true; }
  };
  setTimeout(ensure,40);
}

function tripTimeline(c){
  const rows = c.path.map((p,i)=>{
    const isStart=i===0, isEnd=i===c.path.length-1, last=isEnd;
    const num = isStart?'📍':isEnd?'🏁':String(i).padStart(2,'0');
    const t = (!isStart&&!isEnd)?p.task:null;
    const cust = t?taskCustomer(t):null;
    const done = !!(t&&t.done);
    const nodeBg = (isStart||isEnd)?'#0a3e3e':(done?'#1a8a4a':'#0d4d4d');
    let title, subs=[];
    if(isStart){ title='נקודת יציאה'; if(state.route.startAddr) subs.push('📍 '+esc(state.route.startAddr)); }
    else if(isEnd){ title='נקודת סיום'; subs.push(state.route.endAddr?('📍 '+esc(state.route.endAddr)):'חזרה לנקודת היציאה'); }
    else { title=esc((cust&&cust.name)||p.name||(t&&t.title)||'');
      if(t&&t.city) subs.push('🏙️ '+esc(t.city));
      if(t&&t.title) subs.push((TASK_TYPES[t.type]||TASK_TYPES.other).icon+' '+esc(t.title)); }
    const ll=p.ll, waze = ll?('https://waze.com/ul?ll='+ll[0]+','+ll[1]+'&navigate=yes'):null;
    const topSeg=`<div style="width:2px;height:6px;background:${isStart?'transparent':'#d3dddb'}"></div>`;
    const botSeg=`<div style="width:2px;flex:1;min-height:6px;background:${isEnd?'transparent':'#d3dddb'}"></div>`;
    const node=`<div style="flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:${nodeBg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${(isStart||isEnd)?'15px':'13px'};box-shadow:0 1px 3px rgba(0,0,0,.22)">${num}</div>`;
    const rail=`<div style="align-self:stretch;display:flex;flex-direction:column;align-items:center;flex:0 0 30px">${topSeg}${node}${botSeg}</div>`;
    const time=`<div style="flex:0 0 42px;text-align:start;font-size:12px;color:#8b9c9a;font-weight:700;padding-top:14px;font-family:Assistant">${p.eta||''}</div>`;
    const subHtml = subs.length?`<div style="font-size:12.5px;color:#7b908e;margin-top:2px;display:flex;flex-direction:column;gap:1px">${subs.map(s=>`<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s}</span>`).join('')}</div>`:'';
    const toggle = t?`<button data-toggletask="${t.id}" title="סמן כבוצע" style="width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2px solid ${done?'#1a8a4a':'#ccd6d5'};background:${done?'#1a8a4a':'#fff'};color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px">${done?'✓':''}</button>`:'';
    const nav = waze?`<a href="${waze}" target="_blank" title="ניווט" style="width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#e7f6fb;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px">🧭</a>`:'';
    const clickAttr = t?`data-edittask="${t.id}"`:'';
    const content=`<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 2px 11px 0">
      <div ${clickAttr} style="flex:1;min-width:0;${t?'cursor:pointer':''}">
        <div style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${done?'color:#9fb0ae;text-decoration:line-through':'color:#16302f'}">${title}</div>
        ${subHtml}
      </div>${nav}${toggle}
    </div>`;
    return `<div style="display:flex;gap:10px;padding:0 14px;${last?'':'border-bottom:1px solid #eef3f2'};background:${done?'#f6fbf8':'#fff'}">${time}${rail}${content}</div>`;
  }).join('');
  return `<div style="background:#fff;border:1px solid #e3e9e8;border-radius:16px;overflow:hidden">${rows}</div>`;
}

    setTimeout(ensure,40);
    return;
  }
  // pas de trajet calculé → points simples
  (async()=>{
    const lls=[]; let i=0;
    for(const t of tripStops(state.selTrip)){
      i++; const cu=taskCustomer(t);
      let ll=(cu&&cu.gps)?parseLL(cu.gps):null; if(!ll && t.city) ll=await geocodeAddr(t.city);

    setTimeout(ensure,40);

/* ==========================================================================
   MSLOUL — circuit intelligent (optimisation de tournée façon "Circuit")
   ========================================================================== */
function parseLL(str){ const p=String(str||'').split(',').map(x=>parseFloat(x.trim())); return (p.length===2&&!isNaN(p[0])&&!isNaN(p[1]))?[p[0],p[1]]:null; }
async function geocodeAddr(addr){
  const ll=parseLL(addr); if(ll) return ll;
  if(!addr||!addr.trim()) return null;
  try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q='+encodeURIComponent(addr+', ישראל')); const j=await r.json(); if(j&&j[0]) return [ +(+j[0].lat).toFixed(6), +(+j[0].lon).toFixed(6) ]; }catch(e){}
  return null;
}
async function taskLocation(t){
  const c=taskCustomer(t);
  if(c&&c.gps){ const ll=parseLL(c.gps); if(ll) return ll; }
  if(t.city){ const g=await geocodeAddr(t.city); if(g) return g; }
  return null;
}
function haversine(a,b){ const R=6371,toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]),dLng=toR(b[1]-a[1]); const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function pathLen(pts){ let d=0; for(let i=0;i<pts.length-1;i++) d+=haversine(pts[i].ll,pts[i+1].ll); return d; }
function optimize(start,stops,end){
  const rem=stops.slice(), order=[]; let cur=start;
  while(rem.length){ let bi=0,bd=Infinity; rem.forEach((s,i)=>{const d=haversine(cur.ll,s.ll); if(d<bd){bd=d;bi=i;}}); order.push(rem[bi]); cur=rem[bi]; rem.splice(bi,1); }
  let path=[start,...order,end], improved=true, guard=0;
  while(improved && guard++<50){ improved=false;
    for(let i=1;i<path.length-2;i++) for(let k=i+1;k<path.length-1;k++){
      const np=path.slice(0,i).concat(path.slice(i,k+1).reverse(),path.slice(k+1));
      if(pathLen(np)<pathLen(path)-1e-9){ path=np; improved=true; }
    }
  }
  return path;
}
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m?(+m[1])*60+(+m[2]):8*60; }
function fmtHM(min){ min=Math.round(min); const h=Math.floor(min/60)%24, mm=((min%60)+60)%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function applyEtas(path){ // heure estimée par arrêt : distance (×facteur route) / vitesse + temps de visite
  const ROAD=1.3, SPEED=50, VISIT=15; let t=parseHM(state.route.startTime||'08:00');
  path[0].eta=fmtHM(t);
  for(let i=1;i<path.length;i++){ t+=haversine(path[i-1].ll,path[i].ll)*ROAD/SPEED*60; path[i].eta=fmtHM(t); if(i<path.length-1) t+=VISIT; }
}
async function computeRoute(){
  state.route.computing=true; render();
  const date=state.route.date;
  const startLL=await geocodeAddr(state.route.startAddr);
  const endLL=await geocodeAddr(state.route.endAddr) || startLL;
  if(!startLL){ state.route.computing=false; render(); flash('לא נמצאה כתובת יציאה'); return; }
  const dayTasks = state.route.tripId ? state.tasks.filter(t=>t.tripId===state.route.tripId && !t.done) : state.tasks.filter(t=>!t.done && t.dueDate===date);
  const stops=[];
  for(const t of dayTasks){ const ll=await taskLocation(t); if(ll) stops.push({ task:t, ll, name:(taskCustomer(t)||{}).name || t.city || t.title }); }
  if(!stops.length){ state.route.computing=false; state.route.computed={empty:true,date}; render(); return; }
  const path=optimize({ll:startLL,name:'יציאה',start:true}, stops, {ll:endLL,name:'סיום',end:true});
  const total=pathLen(path);
  applyEtas(path);
  state.route.computed={ path, total, startLL, endLL, date };
  state.route.computing=false; render();
}
function gmapsRouteUrl(c){
  const wp=c.path.slice(1,-1).map(p=>p.ll[0]+','+p.ll[1]).join('|');
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+c.startLL[0]+','+c.startLL[1]+'&destination='+c.endLL[0]+','+c.endLL[1];
  if(wp) u+='&waypoints='+encodeURIComponent(wp);
  return u;
}

function syncRouteMap(){
  const el=$('#routeMap'); if(!el||!window.L) return;
  const c=state.route.computed; if(!c||!c.path) return;
  if(_routeMap && _routeMap.getContainer()!==el){ try{_routeMap.remove();}catch(e){} _routeMap=null; }
  if(!_routeMap){
    _routeMap=L.map(el,{zoomControl:true,attributionControl:false}).setView([31.6,34.9],8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(_routeMap);
  }
  _routeMap.eachLayer(l=>{ if(l instanceof L.Marker || l instanceof L.Polyline) _routeMap.removeLayer(l); });
  const lls=c.path.map(p=>p.ll);
  L.polyline(lls,{color:'#0d4d4d',weight:4,opacity:.7,dashArray:'2,8'}).addTo(_routeMap);
  c.path.forEach((p,i)=>{
    const isEnd=i===0||i===c.path.length-1;
    const num=i===0?'📍':(i===c.path.length-1?'🏁':i);
    const ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:'<div style="width:28px;height:28px;border-radius:50%;background:'+(isEnd?'#0a3e3e':'#0d4d4d')+';color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:Assistant">'+num+'</div>'});
    L.marker(p.ll,{icon:ic}).addTo(_routeMap);
  });
  let t=0; const ensure=()=>{ if(!_routeMap||!$('#routeMap'))return; _routeMap.invalidateSize(); if(_routeMap.getSize().x===0&&t++<40){setTimeout(ensure,120);return;} try{_routeMap.fitBounds(lls,{padding:[40,40]});}catch(e){} };
  setTimeout(ensure,40);
}

  state.tab='card'; state.sel=id; state.mode='edit';   // ouverture directe en mode modifiable
  state.form=JSON.parse(JSON.stringify(s)); if(!state.form.emails||!state.form.emails.length) state.form.emails=[''];
  state.ledgerAll=false;
  render();
  refreshLedgerIfOld(id);
}
// À l'ouverture d'une fiche : si ses données Morning ont plus de 10 minutes, mise à jour en arrière-plan
function refreshLedgerIfOld(cid){
  const s=state.stores.find(x=>x.id===cid); if(!s||!(s.taxId||'').trim()) return;
  const links=customerLinks(cid);
  const fresh=links.length && links.every(c=>c.synced_at && Date.now()-Date.parse(c.synced_at)<10*60000);
  if(fresh) return;
  requestMorningSync(cid).then(async r=>{ if(r&&r.ok&&!r.skipped){ await loadMorning(); refreshMoneyViews(); } });
}

/* ---------- chargement des données ---------- */
async function reload(){
  const { data, error } = await sb.from('customers').select('*').order('created_at',{ascending:true});
  if(error){ flash('שגיאה בטעינת הנתונים'); console.error(error); return; }
  state.stores = (data||[]).map(rowToStore);
}

/* ---------- géolocalisation automatique par adresse (OpenStreetMap) ---------- */
async function geocode(store){
  const q=[store.street, store.city, 'ישראל'].filter(x=>x&&x.trim()).join(', ');
  if(!(store.city||'').trim() && !(store.street||'').trim()) return null;
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q='+encodeURIComponent(q);
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(j&&j[0]&&j[0].lat) return (+j[0].lat).toFixed(5)+', '+(+j[0].lon).toFixed(5);
  }catch(e){}
  return null;
}

/* ---------- sauvegarde / suppression ---------- */
async function saveStore(){
  if(!(state.form.name||'').trim()){ flash('נא למלא שם עסק / לקוח'); return; }
  const btn=$('[data-save]'); if(btn){ btn.disabled=true; btn.textContent='שומר...'; }
  // si pas de GPS mais une adresse → géolocaliser automatiquement
  if(!(state.form.gps||'').trim() && ((state.form.city||'').trim() || (state.form.street||'').trim())){
    if(btn) btn.textContent='מאתר מיקום...';
    const g=await geocode(state.form); if(g) state.form.gps=g;
  }
  const row=storeToRow(state.form);
  if(!row.id) row.id=uid();
  const { error } = await sb.from('customers').upsert(row);
  if(error){ flash('שגיאה בשמירה'); console.error(error); if(btn){btn.disabled=false;btn.textContent='שמירה';} return; }
  // champs de suivi de visite (best-effort — ignoré tant que la migration SQL n'est pas faite)
  await sb.from('customers').update(visitRow(state.form)).eq('id',row.id);
  await reload();
  const saved=state.stores.find(x=>x.id===row.id);
  state.sel=row.id; state.mode='edit'; state.form= saved?JSON.parse(JSON.stringify(saved)):state.form;
  if(!state.form.emails||!state.form.emails.length) state.form.emails=[''];
  render(); flash('הפרטים נשמרו');
}
function cancelEdit(){
  if(state.mode==='new'||!state.sel){ state.tab='list'; state.sel=null; render(); return; }
  const s=state.stores.find(x=>x.id===state.sel);
  state.mode='view'; state.form=JSON.parse(JSON.stringify(s)); if(!state.form.emails||!state.form.emails.length) state.form.emails=['']; render();
}
async function deleteStore(){
  const s=state.stores.find(x=>x.id===state.sel);
  if(!(await uiConfirm('למחוק את הלקוח "'+((s&&s.name)||'')+'"? פעולה זו אינה הפיכה.'))) return;
  // supprimer les fichiers du stockage
  const paths=(s&&s.docs||[]).map(d=>d.path).filter(Boolean);
  if(paths.length){ try{ await sb.storage.from(BUCKET).remove(paths); }catch(e){} }
  const { error } = await sb.from('customers').delete().eq('id',state.sel);
  if(error){ flash('שגיאה במחיקה'); console.error(error); return; }
  await reload(); state.tab='list'; state.sel=null; render(); flash('הלקוח נמחק');
}

/* ---------- documents ---------- */
async function handleFiles(files){
  if(!state.form.id) state.form.id=uid();
  for(const file of files){
    const docId=uid();
    const path=state.form.id+'/'+docId;
    const kind = file.type==='application/pdf' ? 'PDF' : ((file.name.split('.').pop()||'').toUpperCase().slice(0,4) || 'קובץ');
    flash('מעלה קובץ...');
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType:file.type, upsert:true });
    if(error){ flash('שגיאה בהעלאת הקובץ'); console.error(error); continue; }
    state.form.docs.push({ id:docId, name:file.name.replace(/\.[^.]+$/,'').slice(0,40)||'מסמך', kind, mime:file.type, path });
  }
  // si la fiche existe déjà et qu'on est en consultation, on enregistre tout de suite
  if(state.mode==='view' && state.sel){
    await sb.from('customers').update({ docs:state.form.docs, updated_at:new Date().toISOString() }).eq('id',state.sel);
    await reload();
  }
  render(); flash('המסמך נוסף');
}
async function openDoc(id){
  const d=(state.form.docs||[]).find(x=>x.id===id);
  if(!d||!d.path){ flash('לא נמצא קובץ'); return; }
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.path, 120);
  if(error||!data){ flash('לא ניתן לפתוח את המסמך'); return; }
  window.open(data.signedUrl,'_blank');
}
async function removeDoc(id){
  const d=(state.form.docs||[]).find(x=>x.id===id);
  if(d&&d.path){ try{ await sb.storage.from(BUCKET).remove([d.path]); }catch(e){} }
  state.form.docs=state.form.docs.filter(x=>x.id!==id);
  if(state.mode==='view' && state.sel){
    await sb.from('customers').update({ docs:state.form.docs, updated_at:new Date().toISOString() }).eq('id',state.sel);
    await reload();
  }
  render();
}

function amountHtml(r){

  return `<span style="color:#1f7a5c">− ${money(r.credit)}</span>`;

/* ---------- lecteur PDF intégré (pdf.js, chargé seulement au premier PDF ouvert) ---------- */
const PDFJS_BASE='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
let _pdfjs=null;
function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=PDFJS_BASE+'build/pdf.min.js';
    s.onload=()=>{ const lib=window.pdfjsLib; if(!lib){ _pdfjs=null; rej(new Error('pdfjs')); return; } lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'build/pdf.worker.min.js'; res(lib); };
    s.onerror=()=>{ _pdfjs=null; rej(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}
// Ouvre le PDF original Morning dans une fenêtre à l'intérieur du CRM (lien privé valable 2 minutes)
async function openMorningPdf(id){
  const d=state.mdocs.find(x=>x.morning_id===id);
  if(!d||!d.pdf_path){ flash('ה-PDF עוד לא הועתק — נסו שוב בעוד כמה דקות'); return; }
  const k=MDOC_KINDS[d.type], title=((k&&k.label)||'מסמך')+' '+(d.number||'');
  const back=document.createElement('div'); back.className='modal-back'; back.style.zIndex='1200'; back.style.padding='0';
  back.innerHTML=`<div style="background:#e9eeee;width:100%;height:100%;max-width:920px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:#0d4d4d;color:#fff">
      <div style="flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</div>
      <button id="pdfZoomOut" title="הקטנה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer">−</button>
      <span id="pdfZoomLbl" class="ltr" style="font-size:13px;font-weight:700;min-width:42px;text-align:center">100%</span>
      <button id="pdfZoomIn" title="הגדלה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer">+</button>
      <a id="pdfDl" target="_blank" rel="noopener" style="display:none;color:#fff;font-size:13.5px;font-weight:600;border:1px solid #ffffff66;border-radius:9px;padding:6px 11px">הורדה</a>
      <button id="pdfClose" title="סגירה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:36px;height:36px;font-size:19px;cursor:pointer">×</button>
    </div>
    <div id="pdfPages" style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px"><div class="spinner" style="margin:50px auto"></div></div>
  </div>`;
  document.body.appendChild(back);
  let onPinch=null, pinchTimer=null;
  const close=()=>{ back.remove(); document.removeEventListener('keydown',onKey); if(onPinch&&window.visualViewport) visualViewport.removeEventListener('resize',onPinch); clearTimeout(pinchTimer); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  $('#pdfClose',back).onclick=close;
  back.onclick=e=>{ if(e.target===back) close(); };
  const box=$('#pdfPages',back);
  try{
    const { data, error } = await sb.storage.from('morning-pdf').createSignedUrl(d.pdf_path, 120);
    if(error||!data) throw error||new Error('lien');
    const dl=$('#pdfDl',back); dl.href=data.signedUrl; dl.style.display='';

    // Ordinateur : le lecteur PDF du navigateur, dans la fenêtre du CRM (texte vectoriel, net à tout zoom)
    const nativeViewer = navigator.pdfViewerEnabled===true && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    if(nativeViewer){
      ['#pdfZoomOut','#pdfZoomLbl','#pdfZoomIn'].forEach(s=>{ $(s,back).style.display='none'; });
      box.style.padding='0'; box.style.overflow='hidden';
      box.innerHTML=`<iframe src="${esc(data.signedUrl)}#view=FitH&navpanes=0" title="${esc(title)}" style="display:block;width:100%;height:100%;border:0;background:#fff"></iframe>`;
      return;
    }

    // Téléphone / tablette : pdf.js, page dessinée à la résolution exacte de l'écran (point pour point),
    // redessinée nette au zoom (boutons +/−) et quand on agrandit avec les doigts.
    const lib=await loadPdfJs();
    const pdf=await lib.getDocument({ url:data.signedUrl, cMapUrl:PDFJS_BASE+'cmaps/', cMapPacked:true, standardFontDataUrl:PDFJS_BASE+'standard_fonts/' }).promise;
    if(!back.isConnected) return;
    const fit=Math.max(260, Math.min(box.clientWidth-24, 880));
    const ZOOMS=[1,1.5,2,3]; let zi=0, renderId=0, pinchDone=1;
    const pinch=()=>Math.min(4, Math.max(1, (window.visualViewport&&visualViewport.scale)||1));
    const renderAll=async()=>{
      const id=++renderId, cssW=Math.round(fit*ZOOMS[zi]);
      const density=(window.devicePixelRatio||1)*pinch(); pinchDone=pinch();
      $('#pdfZoomLbl',back).textContent=Math.round(ZOOMS[zi]*100)+'%';
      const keep = box.dataset.cssw===String(cssW);   // même taille : on remplace page par page, sans saut
      let cleared = keep;                              // sinon : l'ancien affichage reste jusqu'à la 1re page prête
      for(let p=1;p<=pdf.numPages;p++){
        if(!back.isConnected||id!==renderId) return;
        const page=await pdf.getPage(p);
        if(!back.isConnected||id!==renderId) return;   // un autre zoom a été demandé pendant le chargement
        const base=page.getViewport({scale:1});
        let scale=cssW*density/base.width;
        const area=base.width*base.height*scale*scale;
        if(area>10e6) scale*=Math.sqrt(10e6/area);          // limite mémoire des téléphones (~40 Mo par page)
        const vp=page.getViewport({scale});
        const cv=document.createElement('canvas');
        cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
        cv.style.cssText=`display:block;margin:0 auto 12px;width:${cssW}px;height:${Math.round(cssW*base.height/base.width)}px;background:#fff;border-radius:6px;box-shadow:0 2px 10px #0d4d4d22`;
        await page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise;
        if(!back.isConnected||id!==renderId) return;
        const old=keep ? box.children[p-1] : null;
        if(old) old.replaceWith(cv);
        else { if(!cleared){ box.innerHTML=''; box.dataset.cssw=String(cssW); cleared=true; } box.appendChild(cv); }
      }
    };
    $('#pdfZoomIn',back).onclick=()=>{ if(zi<ZOOMS.length-1){ zi++; renderAll(); } };
    $('#pdfZoomOut',back).onclick=()=>{ if(zi>0){ zi--; renderAll(); } };
    if(window.visualViewport){
      onPinch=()=>{ clearTimeout(pinchTimer); pinchTimer=setTimeout(()=>{ if(Math.abs(pinch()-pinchDone)>0.25) renderAll(); }, 350); };
      visualViewport.addEventListener('resize',onPinch);
    }
    await renderAll();
  }catch(e){
    console.error(e);
    if(box.isConnected) box.innerHTML='<div style="color:#b4462f;font-weight:600;margin-top:40px;text-align:center">לא ניתן להציג את ה-PDF — נסו את כפתור „הורדה”</div>';
  }
}

    ${unlinked?`<div style="font-size:12.5px;color:#7b908e">${unlinked===1?'לקוח אחד לא מקושר':unlinked+' לקוחות לא מקושרים'} למורנינג (אין ח.פ או שהח.פ לא נמצא)</div>`:''}
    ${debtors.length?`<section>
      <div style="display:flex;align-items:center;gap:10px;padding:0 4px 10px">
        <h2 style="margin:0;font-size:15px;font-weight:700;color:#0d4d4d">לקוחות חייבים</h2>
        <div style="height:1px;flex:1;background:#dbe3e2"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">${debtors.map(d=>`
        <div data-open="${d.c.id}" style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f0dcd6;border-radius:13px;padding:11px 13px;cursor:pointer;flex-wrap:wrap">
          <div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px">
            <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.c.name)}</div>
            <div style="font-size:12.5px;color:#7b908e">${esc(d.c.city||'')}${d.since?' · חשבונית פתוחה מ־'+fmtFullDate(d.since):''}</div>
          </div>
          <div style="font-size:16px;font-weight:700;color:#b4462f;white-space:nowrap">${money(d.due)}</div>
        </div>`).join('')}</div>
    </section>`:''}
    <section>
      <div style="display:flex;align-items:center;gap:10px;padding:0 4px 10px">
        <h2 style="margin:0;font-size:15px;font-weight:700;color:#0d4d4d">${f==='open'?'חשבוניות פתוחות':'מסמכים'}</h2>
        <div style="height:1px;flex:1;background:#dbe3e2"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${chipBtn('open','פתוחות ('+openAll.length+')')}${chipBtn('all','הכל')}${chipBtn('invoice','חשבוניות')}${chipBtn('credit','זיכויים')}${chipBtn('receipt','קבלות')}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
      ${listAll.length>list.length?`<button data-moneyall class="btn-soft" style="margin-top:10px;width:100%">הצג את כל ${listAll.length} המסמכים</button>`:''}
    </section>
  </div>`;
}

/* ---------- choisir sur la carte ---------- */
function openPickMap(){
  const cur=(state.form.gps||'').split(',').map(x=>parseFloat(x.trim()));
  const hasCur = cur.length===2 && !isNaN(cur[0]);
  const start = hasCur ? [cur[0],cur[1]] : [31.7,34.95];
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;font-size:17px;font-weight:700;color:#0d4d4d">בחירת מיקום</h2>
      <button id="pmClose" style="border:none;background:#eef1f1;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="font-size:13px;color:#5d7473">לחצו על המפה כדי למקם את החנות</div>
    <div id="pickMap" style="height:340px;border-radius:14px;overflow:hidden;border:1px solid #dde5e4"></div>
    <div style="display:flex;gap:10px">
      <button id="pmOk" class="btn-primary" style="flex:1;justify-content:center">אישור</button>
      <button id="pmCancel" style="flex:1;background:#fff;color:#5d7473;border:1px solid #dde5e4;border-radius:12px;padding:12px;font-weight:600;cursor:pointer">ביטול</button>
    </div></div>`;
  document.body.appendChild(back);
  let chosen = hasCur?start:null;
  const pm=L.map($('#pickMap'),{zoomControl:true,attributionControl:false,minZoom:7,maxBounds:L.latLngBounds(IL_MAXBOUNDS),maxBoundsViscosity:1.0}).setView(start, hasCur?13:7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(pm);
  let mk = hasCur ? L.marker(start).addTo(pm) : null;
  pm.on('click',e=>{ chosen=[e.latlng.lat,e.latlng.lng]; if(mk) mk.setLatLng(chosen); else mk=L.marker(chosen).addTo(pm); });
  setTimeout(()=>pm.invalidateSize(),80);
  const close=()=>{ pm.remove(); back.remove(); };
  $('#pmClose').onclick=close; $('#pmCancel').onclick=close;
  $('#pmOk').onclick=()=>{ if(chosen){ state.form.gps=chosen[0].toFixed(5)+', '+chosen[1].toFixed(5); } close(); render(); };
}

/* ---------- export (sécurité) ---------- */
function doExport(){
  const blob=new Blob([JSON.stringify(state.stores,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='clients-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); flash('גיבוי נוצר');
}

/* ==========================================================================
   INITIALISATION (auth + données + temps réel)
   ========================================================================== */
let _entered=false, _channel=null, _channelTasks=null;
async function enterApp(){
  if(_entered) return;              // éviter un double-lancement
  _entered=true;
  state.loading=true; render();
  await reload();
  await loadTasks();
  await loadTrips();
  await loadMorning();
  state.loading=false; state.tab='list'; render();
  // sync temps réel entre appareils (un seul canal)
  if(!_channel){
    _channel = sb.channel('customers-live').on('postgres_changes',{event:'*',schema:'public',table:'customers'}, async ()=>{
      if(state.tab==='card') return; // ne pas écraser une fiche ouverte en cours de saisie
      await reload();
      render();
    });
    _channel.subscribe();
  }
  if(!_channelTasks){
    _channelTasks = sb.channel('tasks-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'tasks'}, async ()=>{
        await loadTasks();
        if(state.tab==='tasks'||state.tab==='trip'||state.tab==='card') render();
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'trips'}, async ()=>{
        await loadTrips();
        if(state.tab==='tasks'||state.tab==='trip') render();
      })
      // documents Morning : une synchro modifie des centaines de lignes d'un coup → on attend la fin avant de recharger
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_documents'}, morningChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_clients'}, morningChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_sync'}, morningChanged);
    _channelTasks.subscribe();
  }
}
let _morningTimer=null;
function morningChanged(){
  clearTimeout(_morningTimer);
  _morningTimer=setTimeout(async()=>{ await loadMorning(); refreshMoneyViews(); }, 1500);
}
function leaveApp(){
  _entered=false;
  if(_channel){ try{ sb.removeChannel(_channel); }catch(e){} _channel=null; }
  if(_channelTasks){ try{ sb.removeChannel(_channelTasks); }catch(e){} _channelTasks=null; }
  state.stores=[]; state.tasks=[]; state.trips=[]; state.mdocs=[]; state.mclients=[]; state.msync=null; state.tab='list'; state.sel=null; state.selTrip=null;
}

sb.auth.onAuthStateChange((event, session)=>{
  state.authReady=true;
  const had=!!state.user;
  state.user = session ? session.user : null;
  if(state.user && !had){ enterApp(); }
  else if(!state.user && had){ leaveApp(); render(); }
  else if(!state.user){ render(); }
});

// première vérification de session
sb.auth.getSession().then(({data})=>{
  state.authReady=true;
  if(data.session){ state.user=data.session.user; enterApp(); }
  else render();
});

window.matchMedia('(min-width:900px)').addEventListener('change',render);
render();
</script>
