}
// Fenêtre de l'heure de réception : confirmée pour CETTE livraison seulement
function dlTimeSheet(id){
  const s=state.tasks.find(x=>x.id===id); if(!s) return;
  const h=dlTimeHint(s), cur=s.receiveUntil||(h&&h.time)||'';
  const sh=trSheet('שעת קבלה', `<p style="margin:10px 0 0"><b>${esc(stopName(s))}</b></p>
    ${h?`<p class="tr-muted" style="margin:4px 0 0">מההערה: „${esc(h.excerpt)}”</p>`:''}
    <label for="dlRecv">קבלה עד</label><input id="dlRecv" type="time" value="${esc(cur)}">
    <p class="tr-muted" style="line-height:1.55">האישור תקף למשלוח הזה בלבד, לא לביקורים הבאים של הלקוח.</p>
    <button class="tr-btn primary tr-full" data-ok>אישור השעה</button>
    ${s.receiveUntil?'<button class="tr-btn ghost tr-full" style="margin-top:6px" data-clear>ביטול האישור</button>':''}`);
  sh.q('[data-ok]').onclick=()=>{ const v=sh.q('#dlRecv').value; if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) return flash('יש לבחור שעה'); sh.close(); dlSetTime(id, v); };
  const c=sh.q('[data-clear]'); if(c) c.onclick=()=>{ sh.close(); dlSetTime(id, ''); };
}
function dlSuggestSheet(tripId){
  const t=state.trips.find(x=>x.id===tripId); if(!t) return;
  const plan=dlPlanStops(tripId), byId=new Map(plan.map(p=>[p.id,p]));
  const res=RoutePlan.suggest(plan, dlStartLL(t), dlEndLL(t));
  const nm=id=>esc(stopName(state.tasks.find(x=>x.id===id)||{}));
  if(!res.order){
    const sh=trSheet('הצעת סדר', `<p style="line-height:1.6;margin-top:10px">חסר מיקום מדויק ל-${res.missing.length===1?'עצירה אחת':res.missing.length+' עצירות'}. בלי מיקום אי אפשר להציע סדר. הסדר הידני נשמר.</p>
      <ul class="tr-dellist">${res.missing.map(id=>`<li>${nm(id)}</li>`).join('')}</ul>
      <p class="tr-muted">משלימים את המיקום בתיק הלקוח (לשונית „פרטים” › מיקום) ומנסים שוב.</p>
      <button class="tr-btn primary tr-full" style="margin-top:14px" data-ok>הבנתי</button>`);
    sh.q('[data-ok]').onclick=sh.close; return;
  }
  const cur=plan.map(p=>p.id), same=res.order.every((id,k)=>id===cur[k]);
  const curIdx=new Map(cur.map((id,k)=>[id,k]));
  const ctag=(id,k,prop)=>{ const p=byId.get(id);
    if(p.handled) return '<span class="dl-ctag done">טופל</span>';
    if(p.locked) return '<span class="dl-ctag lock">'+dlIc('lock')+'נעול</span>';
    return prop && curIdx.get(id)!==k ? '<span class="dl-ctag moved">הוזז · היה '+(curIdx.get(id)+1)+'</span>' : ''; };
  const col=(ids,title,prop)=>`<div><h4 style="margin:0 0 6px">${title}</h4><ol class="dl-cmp">${ids.map((id,k)=>{ const mv=prop&&!byId.get(id).handled&&!byId.get(id).locked&&curIdx.get(id)!==k;
    return `<li class="${byId.get(id).handled?'done':''}${mv?' moved':''}">${nm(id)}${ctag(id,k,prop)}</li>`; }).join('')}</ol></div>`;
  const movedN=res.order.filter((id,k)=>curIdx.get(id)!==k).length;
  const startTxt = parseLL(t.startGps) ? 'מנקודת היציאה שנבחרה' : t.startAddr ? 'מנקודת היציאה (לפי חיפוש אוטומטי של הכתובת)' : 'בלי נקודת יציאה: ההצעה מתחילה מהעצירה הראשונה';
  const sh=trSheet('הצעת סדר', `<div class="dl-note warn" style="margin-top:10px">${dlIc('alert')}<span>לפי מרחק בקו אוויר, לא לפי כבישים. בלי זמני נסיעה ובלי בדיקת שעות קבלה. ${startTxt}. עצירות שטופלו ועצירות נעולות לא זזות.</span></div>
    ${same?`<p style="margin:14px 0 0"><b>הסדר הנוכחי כבר הקצר ביותר בקו אוויר.</b></p>`:`<p style="margin:14px 0 0"><b>${movedN===1?'עצירה אחת תוזז':movedN+' עצירות יוזזו'}.</b> עצירות שטופלו ועצירות נעולות נשארות במקומן.</p><div class="dl-cmpgrid">${col(cur,'הסדר הנוכחי',false)}${col(res.order,'הסדר המוצע',true)}</div>`}
    ${same?'':`<button class="tr-btn primary tr-full" style="margin-top:16px" data-ok>החלת הסדר המוצע</button>`}
    <button class="tr-btn ghost tr-full" style="margin-top:6px" data-no>${same?'סגירה':'שמירת הסדר שלי'}</button>`);
  sh.q('[data-no]').onclick=sh.close;
  const ok=sh.q('[data-ok]'); if(ok) ok.onclick=async()=>{ sh.close(); await dlApplyOrder(tripId, res.order, 'הסדר המוצע הוחל'); };
}
// Lien privé : la carte complète dans une fenêtre
function dlLinkPanel(tripId){
  const t=state.trips.find(x=>x.id===tripId); if(!t) return;
  const sh=trSheet('ניהול קישור לנהג', `<div class="dl-linkpanel">${linkCard(t)}</div>`);
  sh.el.addEventListener('click', e=>{ if(e.target.closest('[data-dl-linknew],[data-dl-linkextend],[data-dl-linkrevoke]')) sh.close(); }, true);
  wireLinks();
}
// Départ / heure / arrivée : enregistrés tout de suite ; une adresse choisie dans la liste garde sa position exacte
function wireDepart(t){
  const save=async fields=>{ const { error }=await sb.from('trips').update(fields).eq('id',t.id);
    if(error){ console.error(error); flash('שגיאה בשמירה'); return; } await loadTrips(); render(); };
  for(const [inputId, hitsId, addrCol, gpsCol, cur] of [['dlStart','dlStartHits','start_addr','start_gps',t.startAddr],['dlEnd','dlEndHits','end_addr','end_gps',t.endAddr]]){
    const input=$('#'+inputId), box=$('#'+hitsId); if(!input) continue;
    let pickedAt=0;
    addressSuggest(input.closest('.dl-depart'), input, box, x=>{ if(!x) return; pickedAt=Date.now();
      save({ [addrCol]:x.value, [gpsCol]:x.ll?x.ll[0]+', '+x.ll[1]:null }); flash('הכתובת נשמרה'); });
    input.addEventListener('blur', ()=>setTimeout(()=>{   // texte tapé sans choisir : gardé, mais sans position exacte
      if(Date.now()-pickedAt<1500) return;
      const v=input.value.trim(); if(v===(cur||'').trim()) return;
      save({ [addrCol]:v||null, [gpsCol]:null });
    }, 350));
  }
  const tm=$('#dlTime'); if(tm) tm.onchange=()=>save({ start_time:tm.value||null });
}
function wireDeliveryPlan(){
  const t=state.trips.find(x=>x.id===state.selTrip); if(!t || t.kind!=='delivery' || state.tab!=='trip') return;
  document.querySelectorAll('[data-dl-first]').forEach(b=> b.onclick=()=>dlMakeFirst(t.id, b.dataset.dlFirst));
  document.querySelectorAll('[data-dl-move]').forEach(b=> b.onclick=()=>{ const plan=dlPlanStops(t.id), id=b.dataset.dlMove, dir=+b.dataset.dir;
    const why=RoutePlan.moveBlock(plan, id, dir); if(why) return flash(dlBlockText(why, dir));
    dlApplyOrder(t.id, RoutePlan.move(plan, id, dir)); });
  document.querySelectorAll('[data-dl-more]').forEach(b=> b.onclick=()=>dlMoreSheet(b.dataset.dlMore));
  document.querySelectorAll('[data-dl-order]').forEach(b=> b.onclick=()=>dlOrderSheet(b.dataset.dlOrder));
  document.querySelectorAll('[data-dl-timeedit]').forEach(b=> b.onclick=()=>dlTimeSheet(b.dataset.dlTimeedit));
  document.querySelectorAll('[data-dl-lock]').forEach(b=> b.onclick=()=>dlToggleLock(b.dataset.dlLock));
  document.querySelectorAll('[data-dl-time]').forEach(b=> b.onclick=()=>dlSetTime(b.dataset.dlTime, b.dataset.val));
  document.querySelectorAll('[data-dl-suggest]').forEach(b=> b.onclick=()=>dlSuggestSheet(b.dataset.dlSuggest));
  document.querySelectorAll('[data-dl-linkpanel]').forEach(b=> b.onclick=()=>dlLinkPanel(b.dataset.dlLinkpanel));
  document.querySelectorAll('[data-dl-scroll]').forEach(b=> b.onclick=()=>{ const el=document.getElementById(b.dataset.dlScroll); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  wireDepart(t);
}

/* ---------- actions sur la tournée ---------- */
async function setTripDriver(t, driverId){
  const { error }=await sb.from('trips').update({ driver_id:driverId||null }).eq('id',t.id);
  if(error){ console.error(error); flash('שגיאה בשמירה'); return false; }
  await loadTrips(); return true;
}
async function notifyTrip(tripId, quiet){
  const r=await driversApi({ action:'notify', trip_id:tripId });
  await loadDelivery(); render();
  if(quiet) return r;
  if(!r.ok) flash('ההודעה לא נשלחה: '+drvErr(r));
  else flash(r.status==='sent'?'הודעת SMS נשלחה לנהג':r.status==='not_configured'?'המסלול זמין לנהג · שירות ה-SMS עוד לא הוגדר':'המסלול זמין לנהג · שליחת ה-SMS נכשלה');
  return r;
}
async function publishTrip(id){
  const t=state.trips.find(x=>x.id===id); if(!t) return;
  const d=driverOf(t.driverId), n=tripStops(t.id).length;
  if(!d||!d.active) return flash('יש לשייך נהג פעיל');
  if(!n) return flash('אין עצירות במסלול');
  if(!(await dlConfirm('שליחה לנהג', `לשלוח את <b>${esc(t.name||'המסלול')}</b> ל<b>${esc(d.name)}</b>?<br>הנהג יראה ${n===1?'משלוח אחד':n+' משלוחים'} במרחב הנהגים, ויקבל SMS עם קישור בלבד (בלי פרטי לקוחות).`, 'שליחה לנהג'))) return;
  const { error }=await sb.from('trips').update({ published_at:new Date().toISOString() }).eq('id',t.id);
  if(error){ console.error(error); return flash('שגיאה בשליחה'); }
  await loadTrips(); render();
  const r=await notifyTrip(t.id, true);
  flash(!r.ok ? 'המסלול נשלח לנהג · ההודעה לא נשלחה ('+drvErr(r)+')' : r.status==='sent' ? 'המסלול נשלח לנהג · הודעת SMS יצאה' : r.status==='not_configured' ? 'המסלול זמין לנהג · שירות ה-SMS עוד לא הוגדר' : 'המסלול זמין לנהג · שליחת ה-SMS נכשלה');
}
async function unpublishTrip(id){
  const t=state.trips.find(x=>x.id===id); if(!t) return;
  if(!(await dlConfirm('החזרה לטיוטה', `המסלול ייעלם מיד מהמסך של <b>${esc(driverName(t.driverId))}</b>. מה שכבר דווח נשמר.`, 'החזרה לטיוטה'))) return;
  const { error }=await sb.from('trips').update({ published_at:null }).eq('id',t.id);
  if(error){ console.error(error); return flash('שגיאה בשמירה'); }
  await loadTrips(); render(); flash('המסלול הוחזר לטיוטה');
}
async function moveTrip(id, newDriver){
  const t=state.trips.find(x=>x.id===id); if(!t||!newDriver) return;
  const from=driverName(t.driverId), to=driverName(newDriver);
  const ok=await dlConfirm(t.publishedAt?'העברה לנהג אחר':'החלפת נהג', t.publishedAt
    ? `להעביר את המסלול מ<b>${esc(from)}</b> ל<b>${esc(to)}</b>?<br>${esc(from)} יאבד מיד את הגישה למסלול ולתמונות. ${esc(to)} יקבל הודעה.`
    : `להחליף את הנהג ל<b>${esc(to)}</b>? המסלול נשאר טיוטה.`, t.publishedAt?'העברה':'החלפה');
  if(!ok){ render(); return; }
  if(!(await setTripDriver(t,newDriver))) return;
  render();
  if(t.publishedAt) await notifyTrip(t.id); else flash('הנהג הוחלף');
}
async function resolveProblem(id){
  if(await updateTask(id,{ problem_resolved_at:new Date().toISOString() })){ await loadTasks(); render(); flash('סומן כטופל'); }
}

const EV_LABELS = { assigned:'שויך לנהג', reassigned:'הועבר לנהג אחר', unassigned:'בוטל השיוך לנהג', published:'נשלח לנהג', unpublished:'הוחזר לטיוטה',
  notified:'הודעת SMS', signature:'נחתמה תעודה', link_created:'נוצר קישור לנהג', link_extended:'תוקף הקישור הוארך', link_revoked:'הקישור בוטל', status:'סטטוס', reopened:'נפתח מחדש', resolved:'הבעיה טופלה', proof:'התקבלה תמונה של תעודה' };
function eventLine(e){
  const viaL = e.via_link ? state.dlinks.find(l=>l.id===e.via_link) : null;
  const who = e.actor_kind==='link' ? 'דרך הקישור שניתן ל'+(viaL?driverName(viaL.driver_id):'נהג') : e.actor_kind==='driver'?'נהג מחובר':e.actor_kind==='staff'?'צוות':'מערכת';
  let what = EV_LABELS[e.kind]||e.kind;
  if(e.kind==='link_created') what += (e.from_value==='replaced'?' (הקודם בוטל)':'')+' · '+driverName(e.note)+' · תוקף עד '+dlDateTime(e.to_value);
  if(e.kind==='link_extended') what += ' עד '+dlDateTime(e.to_value);
  if(e.kind==='assigned'||e.kind==='published') what += ' · '+driverName(e.to_value);
  if(e.kind==='reassigned') what = 'הועבר מ'+driverName(e.from_value)+' ל'+driverName(e.to_value);
  if(e.kind==='unassigned') what += ' · '+driverName(e.from_value);
  if(e.kind==='notified') what += ' · '+({sent:'נשלחה',failed:'נכשלה',not_configured:'שירות SMS לא הוגדר'}[e.to_value]||e.to_value);
  if(e.kind==='status') what = Delivery.statusInfo(e.to_value).label;
  if(e.kind==='signature') what += ' · '+(e.to_value||'')+(e.note?' (מס׳ '+e.note+')':'');
  const task = e.task_id ? state.tasks.find(x=>x.id===e.task_id) : null;
  return `<div class="dl-ev"><span class="dl-evt">${esc(dlDateTime(e.at))}</span><span class="tr-grow">${task?'<b>'+esc(stopName(task))+'</b> · ':''}${esc(what)}${e.note&&e.kind==='status'?' — „'+esc(e.note)+'”':''} <span class="tr-muted">(${who})</span></span></div>`;
}

  all('[data-dl-publish]', b=> b.onclick=()=>publishTrip(b.dataset.dlPublish));
  all('[data-dl-unpublish]', b=> b.onclick=()=>unpublishTrip(b.dataset.dlUnpublish));
  all('[data-dl-unassign]', b=> b.onclick=async()=>{ const t=state.trips.find(x=>x.id===b.dataset.dlUnassign);

  all('[data-dl-notify]', b=> b.onclick=()=>{ b.disabled=true; notifyTrip(b.dataset.dlNotify); });

const linkErr = e => { const m = String((e && (e.message || e.details)) || ''); const k = Object.keys(LINK_ERR).find(x => m.includes(x)); return k ? LINK_ERR[k] : 'שגיאה. מנסים שוב.'; };
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){ } ta.remove(); return ok; }
}
// proposition d'expiration : le jour de la tournée à 22:00 (heure d'Israël), sinon dans 12 heures
function defaultLinkExpiry(t){
  const base = t.date && t.date >= todayStr() ? t.date : todayStr();
  const iso = Delivery.ilToUtcISO(base + 'T22:00');
  return Date.parse(iso) > Date.now() + 3600e3 ? base + 'T22:00' : Delivery.utcToIlInput(new Date(Math.ceil((Date.now() + 12 * 3600e3) / 3600e3) * 3600e3).toISOString());
}

function expiryField(id, value){
  const min=Delivery.utcToIlInput(new Date(Date.now()+10*60e3).toISOString()), max=Delivery.utcToIlInput(new Date(Date.now()+30*86400e3).toISOString());
  return `<label for="${id}">תוקף הקישור עד <span class="tr-muted">(שעון ישראל)</span></label>
    <input id="${id}" type="datetime-local" class="ltr" value="${esc(value)}" min="${min}" max="${max}">`;
}
function checkExpiry(v){
  const iso=Delivery.ilToUtcISO(v);
  if(!iso) return [null,'יש לבחור תאריך ושעה'];
  if(Date.parse(iso) < Date.now()+5*60e3) return [null,'התוקף צריך להיות בעתיד (5 דקות לפחות)'];
  if(Date.parse(iso) > Date.now()+31*86400e3) return [null,'אפשר עד 31 יום'];
  return [iso,''];
}

function tripTimeline(c){
  const rows = c.path.map((p,i)=>{
    const isStart=i===0, isEnd=i===c.path.length-1, last=isEnd;
    const num = isStart?'📍':isEnd?'🏁':String(i).padStart(2,'0');
    const t = (!isStart&&!isEnd)?p.task:null;
    const cust = t?taskCustomer(t):null;
    const done = !!(t&&t.done);
    const nodeBg = (isStart||isEnd)?'#0a3e3e':(done?'#1a8a4a':'#0d4d4d');
    let title, subs=[];
    if(isStart){ title='נקודת יציאה'; if(state.route.startAddr) subs.push('📍 '+esc(state.route.startAddr)); }
    else if(isEnd){ title='נקודת סיום'; subs.push(state.route.endAddr?('📍 '+esc(state.route.endAddr)):'חזרה לנקודת היציאה'); }
    else { title=esc((cust&&cust.name)||p.name||(t&&t.title)||'');
      if(t&&t.city) subs.push('🏙️ '+esc(t.city));
      if(t&&t.title) subs.push((TASK_TYPES[t.type]||TASK_TYPES.other).icon+' '+esc(t.title)); }
    const ll=p.ll, waze = ll?('https://waze.com/ul?ll='+ll[0]+','+ll[1]+'&navigate=yes'):null;
    const topSeg=`<div style="width:2px;height:6px;background:${isStart?'transparent':'#d3dddb'}"></div>`;
    const botSeg=`<div style="width:2px;flex:1;min-height:6px;background:${isEnd?'transparent':'#d3dddb'}"></div>`;
    const node=`<div style="flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:${nodeBg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${(isStart||isEnd)?'15px':'13px'};box-shadow:0 1px 3px rgba(0,0,0,.22)">${num}</div>`;
    const rail=`<div style="align-self:stretch;display:flex;flex-direction:column;align-items:center;flex:0 0 30px">${topSeg}${node}${botSeg}</div>`;
    const time=`<div style="flex:0 0 42px;text-align:start;font-size:12px;color:#8b9c9a;font-weight:700;padding-top:14px;font-family:Assistant">${p.eta||''}</div>`;
    const subHtml = subs.length?`<div style="font-size:12.5px;color:#7b908e;margin-top:2px;display:flex;flex-direction:column;gap:1px">${subs.map(s=>`<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s}</span>`).join('')}</div>`:'';
    const toggle = t?`<button data-toggletask="${t.id}" title="סמן כבוצע" style="width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2px solid ${done?'#1a8a4a':'#ccd6d5'};background:${done?'#1a8a4a':'#fff'};color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px">${done?'✓':''}</button>`:'';
    const nav = waze?`<a href="${waze}" target="_blank" title="ניווט" style="width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#e7f6fb;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px">🧭</a>`:'';
    const clickAttr = t?`data-edittask="${t.id}"`:'';

        <div style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${done?'color:#9fb0ae;text-decoration:line-through':'color:#16302f'}">${title}</div>
        ${subHtml}
      </div>${nav}${toggle}
    </div>`;
    return `<div style="display:flex;gap:10px;padding:0 14px;${last?'':'border-bottom:1px solid #eef3f2'};background:${done?'#f6fbf8':'#fff'}">${time}${rail}${content}</div>`;
  }).join('');
  return `<div style="background:#fff;border:1px solid #e3e9e8;border-radius:16px;overflow:hidden">${rows}</div>`;

function syncTripMap(){
  const el=$('#tripMap'); if(!el) return;
  if(!window.L){ setTimeout(syncTripMap,250); return; }
  if(_tripMap && _tripMap.getContainer()!==el){ try{_tripMap.remove();}catch(e){} _tripMap=null; }
  if(!_tripMap){
    _tripMap=L.map(el,{zoomControl:true,attributionControl:false,minZoom:6}).setView([31.6,34.9],8);
    addBaseTiles(_tripMap);
  }
  _tripMap.eachLayer(l=>{ if(l instanceof L.Marker || l instanceof L.Polyline) _tripMap.removeLayer(l); });
  const c=(state.route.computed&&state.route.tripId===state.selTrip&&state.route.computed.path)?state.route.computed:null;
  const drawMarker=(ll,label,sub,numHtml,color)=>{
    const waze='https://waze.com/ul?ll='+ll[0]+','+ll[1]+'&navigate=yes';
    const gmap='https://www.google.com/maps/dir/?api=1&destination='+ll[0]+','+ll[1];
    const ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:'<div style="width:28px;height:28px;border-radius:50%;background:'+color+';color:#fff;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:Assistant">'+numHtml+'</div>'});
    L.marker(ll,{icon:ic}).addTo(_tripMap).bindPopup('<div style="text-align:right;min-width:160px"><div style="font-size:14.5px;font-weight:700;color:#16302f">'+esc(label)+'</div>'+(sub?'<div style="font-size:12px;color:#5d7473;margin:2px 0 8px">'+esc(sub)+'</div>':'<div style="height:6px"></div>')+'<div style="display:flex;gap:6px"><a href="'+waze+'" target="_blank" style="flex:1;text-align:center;background:#e7f6fb;color:#0a7ea4;border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;font-family:Assistant">Waze</a><a href="'+gmap+'" target="_blank" style="flex:1;text-align:center;background:#e6efee;color:#0d4d4d;border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;font-family:Assistant">Google</a></div></div>');
  };
  if(c){
    const lls=c.path.map(p=>p.ll);
    L.polyline(lls,{color:'#0d4d4d',weight:4,opacity:.65,dashArray:'2,8'}).addTo(_tripMap);
    c.path.forEach((p,i)=>{
      const isEnd=i===0||i===c.path.length-1;
      const num=i===0?'📍':(i===c.path.length-1?'🏁':String(i));
      const label=p.start?'נקודת יציאה':p.end?'נקודת סיום':(p.name||'');
      const sub=(!isEnd&&p.task)?((TASK_TYPES[p.task.type]||TASK_TYPES.other).icon+' '+p.task.title):'';
      drawMarker(p.ll,label,sub,num,isEnd?'#0a3e3e':'#0d4d4d');
    });
    let tt=0; const ensure=()=>{ if(!_tripMap||$('#tripMap')!==el)return; _tripMap.invalidateSize(); if(_tripMap.getSize().x===0&&tt++<40){setTimeout(ensure,120);return;} try{ _tripMap.fitBounds(lls,{padding:[35,35],maxZoom:14}); }catch(e){} };
    setTimeout(ensure,40);
    return;
  }
  // pas de trajet calculé → points simples
  (async()=>{
    const lls=[]; let i=0;
    for(const t of tripStops(state.selTrip)){
      i++; const cu=taskCustomer(t);
      let ll=(cu&&cu.gps)?parseLL(cu.gps):null; if(!ll && t.city) ll=await geocodeAddr(t.city);
      if(!ll) continue; lls.push(ll);
      drawMarker(ll,(cu&&cu.name)||t.title,(TASK_TYPES[t.type]||TASK_TYPES.other).icon+' '+t.title,String(i),'#0d4d4d');
      if($('#tripMap')!==el) return;
    }
    let tt=0; const ensure=()=>{ if(!_tripMap||$('#tripMap')!==el)return; _tripMap.invalidateSize(); if(_tripMap.getSize().x===0&&tt++<40){setTimeout(ensure,120);return;} if(lls.length){ try{ _tripMap.fitBounds(lls,{padding:[35,35],maxZoom:14}); }catch(e){} } };
    setTimeout(ensure,40);
  })();
}

/* ==========================================================================
   MSLOUL — circuit intelligent (optimisation de tournée façon "Circuit")
   ========================================================================== */
function parseLL(str){ const p=String(str||'').split(',').map(x=>parseFloat(x.trim())); return (p.length===2&&!isNaN(p[0])&&!isNaN(p[1]))?[p[0],p[1]]:null; }
async function geocodeAddr(addr){
  const ll=parseLL(addr); if(ll) return ll;
  if(!addr||!addr.trim()) return null;
  try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q='+encodeURIComponent(addr+', ישראל')); const j=await r.json(); if(j&&j[0]) return [ +(+j[0].lat).toFixed(6), +(+j[0].lon).toFixed(6) ]; }catch(e){}
  return null;
}
async function taskLocation(t){
  const c=taskCustomer(t);
  if(c&&c.gps){ const ll=parseLL(c.gps); if(ll) return ll; }
  if(t.city){ const g=await geocodeAddr(t.city); if(g) return g; }
  return null;
}
function haversine(a,b){ const R=6371,toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]),dLng=toR(b[1]-a[1]); const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function pathLen(pts){ let d=0; for(let i=0;i<pts.length-1;i++) d+=haversine(pts[i].ll,pts[i+1].ll); return d; }
function optimize(start,stops,end){
  const rem=stops.slice(), order=[]; let cur=start;
  while(rem.length){ let bi=0,bd=Infinity; rem.forEach((s,i)=>{const d=haversine(cur.ll,s.ll); if(d<bd){bd=d;bi=i;}}); order.push(rem[bi]); cur=rem[bi]; rem.splice(bi,1); }
  let path=[start,...order,end], improved=true, guard=0;
  while(improved && guard++<50){ improved=false;
    for(let i=1;i<path.length-2;i++) for(let k=i+1;k<path.length-1;k++){
      const np=path.slice(0,i).concat(path.slice(i,k+1).reverse(),path.slice(k+1));
      if(pathLen(np)<pathLen(path)-1e-9){ path=np; improved=true; }
    }
  }
  return path;
}
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m?(+m[1])*60+(+m[2]):8*60; }
function fmtHM(min){ min=Math.round(min); const h=Math.floor(min/60)%24, mm=((min%60)+60)%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function applyEtas(path){ // heure estimée par arrêt : distance (×facteur route) / vitesse + temps de visite
  const ROAD=1.3, SPEED=50, VISIT=15; let t=parseHM(state.route.startTime||'08:00');
  path[0].eta=fmtHM(t);
  for(let i=1;i<path.length;i++){ t+=haversine(path[i-1].ll,path[i].ll)*ROAD/SPEED*60; path[i].eta=fmtHM(t); if(i<path.length-1) t+=VISIT; }
}
async function computeRoute(){
  state.route.computing=true; render();
  const date=state.route.date;
  const startLL=await geocodeAddr(state.route.startAddr);
  const endLL=await geocodeAddr(state.route.endAddr) || startLL;
  if(!startLL){ state.route.computing=false; render(); flash('לא נמצאה כתובת יציאה'); return; }
  const dayTasks = state.route.tripId ? state.tasks.filter(t=>t.tripId===state.route.tripId && !t.done) : state.tasks.filter(t=>!t.done && t.dueDate===date);
  const stops=[];
  for(const t of dayTasks){ const ll=await taskLocation(t); if(ll) stops.push({ task:t, ll, name:(taskCustomer(t)||{}).name || t.city || t.title }); }
  if(!stops.length){ state.route.computing=false; state.route.computed={empty:true,date}; render(); return; }
  const path=optimize({ll:startLL,name:'יציאה',start:true}, stops, {ll:endLL,name:'סיום',end:true});
  const total=pathLen(path);
  applyEtas(path);
  state.route.computed={ path, total, startLL, endLL, date };
  state.route.computing=false; render();
}

  const wp=c.path.slice(1,-1).map(p=>p.ll[0]+','+p.ll[1]).join('|');
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+c.startLL[0]+','+c.startLL[1]+'&destination='+c.endLL[0]+','+c.endLL[1];
  if(wp) u+='&waypoints='+encodeURIComponent(wp);
  return u;
}

function syncRouteMap(){
  const el=$('#routeMap'); if(!el||!window.L) return;
  const c=state.route.computed; if(!c||!c.path) return;
  if(_routeMap && _routeMap.getContainer()!==el){ try{_routeMap.remove();}catch(e){} _routeMap=null; }
  if(!_routeMap){
    _routeMap=L.map(el,{zoomControl:true,attributionControl:false}).setView([31.6,34.9],8);
    addBaseTiles(_routeMap);
  }
  _routeMap.eachLayer(l=>{ if(l instanceof L.Marker || l instanceof L.Polyline) _routeMap.removeLayer(l); });
  const lls=c.path.map(p=>p.ll);
  L.polyline(lls,{color:'#0d4d4d',weight:4,opacity:.7,dashArray:'2,8'}).addTo(_routeMap);
  c.path.forEach((p,i)=>{
    const isEnd=i===0||i===c.path.length-1;
    const num=i===0?'📍':(i===c.path.length-1?'🏁':i);
    const ic=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:'<div style="width:28px;height:28px;border-radius:50%;background:'+(isEnd?'#0a3e3e':'#0d4d4d')+';color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:Assistant">'+num+'</div>'});
    L.marker(p.ll,{icon:ic}).addTo(_routeMap);
  });
  let t=0; const ensure=()=>{ if(!_routeMap||!$('#routeMap'))return; _routeMap.invalidateSize(); if(_routeMap.getSize().x===0&&t++<40){setTimeout(ensure,120);return;} try{_routeMap.fitBounds(lls,{padding:[40,40]});}catch(e){} };
  setTimeout(ensure,40);
}

async function reload(){
  const { data, error } = await sb.from('customers').select('*').order('created_at',{ascending:true});
  if(error){ flash('שגיאה בטעינת הנתונים'); console.error(error); return; }

/* ---------- géolocalisation automatique par adresse (OpenStreetMap) ---------- */
async function geocode(store){
  const q=[store.street, store.city, 'ישראל'].filter(x=>x&&x.trim()).join(', ');
  if(!(store.city||'').trim() && !(store.street||'').trim()) return null;
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q='+encodeURIComponent(q);
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(j&&j[0]&&j[0].lat) return (+j[0].lat).toFixed(5)+', '+(+j[0].lon).toFixed(5);
  }catch(e){}
  return null;
}

/* ---------- suppression d'un client ---------- */
async function deleteStore(){
  const s=state.stores.find(x=>x.id===state.sel);
  if(!(await uiConfirm('למחוק את הלקוח "'+((s&&s.name)||'')+'"? פעולה זו אינה הפיכה.'))) return;
  // supprimer les fichiers du stockage
  const paths=(s&&s.docs||[]).map(d=>d.path).filter(Boolean);
  if(paths.length){ try{ await sb.storage.from(BUCKET).remove(paths); }catch(e){} }
  const { error } = await sb.from('customers').delete().eq('id',state.sel);
  if(error){ flash('שגיאה במחיקה'); console.error(error); return; }
  await reload(); state.tab='list'; state.sel=null; render(); flash('הלקוח נמחק');
}

/* ---------- documents ---------- */
async function handleFiles(files){
  if(!state.form.id) state.form.id=uid();
  for(const file of files){
    const docId=uid();
    const path=state.form.id+'/'+docId;
    const kind = file.type==='application/pdf' ? 'PDF' : ((file.name.split('.').pop()||'').toUpperCase().slice(0,4) || 'קובץ');
    flash('מעלה קובץ...');
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType:file.type, upsert:true });
    if(error){ flash('שגיאה בהעלאת הקובץ'); console.error(error); continue; }
    state.form.docs.push({ id:docId, name:file.name.replace(/\.[^.]+$/,'').slice(0,40)||'מסמך', kind, mime:file.type, path });
  }
  // si la fiche existe déjà et qu'on est en consultation, on enregistre tout de suite
  if(state.mode==='view' && state.sel){
    await sb.from('customers').update({ docs:state.form.docs, updated_at:new Date().toISOString() }).eq('id',state.sel);
    await reload();
  }
  render(); flash('המסמך נוסף');
}
async function openDoc(id){
  const d=(state.form.docs||[]).find(x=>x.id===id);
  if(!d||!d.path){ flash('לא נמצא קובץ'); return; }
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.path, 120);
  if(error||!data){ flash('לא ניתן לפתוח את המסמך'); return; }
  window.open(data.signedUrl,'_blank');
}
async function removeDoc(id){
  const d=(state.form.docs||[]).find(x=>x.id===id);
  if(d&&d.path){ try{ await sb.storage.from(BUCKET).remove([d.path]); }catch(e){} }
  state.form.docs=state.form.docs.filter(x=>x.id!==id);
  if(state.mode==='view' && state.sel){
    await sb.from('customers').update({ docs:state.form.docs, updated_at:new Date().toISOString() }).eq('id',state.sel);
    await reload();
  }
  render();
}

/* ---------- lecteur PDF intégré (pdf.js, chargé seulement au premier PDF ouvert) ---------- */
const PDFJS_BASE='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
let _pdfjs=null;
function loadPdfJs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=PDFJS_BASE+'build/pdf.min.js';
    s.onload=()=>{ const lib=window.pdfjsLib; if(!lib){ _pdfjs=null; rej(new Error('pdfjs')); return; } lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'build/pdf.worker.min.js'; res(lib); };
    s.onerror=()=>{ _pdfjs=null; rej(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}
// Remet la page à sa taille normale si on l'a agrandie avec les doigts (sinon elle glisse de gauche à droite)
function resetPageZoom(){
  const vv=window.visualViewport; if(!vv || vv.scale<=1.01) return;
  const meta=document.querySelector('meta[name="viewport"]'); if(!meta) return;
  const orig=meta.getAttribute('content');
  meta.setAttribute('content', orig+', maximum-scale=1');
  setTimeout(()=>meta.setAttribute('content', orig), 400);
}

  if(!d||!d.pdf_path){ flash('ה-PDF עוד לא הועתק — נסו שוב בעוד כמה דקות'); return; }
  const k=alt?null:MDOC_KINDS[d.type], title=alt ? alt.title : ((k&&k.label)||'מסמך')+' '+(d.number||'');
  const back=document.createElement('div'); back.className='modal-back'; back.style.zIndex='1200'; back.style.padding='0';
  back.innerHTML=`<div style="background:#e9eeee;width:100%;height:100%;max-width:920px;display:flex;flex-direction:column">

      <button id="pdfZoomOut" title="הקטנה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer">−</button>
      <span id="pdfZoomLbl" class="ltr" style="font-size:13px;font-weight:700;min-width:42px;text-align:center">100%</span>
      <button id="pdfZoomIn" title="הגדלה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer">+</button>
      <a id="pdfDl" target="_blank" rel="noopener" style="display:none;color:#fff;font-size:13.5px;font-weight:600;border:1px solid #ffffff66;border-radius:9px;padding:6px 11px">הורדה</a>
      <button id="pdfClose" title="סגירה" style="border:none;background:#ffffff26;color:#fff;border-radius:9px;width:36px;height:36px;font-size:19px;cursor:pointer">×</button>
    </div>
    <div id="pdfPages" style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px"><div class="spinner" style="margin:50px auto"></div></div>
  </div>`;
  document.body.appendChild(back);
  let onPinch=null, pinchTimer=null;
  const close=()=>{ back.remove(); document.removeEventListener('keydown',onKey); if(onPinch&&window.visualViewport) visualViewport.removeEventListener('resize',onPinch); clearTimeout(pinchTimer); resetPageZoom(); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',onKey);
  $('#pdfClose',back).onclick=close;

    const lib=await loadPdfJs();

    if(!back.isConnected) return;
    const fit=Math.max(260, Math.min(box.clientWidth-24, 880));
    const ZOOMS=[1,1.5,2,3]; let zi=0, renderId=0, pinchDone=1;
    const pinch=()=>Math.min(4, Math.max(1, (window.visualViewport&&visualViewport.scale)||1));
    const renderAll=async()=>{
      const id=++renderId, cssW=Math.round(fit*ZOOMS[zi]);
      const density=(window.devicePixelRatio||1)*pinch(); pinchDone=pinch();
      $('#pdfZoomLbl',back).textContent=Math.round(ZOOMS[zi]*100)+'%';
      const keep = box.dataset.cssw===String(cssW);   // même taille : on remplace page par page, sans saut
      let cleared = keep;                              // sinon : l'ancien affichage reste jusqu'à la 1re page prête
      for(let p=1;p<=pdf.numPages;p++){
        if(!back.isConnected||id!==renderId) return;
        const page=await pdf.getPage(p);
        if(!back.isConnected||id!==renderId) return;   // un autre zoom a été demandé pendant le chargement
        const base=page.getViewport({scale:1});
        let scale=cssW*density/base.width;
        const area=base.width*base.height*scale*scale;
        if(area>10e6) scale*=Math.sqrt(10e6/area);          // limite mémoire des téléphones (~40 Mo par page)
        const vp=page.getViewport({scale});
        const cv=document.createElement('canvas');
        cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
        cv.style.cssText=`display:block;margin:0 auto 12px;width:${cssW}px;height:${Math.round(cssW*base.height/base.width)}px;background:#fff;border-radius:6px;box-shadow:0 2px 10px #0d4d4d22`;
        await page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise;
        if(!back.isConnected||id!==renderId) return;
        const old=keep ? box.children[p-1] : null;
        if(old) old.replaceWith(cv);
        else { if(!cleared){ box.innerHTML=''; box.dataset.cssw=String(cssW); cleared=true; } box.appendChild(cv); }
      }
    };
    $('#pdfZoomIn',back).onclick=()=>{ if(zi<ZOOMS.length-1){ zi++; renderAll(); } };
    $('#pdfZoomOut',back).onclick=()=>{ if(zi>0){ zi--; renderAll(); } };
    if(window.visualViewport){
      onPinch=()=>{ clearTimeout(pinchTimer); pinchTimer=setTimeout(()=>{ if(Math.abs(pinch()-pinchDone)>0.25) renderAll(); }, 350); };
      visualViewport.addEventListener('resize',onPinch);
    }
    await renderAll();
  }catch(e){
    console.error(e);
    if(box.isConnected) box.innerHTML='<div style="color:#b4462f;font-weight:600;margin-top:40px;text-align:center">לא ניתן להציג את ה-PDF — נסו את כפתור „הורדה”</div>';
  }
}
// Boutons de la partie comptabilité (appelé après chaque affichage)
function wireMoney(root){
  root.querySelectorAll('[data-mpdf]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); openMorningPdf(b.dataset.mpdf); });
  const la=root.querySelector('[data-ledgerall]'); if(la) la.onclick=()=>{ state.ledgerAll=!state.ledgerAll; render(); };
  const mr=root.querySelector('[data-mrefresh]'); if(mr) mr.onclick=async()=>{
    mr.disabled=true; mr.textContent='מעדכן...';
    const r=await requestMorningSync(state.sel);
    if(!r||!r.ok) flash('העדכון ממורנינג נכשל'); else if(r.skipped) flash('החשבון עודכן לפני פחות מ־2 דקות');
    await loadMorning(); refreshMoneyViews();
  };
}
// Après une mise à jour Morning : redessine (sans couper une recherche en cours)
function refreshMoneyViews(){
  if(['money','list','profile','today','trip','map'].includes(state.tab)) softRender();
}
/* ==========================================================================
   כספים — les soldes clients (Morning) : qui doit, combien, depuis quand
   ========================================================================== */
function debtorRows(){
  const d=todayStr();
  return state.stores.map(c=>{ const docs=customerDocs(c.id); return { c, due:Ledger.openDebt(docs), od:Ledger.overdueDebt(docs,d) }; })
    .filter(x=>x.due>0);
}
function screenMoney(){
  const debtors=debtorRows();
  const total=debtors.reduce((s,x)=>s+x.due,0), overdue=debtors.reduce((s,x)=>s+x.od,0);
  const month=todayStr().slice(0,7);
  const monthRec=state.mdocs.filter(d=>(d.type===400||d.type===320) &&(d.doc_date||'').slice(0,7)===month).reduce((s,d)=>s+d.amount,0);
  const linkedIds=new Set(state.mclients.map(c=>c.customer_id));
  const unlinked=state.stores.filter(s=>!linkedIds.has(s.id)).length;
  const ms=state.msync;
  const syncLine = ms&&ms.last_ok ? 'מסונכרן עם מורנינג · עודכן '+sinceLabel(ms.last_ok) : 'עוד לא בוצע עדכון ממורנינג';
  const metric=(label,val,mini)=>`<div class="u-metric"><span>${label}</span><strong>${val}</strong><div class="mini">${mini}</div></div>`;
  return `${uHeader('תמונה ברורה של היתרות','כספים',`<button class="u-btn ghost" data-msyncall>↻ רענון</button>`)}
    <p class="u-muted" style="margin:-16px 0 18px">${syncLine}${ms&&ms.last_error?` · <span style="color:#8a5a12">⚠ ${esc(ms.last_error)}</span>`:''}</p>
    <div class="u-metrics">
      ${metric('יתרות פתוחות', money(Math.round(total)), debtors.length===1?'לקוח אחד':debtors.length+' לקוחות')}
      ${metric('מתוכן בפיגור', money(Math.round(overdue)), 'לפי מועד התשלום במורנינג')}
      ${metric('נגבה החודש', money(Math.round(monthRec)), 'קבלות החודש')}
    </div>
    <input id="moneySearch" class="u-field" type="search" aria-label="חיפוש בכספים" placeholder="חיפוש לקוח, עיר או מספר מסמך" value="${esc(state.moneyQuery)}" autocomplete="off">
    <div class="u-filters"><button class="u-chip${!state.lateOnly?' on':''}" data-lateonly="0">כל היתרות</button><button class="u-chip${state.lateOnly?' on':''}" data-lateonly="1">בפיגור בלבד</button></div>
    <div id="moneyLists">${moneyListsHtml()}</div>
    <div class="u-help">מורנינג הוא מקור הנתונים, והם מתעדכנים אוטומטית. היתרה = מה שנשאר לתשלום בחשבוניות הפתוחות. תשלום שלא שויך לחשבונית מוצג בכרטיס הלקוח ואינו מנוכה מהיתרה.${unlinked?' '+(unlinked===1?'לקוח אחד לא מקושר':unlinked+' לקוחות לא מקושרים')+' למורנינג (אין ח.פ או שהח.פ לא נמצא).':''}</div>`;
}
// Recherche dans כספים : nom du client, ville, ou numéro de document
function moneyQueryMatch(store, doc){
  const q=(state.moneyQuery||'').trim().toLowerCase(); if(!q) return true;
  if(store && ((store.name||'').toLowerCase().includes(q) || (store.city||'').toLowerCase().includes(q))) return true;
  return !!(doc && String(doc.number||'').includes(q));
}
// Clients qui doivent (du plus gros au plus petit) + liste des documents, filtrés par la recherche
function moneyListsHtml(){
  const q=(state.moneyQuery||'').trim();
  const storeOf=id=>state.stores.find(s=>s.id===id);
  const debtors=debtorRows().filter(x=>moneyQueryMatch(x.c) && (!state.lateOnly || x.od>0)).sort((a,b)=>b.due-a.due);
  const f=state.moneyFilter||'open';
  const FILTERS={ all:null, invoice:[305,320], credit:[330], receipt:[400,320] };
  const openAll=Ledger.openInvoices(state.mdocs).filter(d=>moneyQueryMatch(storeOf(d.customer_id), d) && (!state.lateOnly || Ledger.daysLate(d,todayStr())>0));
  const listAll = f==='open' ? openAll : state.mdocs.filter(d=> (!FILTERS[f] || FILTERS[f].includes(d.type)) && moneyQueryMatch(storeOf(d.customer_id), d));
  const list = state.moneyAll ? listAll : listAll.slice(0,60);
  const rows = f==='open' ? list.map(d=>invRow(d,true)).join('') : list.map(d=>docRow(d,true)).join('');
  const chip=(id,label)=>`<button class="u-chip${f===id?' on':''}" data-moneyfilter="${id}">${label}</button>`;
  return `<p class="u-muted" style="margin:0">${debtors.length?'מהיתרה הגבוהה לנמוכה':''}</p>
    <div class="u-card pad0">${debtors.length?debtors.map(x=>clientRow(x.c,'account')).join(''):`<div class="u-empty">${q||state.lateOnly?'אין יתרות תואמות':'✓ אין יתרות פתוחות'}</div>`}</div>
    <div class="u-sechead"><h2>${f==='open'?'חשבוניות פתוחות':'מסמכים'}</h2></div>
    <div class="u-filters" style="margin-top:0">${chip('open','פתוחות ('+openAll.length+')')}${chip('all','הכל')}${chip('invoice','חשבוניות')}${chip('credit','זיכויים')}${chip('receipt','קבלות')}</div>
    <div class="u-card pad0">${rows||`<div class="u-empty">${f==='open'?(q?'לא נמצאו חשבוניות פתוחות':'✓ אין חשבוניות פתוחות'):(q?'לא נמצאו מסמכים':'אין מסמכים — עוד לא בוצע עדכון ממורנינג')}</div>`}</div>
    ${listAll.length>list.length?`<button class="u-btn ghost u-full" data-moneyall>הצג את כל ${listAll.length} המסמכים</button>`:''}`;
}
// Boutons des listes de כספים (rappelé après chaque frappe dans la recherche, sans redessiner la page)
function wireMoneyLists(root){
  root.querySelectorAll('[data-moneyfilter]').forEach(b=> b.onclick=()=>{ state.moneyFilter=b.dataset.moneyfilter; state.moneyAll=false; refreshMoneyLists(); });
  const ma=root.querySelector('[data-moneyall]'); if(ma) ma.onclick=()=>{ state.moneyAll=true; refreshMoneyLists(); };
  wireMoney(root); bindOpen();
}
// « Ce qu'il doit » : la fiche du client, directement sur l'onglet חשבון
function openDebtPage(cid){ openProfile(cid,'account','money'); }
function refreshMoneyLists(){
  const box=$('#moneyLists'); if(!box){ render(); return; }
  box.innerHTML=moneyListsHtml(); wireMoneyLists(box);
}

/* ---------- choisir sur la carte ---------- */
function openPickMap(){
  const cur=(state.form.gps||'').split(',').map(x=>parseFloat(x.trim()));
  const hasCur = cur.length===2 && !isNaN(cur[0]);
  const start = hasCur ? [cur[0],cur[1]] : [31.7,34.95];
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;font-size:17px;font-weight:700;color:#0d4d4d">בחירת מיקום</h2>
      <button id="pmClose" style="border:none;background:#eef1f1;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="font-size:13px;color:#5d7473">לחצו על המפה כדי למקם את החנות</div>
    <div id="pickMap" style="height:340px;border-radius:14px;overflow:hidden;border:1px solid #dde5e4"></div>
    <div style="display:flex;gap:10px">
      <button id="pmOk" class="btn-primary" style="flex:1;justify-content:center">אישור</button>
      <button id="pmCancel" style="flex:1;background:#fff;color:#5d7473;border:1px solid #dde5e4;border-radius:12px;padding:12px;font-weight:600;cursor:pointer">ביטול</button>
    </div></div>`;
  document.body.appendChild(back);
  let chosen = hasCur?start:null;
  const pm=L.map($('#pickMap'),{zoomControl:true,attributionControl:false,minZoom:7,maxBounds:L.latLngBounds(IL_MAXBOUNDS),maxBoundsViscosity:1.0}).setView(start, hasCur?13:7);
  addBaseTiles(pm);
  let mk = hasCur ? L.marker(start).addTo(pm) : null;
  pm.on('click',e=>{ chosen=[e.latlng.lat,e.latlng.lng]; if(mk) mk.setLatLng(chosen); else mk=L.marker(chosen).addTo(pm); });
  setTimeout(()=>pm.invalidateSize(),80);
  const close=()=>{ pm.remove(); back.remove(); };
  $('#pmClose').onclick=close; $('#pmCancel').onclick=close;
  $('#pmOk').onclick=()=>{ close(); if(chosen) saveClientGps(chosen[0].toFixed(5)+', '+chosen[1].toFixed(5)); };
}

/* ---------- export (sécurité) ---------- */
function doExport(){
  const blob=new Blob([JSON.stringify(state.stores,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='clients-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); flash('גיבוי נוצר');
}

/* ==========================================================================
   INITIALISATION (auth + données + temps réel)
   ========================================================================== */
let _entered=false, _channel=null, _channelTasks=null;
async function enterApp(){
  if(_entered) return;              // éviter un double-lancement
  _entered=true;
  state.loading=true; render();
  // un compte livreur n'a rien à faire dans le CRM (et la base ne lui montrerait rien)
  try{ const { data:role } = await sb.rpc('my_role'); if(role && role!=='staff'){ state.noAccess=role; state.loading=false; render(); return; } }catch(e){}
  await reload();
  await loadTasks();
  await loadTrips();
  await loadDelivery();
  await loadMorning();
  state.loading=false; state.tab='today'; render();
  // sync temps réel entre appareils (un seul canal)
  if(!_channel){
    _channel = sb.channel('customers-live').on('postgres_changes',{event:'*',schema:'public',table:'customers'}, async ()=>{
      await reload();
      softRender();
    });
    _channel.subscribe();
  }
  if(!_channelTasks){
    _channelTasks = sb.channel('tasks-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'tasks'}, async ()=>{
        await loadTasks();
        if(['tasks','trip','profile','today','list'].includes(state.tab)) softRender();
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'trips'}, async ()=>{
        await loadTrips();
        if(['tasks','trip','today','map'].includes(state.tab)) softRender();
      })
      // livraisons : photos reçues, notifications, livreurs
      .on('postgres_changes',{event:'*',schema:'public',table:'delivery_proofs'}, deliveryChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'delivery_notifications'}, deliveryChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'delivery_signatures'}, deliveryChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'drivers'}, deliveryChanged)
      // documents Morning : une synchro modifie des centaines de lignes d'un coup → on attend la fin avant de recharger
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_documents'}, morningChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_clients'}, morningChanged)
      .on('postgres_changes',{event:'*',schema:'public',table:'morning_sync'}, morningChanged);
    _channelTasks.subscribe();
  }
}
let _morningTimer=null;
function morningChanged(){
  clearTimeout(_morningTimer);
  _morningTimer=setTimeout(async()=>{ await loadMorning(); refreshMoneyViews(); }, 1500);
}
function leaveApp(){
  _entered=false;
  if(_channel){ try{ sb.removeChannel(_channel); }catch(e){} _channel=null; }
  if(_channelTasks){ try{ sb.removeChannel(_channelTasks); }catch(e){} _channelTasks=null; }
  state.stores=[]; state.tasks=[]; state.trips=[]; state.drivers=[]; state.dproofs=[]; state.ddocs=[]; state.dnotes=[]; state.dsigs=[]; state.dlinks=[]; state.linkUrls={}; state.noAccess=null; state.mdocs=[]; state.mclients=[]; state.msync=null; state.docsBy=new Map(); state.tab='today'; state.sel=null; state.selTrip=null;
}

sb.auth.onAuthStateChange((event, session)=>{
  state.authReady=true;
  const had=!!state.user;
  state.user = session ? session.user : null;
  if(state.user && !had){ enterApp(); }
  else if(!state.user && had){ leaveApp(); render(); }
  else if(!state.user){ render(); }
});

// première vérification de session
sb.auth.getSession().then(({data})=>{
  state.authReady=true;
  if(data.session){ state.user=data.session.user; enterApp(); }
  else render();
});

window.matchMedia('(min-width:900px)').addEventListener('change',render);
render();
</script>
