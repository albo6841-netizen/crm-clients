<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסלולים · ניהול לקוחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./leaflet.min.css">
<script src="./leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./ledger.js"></script>
<script src="./tour.js"></script>
<script src="./insights.js"></script>
<script src="./delivery-core.js"></script>
<script src="./route-plan.js"></script>
<style>
  :root{
    --primary:#0d4d4d; --primary-hover:#12706b; --primary-light:#e6efee; --sidebar-box:#0a3e3e;
    --bg:#eef1f1; --card:#ffffff; --field:#fbfcfc;
    --border:#e3e9e8; --border2:#dde5e4; --border3:#dbe3e2;
    --text:#16302f; --text2:#5d7473; --text3:#7b908e; --on-dark:#bcd6d2; --on-dark2:#8fb5b1;
    --danger:#b4462f; --danger-bg:#fdf6f4; --danger-border:#e6dcd9;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  *{box-sizing:border-box;}
  body{font-family:Assistant,system-ui,sans-serif;color:var(--text);}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus{outline:2px solid #0d4d4d33;border-color:var(--primary)!important;}
  a{color:var(--primary);text-decoration:none;} a:hover{color:var(--primary-hover);}
  .leaflet-popup-content{margin:12px 14px;direction:rtl;font-family:Assistant,sans-serif;}
  .leaflet-container{font-family:Assistant,sans-serif;}
  .ltr{direction:ltr;text-align:right;}
  .row-store{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .row-store:hover{box-shadow:0 6px 18px #0d4d4d14;transform:translateY(-1px);}
  .card-sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;}
  .fld{border:1px solid var(--border2);border-radius:11px;padding:11px 12px;font-size:15px;color:var(--text);background:var(--field);width:100%;}
  .lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text2);font-weight:600;}
  .grid .lbl>.fld{margin-top:auto;}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px #0d4d4d29;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-soft{background:var(--primary-light);color:var(--primary);border:none;border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-soft:hover{background:#d7e6e4;}
  .btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);border-radius:13px;font-weight:600;cursor:pointer;}
  .btn-danger:hover{background:#f7e7e2;}
  .sec-title{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--primary);}
  .grid{display:grid;gap:12px;}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:#cdd8d7;border-radius:8px;}
  .modal-back{position:fixed;inset:0;background:#16302f66;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0d4d4d40;}
  .spinner{width:26px;height:26px;border:3px solid #cfe0de;border-top-color:#0d4d4d;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Téléphone : un champ en moins de 16px fait zoomer Safari (iPhone) sans revenir ensuite,
     et la page glisse alors de gauche à droite. 16px partout empêche ce zoom automatique. */
  @media (hover:none) and (pointer:coarse){ input,select,textarea{font-size:16px !important;} }
  /* ---- tournée (מסלולים) — design « Moins chercher. Mieux visiter. » ---- */
  .tr-screen{padding:23px 18px 16px;max-width:620px;width:100%;margin:0 auto;color:#173f3b}
  .tr-screen h1{font-size:29px;margin:4px 0;font-weight:800;letter-spacing:-.3px}
  .tr-screen h2,.tr-sheet h2{font-size:21px;margin:4px 0;font-weight:700;color:#173f3b}
  .tr-screen h3{font-size:18px;margin:0;font-weight:700}
  .tr-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tr-grow{flex:1;min-width:0}
  .tr-muted{font-size:14px;color:#6c7f79}
  .tr-card{display:block;padding:17px;background:#fff;border:1px solid #dde6e2;border-radius:19px;margin:13px 0;color:#173f3b;text-align:right;font:inherit}
  .tr-badge{background:#e6efee;border-radius:7px;padding:4px 8px;font-size:13px;font-weight:700;color:#0d4d4d;white-space:nowrap}
  .tr-debt{color:#b4462f;background:#fcf0eb}
  .tr-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:12px;background:#e6efee;color:#0d4d4d;padding:10px 14px;font:700 15px Assistant,sans-serif;cursor:pointer;text-decoration:none}
  .tr-btn:hover{filter:brightness(.95)} .tr-btn:focus-visible{outline:3px solid #c08a3c}
  .tr-btn.primary{background:#0d4d4d;color:#fff} .tr-btn.ghost{background:none} .tr-btn.danger{background:#b4462f;color:#fff}
  .tr-dellist{margin:0;padding:0 18px 0 0;line-height:1.65;color:#173f3b} .tr-dellist li+li{margin-top:4px}
  .tr-full{width:100%}
  .tr-link{background:none;border:0;padding:0;color:#0d4d4d;font:700 15px Assistant,sans-serif;cursor:pointer}
  .tr-progress{height:5px;background:#dbe5e1;margin:12px 0;border-radius:6px;overflow:hidden} .tr-progress i{display:block;height:100%;background:#559184;border-radius:6px}
  .tr-stats{display:flex;justify-content:space-around;text-align:center;margin:22px 0;gap:6px} .tr-stats b{font-size:24px;display:block;color:#173f3b} .tr-stats span{font-size:12px;color:#6c7f79}
  .tr-tabs{display:flex;background:#dfe8e4;padding:4px;border-radius:12px}
  .tr-tabs button{flex:1;background:none;border:0;min-height:39px;border-radius:10px;font:700 15px Assistant,sans-serif;color:#0d4d4d;cursor:pointer} .tr-tabs .on{background:#fff}
  .tr-next{border-color:#89afa3;border-right:4px solid #0d4d4d}
  .tr-actions{display:flex;gap:8px;margin-top:14px} .tr-actions>:first-child{flex:1}
  .tr-stop{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #e3eae7;align-items:flex-start} .tr-stop:last-child{border:0}
  .tr-num{border:1px solid #c9dcd4;border-radius:50%;width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;font-size:13px;background:#fff;color:#173f3b;cursor:pointer;padding:0}
  .tr-up{min-height:40px;width:40px;padding:0;flex:0 0 40px}
  .tr-done{opacity:.55}
  .tr-today{background:#0d4d4d;color:#fff;border-color:#0d4d4d} .tr-today h2{color:#fff;margin-top:15px} .tr-today p{margin:6px 0 12px;opacity:.9}
  .tr-dayrow{display:flex;align-items:center;gap:14px;width:100%;cursor:pointer}
  .tr-date{background:#e6efee;border-radius:12px;padding:10px;text-align:center;min-width:58px;color:#0d4d4d;font-size:13px} .tr-date b{display:block;font-size:23px;line-height:1.1}
  .tr-chev{color:#9fb0ae;font-size:22px}
  .tr-map{height:260px;border-radius:18px;overflow:hidden;border:1px solid #dde6e2;margin-top:13px;background:#e6ede4}
  .tr-sheet{width:390px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;padding:24px;border-radius:24px;color:#173f3b;box-shadow:0 20px 60px #0d4d4d40}
  .tr-sheet label{display:block;margin:15px 0 6px;font-size:14px;font-weight:700}
  .tr-sheet input,.tr-sheet textarea,.tr-sheet select{font:16px Assistant,sans-serif;border:1px solid #ccdcd4;border-radius:10px;padding:12px;width:100%;background:#fff;color:#173f3b}
  .tr-sheet textarea{height:80px;resize:vertical}
  .tr-chips{display:flex;flex-wrap:wrap;gap:7px}
  .tr-chip{min-height:40px;border:0;border-radius:12px;background:#e6efee;color:#0d4d4d;padding:8px 13px;font:700 14px Assistant,sans-serif;cursor:pointer} .tr-chip.on{background:#0d4d4d;color:#fff}
  .tr-checks{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto;border:1px solid #e3eae7;border-radius:12px;padding:6px}
  .tr-sheet label.tr-check{display:flex;align-items:center;gap:10px;margin:0;padding:8px;border-radius:9px;font-weight:400;cursor:pointer}
  .tr-sheet .tr-check input{width:20px;height:20px;flex:0 0 20px;padding:0;accent-color:#0d4d4d}
  .tr-check b{display:block;font-size:15px} .tr-check .tr-muted{font-size:12.5px}
  .tr-hits{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .tr-hit{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:1px solid #dbe6e1;border-radius:10px;background:#fff;padding:8px 12px;text-align:right;font:15px Assistant,sans-serif;color:#173f3b;cursor:pointer}
  .tr-hit .tr-muted{font-size:12.5px} .tr-hit .tr-plus{flex:0 0 auto;color:#0d4d4d;font-weight:800;font-size:13.5px}
  .tr-hit.on{background:#f1f6f4} .tr-hit.on .tr-plus{color:#4f7a52}
  .tr-del{display:block;margin:22px auto 6px;min-height:44px;padding:10px 18px;background:none;border:0;color:#b4462f;font:700 15px Assistant,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .tr-del:hover{color:#8f3320}
  .tr-tag{flex:0 0 auto;font-size:11.5px;background:#eef3e6;color:#3d5a2e;border-radius:8px;padding:2px 7px;white-space:nowrap}
  .tr-tag.br{background:#e7eef6;color:#2f4e6e}
  .tr-hit.chain{background:#f4f8f6;border-style:dashed}
  .tr-hits.open{max-height:min(320px,45vh);overflow:auto;overscroll-behavior:contain;border:1px solid #dbe6e1;border-radius:12px;padding:6px;background:#f7faf9}
  .tr-hit b{display:block;line-height:1.3}
  .tr-osm{font-size:11px;color:#8a9b98;padding:4px 4px 0;text-align:left;direction:ltr}
  .tr-addrok{margin-top:6px;font-size:13.5px;font-weight:700;color:#3d7a4f}
  .tr-hits:empty,.tr-addrok:empty{display:none}
  .tr-addr{display:block;margin-top:3px;font-size:14px;color:#2f4f4a;line-height:1.35} .tr-addr.none{color:#8a9b98;font-style:italic}
  /* ---- design commun de toute l'app (refonte du 01/11/2026, « מסלולים. ») ---- */
  .u-app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100vh;color:#193e38}
  .u-side{background:#0c3e3b;color:#fff;padding:32px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
  .u-brand{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px} .u-brand i{font-style:normal;color:#bad09f}
  .u-brand small{display:block;font-size:12px;color:#aec7ba;font-weight:400;margin-top:5px;letter-spacing:0}
  .u-side nav{display:grid;gap:7px;margin-top:42px}
  .u-side nav button{display:flex;align-items:center;text-align:right;background:none;color:#b7cdc0;border:0;border-radius:12px;min-height:44px;padding:10px 15px;font:700 16px Assistant,sans-serif;cursor:pointer}
  .u-side nav button.on{background:#ffffff16;color:#fff} .u-side nav button:hover{background:#ffffff0d}
  .u-side nav span{display:inline-block;width:29px}
  .u-side .u-sidenew{margin-top:28px;background:#cadbb8;color:#284c37}
  .u-sidefoot{margin-top:auto;padding-top:24px;color:#b3caba;font-size:12px;line-height:1.9}
  .u-sidefoot button,.u-mobfoot button{background:none;border:0;color:inherit;padding:0;font:600 12.5px Assistant,sans-serif;cursor:pointer;text-decoration:underline}
  .u-content{padding:34px 38px 80px;min-width:0}
  .u-mnav{display:none}
  .u-mobfoot{display:none}
  .u-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-radius:12px;padding:10px 15px;background:#e6efee;color:#0d4d4d;font:700 16px Assistant,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
  .u-btn:hover{filter:brightness(.96);color:#0d4d4d} .u-btn.primary:hover{color:#fff}
  .u-btn.primary{background:#0d4d4d;color:#fff} .u-btn.ghost{background:#fff;border:1px solid #dbe4dd} .u-btn.danger{background:#fcf0eb;color:#b4462f}
  .u-btn[disabled],.u-btn.off{opacity:.55;cursor:default;filter:none}
  .u-btn:focus-visible,.u-link:focus-visible,.u-chip:focus-visible,.u-cname:focus-visible,.u-pills button:focus-visible,.u-field:focus-visible,.u-side button:focus-visible,.u-mnav button:focus-visible{outline:3px solid #b88b47;outline-offset:2px}
  .u-link{background:none;border:0;padding:5px 8px;color:#497865;font:700 14px Assistant,sans-serif;cursor:pointer}
  .u-full{width:100%}
  .u-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .u-grow{flex:1;min-width:0}
  .u-muted{font-size:14px;color:#78897c}
  .u-small{font-size:12.5px}
  .u-late{color:#b4462f}
  .u-content h1{font-size:32px;letter-spacing:-.7px;margin:4px 0;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
  .u-content h2{font-size:22px;margin:0 0 8px;font-weight:700}
  .u-content h3{font-size:18px;margin:0;font-weight:700}
  .u-content p{line-height:1.6}
  .u-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
  .u-kicker{font-size:13px;color:#78897c}
  .u-card{background:#fff;border:1px solid #dde5de;border-radius:20px;padding:19px;margin:14px 0}
  .u-card.pad0{padding:0 18px}
  .u-dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
  .u-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:23px}
  .u-metric{background:#fff;border:1px solid #dde5dd;border-radius:18px;padding:18px;min-width:0}
  .u-metric strong{display:block;font-size:27px;white-space:nowrap;margin:6px 0;font-weight:800;overflow:hidden;text-overflow:ellipsis}
  .u-metric span{font-size:12px;color:#78897c} .u-metric .mini{font-size:12px;color:#4a715d}
  .money{white-space:nowrap;direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
  .u-hero{background:#0d4d4d;color:#fff;padding:25px;border-radius:24px;position:relative;overflow:hidden}
  .u-hero:before{content:'';width:180px;height:180px;border:32px solid #ffffff06;position:absolute;left:-70px;top:-75px;border-radius:50%;pointer-events:none}
  .u-content .u-hero h2{font-size:29px;margin:18px 0 7px;color:#fff;overflow-wrap:anywhere}
  .u-hero .u-muted{color:#b3cdbd}
  .u-hero .u-btn{background:#dce8d0;color:#234f3d}
  .u-badge{display:inline-block;font-size:13px;background:#e6efee;padding:4px 8px;border-radius:7px;color:#0d4d4d;white-space:nowrap;font-weight:700}
  .u-badge.debt{background:#fcf0eb;color:#b4462f}
  .u-progress{height:5px;background:#dde7de;border-radius:6px;overflow:hidden;margin:18px 0}
  .u-progress i{display:block;background:#79a38c;height:100%;border-radius:6px}
  .u-hero .u-progress{background:#ffffff20} .u-hero .u-progress i{background:#bfd3a5}
  .u-sechead{display:flex;justify-content:space-between;align-items:center;margin:23px 0 10px;gap:10px}
  .u-content .u-sechead h2{font-size:20px;margin:0}
  .u-sug{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid #e5ebe5} .u-sug:last-child{border:0}
  .u-sym{width:36px;height:36px;display:grid;place-items:center;flex-shrink:0;background:#eef2e4;border-radius:12px;font-weight:800;color:#0d4d4d}
  .u-content .u-sug h3{font-size:16px}
  .u-sug .u-btn{font-size:13px;padding:7px 10px;min-height:36px}
  .u-help{font-size:13px;color:#6d8069;background:#e6ece2;border-radius:12px;padding:13px;line-height:1.6;margin-top:15px}
  .u-task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e7ece7} .u-task:last-child{border:0}
  .u-task input{width:20px;height:20px;accent-color:#0d4d4d;flex:0 0 20px;margin:0}
  .u-task label{flex:1;min-width:0;cursor:pointer;line-height:1.4}
  .u-field{width:100%;font:16px Assistant,sans-serif;border:1px solid #d4dfd5;border-radius:12px;padding:12px;color:#193e38;background:#fff;min-height:46px}
  .u-label{display:block;font-size:14px;font-weight:700;margin:15px 0 6px}
  .u-filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 19px}
  .u-chip{background:#fff;border:1px solid #d9e3d9;min-height:40px;font:700 14px Assistant,sans-serif;border-radius:12px;padding:8px 13px;color:#0d4d4d;cursor:pointer}
  .u-chip.on{background:#0d4d4d;color:#fff;border-color:#0d4d4d}
  .u-crow{display:flex;align-items:center;gap:14px;padding:19px 0;border-bottom:1px solid #e3eae3;cursor:pointer} .u-crow:last-child{border:0}
  .u-avatar{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:15px;background:#e6efee;font-size:19px;font-weight:800;color:#0d4d4d}
  .u-cname{background:none;border:0;padding:0;text-align:right;font:700 18px Assistant,sans-serif;color:#193e38;cursor:pointer;min-height:30px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u-cmeta{font-size:13px;color:#78897c;margin-top:4px}
  .u-compact{width:44px;height:44px;flex:0 0 44px;padding:0;border:1px solid #dfe7dd;background:#f3f6ef;border-radius:12px;display:grid;place-items:center;text-decoration:none;color:#0d4d4d;font-size:17px;cursor:pointer}
  .u-empty{text-align:center;padding:35px 15px;color:#78897c}
  .u-back{background:none;border:0;padding:0;font:700 14px Assistant,sans-serif;color:#78897c;min-height:30px;cursor:pointer}
  .u-phead{display:flex;align-items:center;gap:16px;min-width:0}
  .u-phead .u-avatar{width:60px;height:60px;font-size:26px}
  .u-actions{display:flex;gap:9px;margin:20px 0} .u-actions>*{flex:1}
  .u-pills{display:flex;gap:25px;border-bottom:1px solid #dbe3d7;overflow-x:auto;margin:20px 0}
  .u-pills button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 0;color:#78897c;font:700 16px Assistant,sans-serif;white-space:nowrap;cursor:pointer}
  .u-pills button.on{color:#0d4d4d;border-color:#0d4d4d}
  .u-balance{background:#fcf0eb;border-radius:17px;padding:20px;margin:15px 0}
  .u-balance strong{font-size:33px;display:block;color:#b4462f;font-weight:800;margin:2px 0}
  .u-balance.clear{background:#eef6f1} .u-balance.clear strong{color:#1f7a5c}
  .u-detail{padding:12px 0;border-bottom:1px solid #e4ebe2} .u-detail:last-of-type{border:0}
  .u-detail>span{display:block;font-size:13px;color:#78897c;margin-bottom:5px}
  .u-event{border-right:2px solid #d9e3d5;margin-right:7px;padding:0 17px 20px}
  .u-event p{margin:6px 0 0;white-space:pre-line}
  .u-inv{padding:17px 0;border-bottom:1px solid #e4eae0} .u-inv:last-child{border:0}
  .u-content .u-inv h3{font-size:16px}
  .u-inv .u-amt{text-align:left;flex:0 0 auto}

async function loadMorning(){
  try{
    const docs=[];
    for(let from=0;;from+=1000){   // Supabase renvoie au plus 1000 lignes par demande
      const { data, error } = await sb.from('morning_documents').select('morning_id,customer_id,morning_client_id,type,number,status,doc_date,due_date,amount,amount_opened,description,pdf_path').order('doc_date',{ascending:false}).range(from, from+999);
      if(error) throw error;
      docs.push(...(data||[]));
      if(!data || data.length<1000) break;
    }
    state.mdocs = docs.map(d=>({ ...d, amount:Number(d.amount)||0, amount_opened:d.amount_opened==null?null:Number(d.amount_opened) }));
    state.docsBy = new Map();
    for(const d of state.mdocs){ if(!state.docsBy.has(d.customer_id)) state.docsBy.set(d.customer_id,[]); state.docsBy.get(d.customer_id).push(d); }
    const { data:cl } = await sb.from('morning_clients').select('morning_id,customer_id,name,balance_amount,synced_at');
    state.mclients = cl||[];
    const { data:st } = await sb.from('morning_sync').select('*').eq('id',1);
    state.msync = (st&&st[0])||null;
  }catch(e){ console.error(e); state.mdocs=[]; state.docsBy=new Map(); state.mclients=[]; state.msync=null; }
}
// Demande au serveur de mettre à jour depuis Morning (une fiche, ou tout si cid vide)
async function requestMorningSync(cid){
  try{

  }catch(e){ return null; }
}

function wireLogin(){
  const email=$('#loginEmail'), pass=$('#loginPass'), btn=$('#loginBtn'), err=$('#loginErr');
  const submit=async()=>{
    err.textContent='';
    if(!email.value.trim()||!pass.value){ err.textContent='נא למלא אימייל וסיסמה'; return; }
    btn.disabled=true; btn.textContent='מתחבר...';
    const { error } = await sb.auth.signInWithPassword({ email:email.value.trim(), password:pass.value });
    if(error){ err.textContent='אימייל או סיסמה שגויים'; btn.disabled=false; btn.textContent='כניסה'; return; }
    // onAuthStateChange s'occupe de charger l'appli
  };
  btn.onclick=submit;
  pass.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  email.onkeydown=e=>{ if(e.key==='Enter') pass.focus(); };
}

function clientCities(){ return [...new Set(state.stores.map(s=>(s.city||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he')); }
function clientMatches(s){
  if(state.clientCity && (s.city||'').trim()!==state.clientCity) return false;
  if(state.debtOnly && !(debtDue(s.id)>0)) return false;
  const q=(state.query||'').trim().toLowerCase(); if(!q) return true;
  const digits=q.replace(/\D/g,'');
  if([s.name,s.city,s.street,s.contact].some(v=>(v||'').toLowerCase().includes(q))) return true;
  return digits.length>=3 && [s.phone,s.phone2].some(p=>(p||'').replace(/\D/g,'').includes(digits));
}

function allMapPoints(){
  const pts=[];

    const city=(s.city||'').trim();
    const ll=parseLL(s.gps); if(ll) pts.push({ name:s.name, sub:[s.street,city].filter(Boolean).join(', '), ll, id:s.id, phone:s.phone, city });
    (s.branches||[]).forEach(b=>{ const bl=parseLL(b.gps); if(bl) pts.push({ name:(s.name||'')+' · '+(b.name||'סניף'), sub:[b.street,b.city].filter(Boolean).join(', '), ll:bl, id:s.id, phone:b.phone, isBranch:true, city:(b.city||'').trim()||city }); });
  });

}

// Fond OpenStreetMap, adouci par le style (classe u-soft) ; la mention des auteurs est obligatoire
function addBaseTiles(map){
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  L.control.attribution({ position:'bottomleft', prefix:false }).addTo(map);
  map.getContainer().classList.add('u-soft');
  return map;
}
function pinIcon(branch, sel){
  const s=sel?26:18;
  return L.divIcon({ className:'u-pinwrap', html:`<div class="u-pin${branch?' br':''}${sel?' sel':''}"></div>`, iconSize:[s,s], iconAnchor:[s/2,s/2] });
}
function clusterIcon(c){
  const n=c.getChildCount(), s=n<10?40:n<25?46:52;
  return L.divIcon({ className:'u-mc', html:`<div>${n}</div>`, iconSize:[s,s] });
}
let _cluster=null, _selMarker=null;
function syncMap(fit){
  const el=$('#map'); if(!el) return;
  if(!window.L){ setTimeout(()=>syncMap(fit),250); return; }   // attendre que Leaflet finisse de charger
  // si on revient sur l'onglet carte, le conteneur a été recréé → recréer la carte dessus
  if(_map && _map.getContainer() !== el){ try{ _map.remove(); }catch(e){} _map=null; _cluster=null; _selMarker=null; _didFit=false; }
  if(!_map){
    _map=L.map(el,{zoomControl:false,attributionControl:false,minZoom:7,maxBounds:L.latLngBounds(IL_MAXBOUNDS),maxBoundsViscosity:1.0}).setView([31.6,34.9],8);
    addBaseTiles(_map);
    L.control.zoom({ position:'topleft', zoomInTitle:'הגדלה', zoomOutTitle:'הקטנה' }).addTo(_map);
    _map.on('click', closeMapCard);
  }
  if(_cluster) _map.removeLayer(_cluster);
  _selMarker=null;
  // clients proches regroupés (un chiffre) ; toucher un groupe = s'en approcher
  _cluster = L.markerClusterGroup
    ? L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:40, spiderfyOnMaxZoom:true, iconCreateFunction:clusterIcon })
    : L.layerGroup();
  const pts=[], seen={};
  mapPoints().forEach(p=>{
    let lat=p.ll[0], lng=p.ll[1];
    const key=lat.toFixed(4)+','+lng.toFixed(4), idx=seen[key]||0; seen[key]=idx+1;
    if(idx>0){ const ang=idx*(Math.PI/3), r=0.00045*Math.ceil(idx/6); lat+=r*Math.cos(ang); lng+=r*Math.sin(ang); } // même adresse : on écarte un peu
    const m=L.marker([lat,lng],{ icon:pinIcon(p.isBranch,false), title:p.name, keyboard:true });
    m.on('click', ()=>selectMapPoint(p,m));
    _cluster.addLayer(m); pts.push([lat,lng]);
  });
  _map.addLayer(_cluster);
  // attendre que le conteneur ait une vraie taille avant de cadrer
  let tries=0;
  const ensure=()=>{
    if(!_map||!$('#map')) return;
    _map.invalidateSize();
    if(_map.getSize().x===0 && tries++<40){ setTimeout(ensure,120); return; }
    if(fit || !_didFit){ try{ pts.length ? _map.fitBounds(pts,{padding:[50,50],maxZoom:14}) : _map.fitBounds(L.latLngBounds(IL_VIEW)); }catch(e){} _didFit=true; }
  };
  setTimeout(ensure,40);
}
function showMapCard(html){

  c.querySelectorAll('[data-mapclose]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); closeMapCard(); });

function closeMapCard(){

// Le client touché sur la carte : petite fiche avec « פתיחת לקוח » et « ניווט »
function selectMapPoint(p, m){

    <div class="u-actions"><button class="u-btn primary" data-open="${p.id}">פתיחת לקוח</button><a class="u-btn ghost" href="${nav}" target="_blank" rel="noopener">↗ ניווט</a></div>`);

// Choix d'une ville (ou « הצג הכל ») : la carte se recadre sans se redessiner

/* ---------- fenêtre « לקוח חדש » / « עריכת לקוח » : l'essentiel d'abord, le reste replié ---------- */
function clientForm(id){
  const s=id?state.stores.find(x=>x.id===id):null;
  const f=JSON.parse(JSON.stringify(s||BLANK));
  const inp=(k,label,o={})=>`<div class="${o.wide?'u-wide':''}"><label for="cf_${k}">${label}</label><input id="cf_${k}" maxlength="${o.max||160}" value="${esc(f[k]||'')}"${o.ltr?' dir="ltr"':''}${o.type?` type="${o.type}"`:''}${o.mode?` inputmode="${o.mode}"`:''}${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.list?` list="${o.list}"`:''} autocomplete="off"></div>`;
  const terms=['שוטף','שוטף+30','שוטף+60','מזומן'];
  if(f.terms && !terms.includes(f.terms)) terms.push(f.terms);
  const sh=trSheet(s?'עריכת לקוח':'לקוח חדש', `<p class="tr-muted" style="margin:6px 0 0">מתחילים בפרטים החשובים. את היתר משלימים בהמשך.</p>
    <div class="u-formgrid">
      ${inp('name','שם העסק *',{wide:1})}
      <div class="u-wide"><label for="cf_street">כתובת · מקלידים ובוחרים מהרשימה</label><input id="cf_street" maxlength="160" value="${esc(f.street||'')}" placeholder="רחוב, מספר ועיר" autocomplete="off">
        <div id="cf_streetHits" class="tr-hits"></div><div id="cf_streetOk" class="tr-addrok"></div></div>
      ${inp('city','עיר *',{list:'cfCities'})}
      ${inp('contact','איש קשר')}${inp('phone','טלפון',{type:'tel',ltr:1})}
      <div class="u-wide"><label for="cf_visitNotes">הנחיות לביקור</label><textarea id="cf_visitNotes" maxlength="1000" placeholder="למשל: קבלת סחורה עד 12:00">${esc(f.visitNotes||'')}</textarea></div>
    </div>
    <datalist id="cfCities">${clientCities().map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>
    <datalist id="cfTrades">${['קיוסק','מכולת','מיני סופר','סופר','מעדנייה'].map(o=>`<option value="${o}"></option>`).join('')}</datalist>
    <details class="u-more"><summary>פרטים נוספים · ח.פ, מייל, תנאי תשלום, בנק</summary>
      <div class="u-formgrid">
        ${inp('taxId','ח.פ / עוסק מורשה · לחיבור למורנינג',{ltr:1,mode:'numeric',wide:1})}
        ${inp('trade','סוג עסק',{list:'cfTrades'})}${inp('phone2','טלפון נוסף',{type:'tel',ltr:1})}
        <div class="u-wide"><label for="cf_emails">מייל · אפשר כמה, מופרדים בפסיק</label><input id="cf_emails" dir="ltr" value="${esc((f.emails||[]).filter(e=>(e||'').trim()).join(', '))}" autocomplete="off"></div>
        ${inp('fax','פקס',{ltr:1})}${inp('zip','מיקוד',{ltr:1,mode:'numeric'})}
        <div><label for="cf_terms">תנאי תשלום</label><select id="cf_terms">${terms.map(o=>`<option ${f.terms===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
        ${inp('discount','הנחה כללית (%)',{ltr:1,mode:'decimal'})}${inp('key','מפתח לקוח',{ltr:1})}${inp('country','מדינה')}
        ${inp('bank','שם הבנק')}${inp('branch','מספר סניף',{ltr:1,mode:'numeric'})}${inp('account','מספר חשבון',{ltr:1,mode:'numeric',wide:1})}
      </div></details>
    <div class="u-actions"><button class="tr-btn" data-cancel>ביטול</button><button class="tr-btn primary" data-ok>שמירת לקוח</button></div>`);
  sh.q('.tr-sheet').style.width='560px';   // plus large sur ordinateur (limité à l'écran sur téléphone)
  setTimeout(()=>{ const n=sh.q('#cf_name'); if(n && !s) n.focus(); },60);
  sh.q('[data-cancel]').onclick=sh.close;
  // adresse choisie dans les suggestions : rue + ville remplies, position exacte gardée
  let pickedAddr=null;
  addressSuggest(sh.el, sh.q('#cf_street'), sh.q('#cf_streetHits'), x=>{
    pickedAddr=x;
    if(x){ sh.q('#cf_street').value=x.street||x.name||x.title; if(x.city) sh.q('#cf_city').value=x.city; }
    sh.q('#cf_streetOk').textContent = x ? '✓ כתובת שנמצאה במפה · המיקום נשמר' : '';
  }, { query:q=>{ const c=sh.q('#cf_city').value.trim(); return c && !q.includes(c) ? q+' '+c : q; } });
  sh.q('#cf_city').addEventListener('input', ()=>{ if(pickedAddr){ pickedAddr=null; sh.q('#cf_streetOk').textContent=''; } });
  sh.q('[data-ok]').onclick=async()=>{
    const v=k=>{ const el=sh.q('#cf_'+k); return el?el.value.trim():''; };
    const keys=['name','city','street','contact','phone','visitNotes','taxId','trade','phone2','fax','zip','terms','discount','key','country','bank','branch','account'];
    const g={}; keys.forEach(k=>g[k]=v(k));
    if(!g.name||!g.city){ flash('יש למלא שם ועיר'); (g.name?sh.q('#cf_city'):sh.q('#cf_name')).focus(); return; }
    if(state.stores.some(x=>x.id!==(s&&s.id) && (x.name||'').trim()===g.name && (x.city||'').trim()===g.city)){ flash('כבר קיים לקוח בשם זה בעיר זו'); return; }
    const emails=v('emails').split(/[,;\s]+/).filter(Boolean).slice(0,5);
    const next=Object.assign(f,g,{ emails:emails.length?emails:[''], country:g.country||'ישראל', terms:g.terms||'שוטף' });
    if(!next.id) next.id=uid();
    const btn=sh.q('[data-ok]'); btn.disabled=true; btn.textContent='שומר...';
    // adresse nouvelle ou changée (ou pas encore de position) → on cherche la position sur la carte
    const moved=!s || (s.street||'').trim()!==g.street || (s.city||'').trim()!==g.city;
    if(pickedAddr && pickedAddr.ll) next.gps=pickedAddr.ll[0]+', '+pickedAddr.ll[1];   // adresse choisie dans la liste : position exacte
    else if(moved || !parseLL(next.gps)){ btn.textContent='מאתר מיקום...'; const loc=await geocode(next); if(loc) next.gps=loc; }
    const { error }=await sb.from('customers').upsert(storeToRow(next));
    if(error){ console.error(error); flash('שגיאה בשמירה'); btn.disabled=false; btn.textContent='שמירת לקוח'; return; }
    await sb.from('customers').update(visitRow(next)).eq('id',next.id);
    await reload(); sh.close();
    if(s){ render(); flash('פרטי הלקוח נשמרו'); }
    else { openProfile(next.id,'summary','list'); flash(parseLL(next.gps)?'הלקוח נוסף':'הלקוח נוסף · המיקום לא נמצא, אפשר לבחור במפה'); }
  };
}

/* ---------- visite notée depuis la fiche (même historique que la tournée) ---------- */
function recordVisitSheet(cid){
  const s=state.stores.find(x=>x.id===cid); if(!s) return;
  const stop=todayPendingStop(cid);
  const sh=trSheet('סיום ביקור', `<p style="margin:10px 0 0;font-weight:700">${esc(s.name)}</p>
    <label for="vsNote">סיכום הביקור</label><textarea id="vsNote" maxlength="1500" placeholder="מה סוכם? מה חשוב לביקור הבא?"></textarea>
    <p class="tr-muted">${stop?'העצירה במסלול של היום תסומן גם היא כבוצעה. ':''}סיום הביקור מעדכן את היסטוריית הלקוח. הוא אינו רושם גבייה ואינו משנה יתרה.</p>
    <button class="tr-btn primary tr-full" data-ok>✓ שמירת הביקור</button>`);
  setTimeout(()=>sh.q('#vsNote').focus(),60);
  sh.q('[data-ok]').onclick=async()=>{
    const note=sh.q('#vsNote').value.trim(), now=new Date().toISOString(), btn=sh.q('[data-ok]'); btn.disabled=true;
    let ok;
    if(stop) ok=await updateTask(stop.id,{ done:true, done_at:now, skipped:false, skip_reason:null, visit_note:note||null });
    else {
      const { error }=await sb.from('tasks').insert(taskToRow({ id:uid(), title:'ביקור', type:'visit', customerId:cid, city:(s.city||'').trim(), dueDate:todayStr(), done:true, doneAt:now, tripId:'', visitNote:note }));
      ok=!error; if(error){ console.error(error); flash('שגיאה בשמירה'); }
    }
    if(!ok){ btn.disabled=false; return; }
    sh.close(); await loadTasks(); render(); flash('הביקור נשמר והיסטוריית הלקוח עודכנה');
  };
}
async function removeVisit(id){
  if(!(await uiConfirm('למחוק את הביקור מההיסטוריה?'))) return;
  const { error }=await sb.from('tasks').delete().eq('id',id).eq('type','visit');
  if(error){ console.error(error); flash('שגיאה במחיקה'); return; }
  await loadTasks(); render(); flash('הביקור נמחק');
}
// Ajoute le client à la tournée d'aujourd'hui (crée la journée s'il n'y en a pas)
async function addToTodayRoute(cid){
  const s=state.stores.find(x=>x.id===cid); if(!s) return;
  if(todayPendingStop(cid)){ flash('הלקוח כבר נמצא במסלול של היום'); return; }
  const d=todayStr(), city=(s.city||'').trim();
  let trip=todayTrips()[0];
  if(!trip){
    const prev=lastStartSettings();
    trip={ id:uid(), date:d, name:city?'מסלול '+city:'יום '+fmtDate(d), startAddr:prev.startAddr, endAddr:prev.endAddr, startTime:prev.startTime };
    const { error }=await sb.from('trips').upsert(tripToRow(trip));
    if(error){ console.error(error); flash('שגיאה ביצירת היום'); return; }
  }
  const maxPos=Math.max(0,...tripStops(trip.id).map(x=>x.position||0));
  const { error }=await sb.from('tasks').insert(taskToRow({ id:uid(), title:'ביקור', type:'route', customerId:cid, city, dueDate:d, done:false, tripId:trip.id, position:maxPos+1 }));
  if(error){ console.error(error); flash('שגיאה בהוספה'); return; }
  await loadTrips(); await loadTasks(); render(); flash('הלקוח נוסף ל'+(trip.name||'מסלול של היום'));
}
// Position trouvée d'après l'adresse, enregistrée tout de suite
async function geolocateClient(){
  const s=state.stores.find(x=>x.id===state.sel); if(!s) return;
  flash('מאתר מיקום...');
  const loc=await geocode(s);
  if(!loc){ flash('הכתובת לא נמצאה במפה — אפשר לבחור במפה'); return; }
  await saveClientGps(loc);
}

/* ==========================================================================
   TOURNÉE (מסלולים) — design « Moins chercher. Mieux visiter. »
   Le prochain client, le montant à encaisser et la bonne action, tout de suite.
   La logique (ordre, prochain arrêt, heures) est dans tour.js.
   ========================================================================== */
const HE_MONTHS=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const SKIP_REASONS=['החנות סגורה','הלקוח לא זמין','לא הספקתי','סיבה אחרת'];
const VISIT_TYPES=[['route','ביקור'],['payment','גבייה'],['new_client','לקוח חדש'],['other','אחר']];
const _geo={}, _geoPending=new Set(); let _tourRenderT=null;
// Coordonnées d'une adresse (en mémoire) ; demande la géolocalisation une seule fois puis redessine
function geoGet(addr){
  addr=(addr||'').trim(); if(!addr) return null;
  const ll=parseLL(addr); if(ll) return ll;
  if(addr in _geo) return _geo[addr];
  if(!_geoPending.has(addr)){
    _geoPending.add(addr);
    geocodeAddr(addr).then(r=>{ _geo[addr]=r||null; _geoPending.delete(addr); clearTimeout(_tourRenderT); _tourRenderT=setTimeout(()=>{ if(state.tab==='trip') render(); },300); });
  }
  return null;
}
function stopCustomer(t){ return t.customerId ? state.stores.find(s=>s.id===t.customerId) : null; }
// Succursale visée par l'arrêt (franchise avec plusieurs magasins) ; null = adresse principale du client
function stopBranch(t){ const c=stopCustomer(t); return (c&&t.branchId) ? ((c.branches||[]).find(b=>b.id===t.branchId)||null) : null; }
function branchLabel(c,b){ return (c.name||'')+' · '+((b.name||'').trim()||'סניף'); }
function stopLL(t){ const c=stopCustomer(t), b=stopBranch(t); if(b) return parseLL(b.gps) || geoGet((b.city||'').trim()||t.city); return (c&&parseLL(c.gps)) || geoGet(t.city); }
function stopName(t){ const c=stopCustomer(t), b=stopBranch(t); if(b) return branchLabel(c,b); return (c&&c.name) || t.title || 'עצירה'; }
function stopAddress(t){ const c=stopCustomer(t), b=stopBranch(t);
  if(b) return [b.street,(b.city||'').trim()].filter(Boolean).join(', ') || (t.city||'');
  return c ? [c.street,(c.city||'').trim()].filter(Boolean).join(', ') : (t.city||''); }
function stopPhone(t){ const c=stopCustomer(t), b=stopBranch(t); return ((b&&b.phone)||(c&&c.phone)||'').trim(); }
// Recherche par nom : sans tenir compte des guillemets, tirets ni espaces en trop
function foldName(t){ return String(t||'').toLowerCase().replace(/["'״׳`\-–.,]/g,' ').replace(/\s+/g,' ').trim(); }
// Lieux correspondant à la recherche ; recherche vide = tous les lieux (client puis ses magasins, par ordre alphabétique)
function searchPlaces(places, q){
  const list = q ? places.filter(p=>foldName(p.store.name).includes(q)||foldName(p.branchName).includes(q)) : places.slice();
  return list.sort((a,b)=>(q?(foldName(b.store.name).startsWith(q)-foldName(a.store.name).startsWith(q)):0)||a.store.name.localeCompare(b.store.name,'he')||(!!a.branchId-!!b.branchId)||a.name.localeCompare(b.name,'he'));
}
// La liste s'ouvre quand on appuie sur le champ, et se ferme quand on passe à un autre champ de la fenêtre
function hitsOnTap(sh, input, box, draw){
  input.addEventListener('focus', ()=>draw(true));
  input.addEventListener('click', ()=>{ if(!box.innerHTML) draw(true); });
  sh.el.addEventListener('focusin', e=>{ if(e.target!==input && !box.contains(e.target)){ box.innerHTML=''; box.classList.remove('open'); } });
}
// Suggestions d'adresses réelles pendant la frappe (Photon, données OpenStreetMap : gratuit, sans compte).
// Choisir une suggestion remplit le champ avec « rue numéro, ville » et garde sa position GPS exacte.
// root = la fenêtre (la liste se ferme quand on passe à un autre champ) ; opts.query(texte) = texte cherché (ex. + ville).
function addressSuggest(root, input, box, onChange, opts={}){
  let timer=null, seq=0, list=[];
  const close=()=>{ box.innerHTML=''; box.classList.remove('open'); };
  const fmt=f=>{ const p=f.properties||{}, city=p.city||p.town||p.village||p.locality||p.district||p.county||'';
    const street=[p.street||(p.type==='street'?p.name:''), p.housenumber].filter(Boolean).join(' ');
    const poi=(p.name && p.name!==p.street && !['street','city','district','locality'].includes(p.type)) ? p.name : '';
    const value=[street||p.name||'', city].filter(Boolean).join(', ');
    const c=(f.geometry&&f.geometry.coordinates)||[];
    return { value, street, city, name:p.name||'', title:poi||street||p.name||city, sub:poi?[street,city].filter(Boolean).join(', '):city, ll:c.length===2?[+(+c[1]).toFixed(6), +(+c[0]).toFixed(6)]:null }; };
  input.setAttribute('autocomplete','off');
  input.addEventListener('input', ()=>{
    clearTimeout(timer); onChange&&onChange(null);
    const q=input.value.trim(); if(q.length<3){ close(); return; }
    timer=setTimeout(async()=>{
      const my=++seq;
      try{
        const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=default&bbox=34.2,29.4,35.95,33.35&q='+encodeURIComponent(opts.query?opts.query(q):q));
        const j=await r.json(); if(my!==seq) return;
        const seen=new Set(); list=(j.features||[]).map(fmt).filter(x=>x.value && !seen.has(x.value) && seen.add(x.value));
        box.classList.add('open');
        box.innerHTML = (list.length ? list.map((x,i)=>`<button type="button" class="tr-hit" data-addr="${i}"><span class="tr-grow"><b>${esc(x.title)}</b><span class="tr-addr">📍 ${esc(x.sub||x.value)}</span></span><span class="tr-plus">בחירה</span></button>`).join('')
          : `<div class="tr-muted" style="padding:6px 2px">לא נמצאה כתובת כזו · אפשר להמשיך לכתוב</div>`)
          + `<div class="tr-osm">כתובות: © OpenStreetMap</div>`;
        box.querySelectorAll('[data-addr]').forEach(b=> b.onclick=()=>{ const x=list[+b.dataset.addr]; input.value=x.value; if(x.ll) _geo[x.value]=x.ll; close(); onChange&&onChange(x); });
      }catch(e){ close(); }
    }, 280);
  });
  root.addEventListener('focusin', e=>{ if(e.target!==input && !box.contains(e.target)) close(); });
}
// Adresse complète d'un lieu, sur sa propre ligne dans les listes de recherche
function placeAddrHtml(p){ const a=[(p.street||'').trim(),(p.city||'').trim()].filter(Boolean).join(', ');
  return a ? `<span class="tr-addr">📍 ${esc(a)}</span>` : `<span class="tr-addr none">אין כתובת בכרטיס</span>`; }
// Tous les lieux possibles d'un arrêt : chaque client (adresse principale) + chacune de ses succursales
function allPlaces(){
  const out=[];
  for(const s of state.stores){
    out.push({ key:s.id, customerId:s.id, branchId:'', name:s.name||'', street:s.street||'', city:(s.city||'').trim(), store:s });
    for(const b of (s.branches||[])) if(b&&b.id) out.push({ key:s.id+':'+b.id, customerId:s.id, branchId:b.id, name:branchLabel(s,b), branchName:(b.name||'').trim(), street:b.street||'', city:(b.city||'').trim(), store:s });
  }

}
function stopPurpose(t){ // ce qu'il faut faire chez ce client (rien pour une simple visite)
  const ty=TASK_TYPES[t.type]||TASK_TYPES.other, c=stopCustomer(t);
  if(!c) return t.type==='route' ? '' : ty.icon+' '+ty.label;      // lieu hors CRM : le titre est déjà le nom
  if(t.type==='route' && (!t.title || t.title==='ביקור')) return '';
  const txt = (t.title && t.title!==c.name && t.title!==ty.label) ? t.title : ty.label;

function stopDebt(t){ return t.customerId ? debtDue(t.customerId) : 0; }
function stopNavUrl(t){ const ll=stopLL(t); if(ll) return 'https://waze.com/ul?ll='+ll[0]+','+ll[1]+'&navigate=yes'; const a=stopAddress(t); return a ? 'https://waze.com/ul?q='+encodeURIComponent(a)+'&navigate=yes' : ''; }
function tourStops(tripId){ return Tour.orderStops(tripStops(tripId)).map(t=>Object.assign({},t,{ll:stopLL(t)})); }
function tourPlan(trip, ordered){
  const startLL=parseLL(trip.startGps)||geoGet(trip.startAddr), endLL=parseLL(trip.endGps)||(trip.endAddr?geoGet(trip.endAddr):null)||startLL;

}

function tourGmapsUrl(plan, pending){
  const pts=pending.map(s=>s.ll).filter(Boolean); if(!pts.length) return 'https://www.google.com/maps';
  const origin=plan.startLL||pts[0], dest=plan.endLL||pts[pts.length-1];
  const wp=pts.filter(p=>p!==origin&&p!==dest).map(p=>p[0]+','+p[1]).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+origin[0]+','+origin[1]+'&destination='+dest[0]+','+dest[1]+(wp?'&waypoints='+encodeURIComponent(wp):'');
}
let _tourMap=null;
function syncTourMap(){
  const el=$('#tourMap'); if(!el) return;
  if(!window.L){ setTimeout(syncTourMap,250); return; }
  if(_tourMap && _tourMap.getContainer()!==el){ try{_tourMap.remove();}catch(e){} _tourMap=null; }
  if(!_tourMap){
    _tourMap=L.map(el,{zoomControl:true,attributionControl:false,minZoom:6}).setView([31.9,34.9],9);
    addBaseTiles(_tourMap);
  }
  _tourMap.eachLayer(l=>{ if(l instanceof L.Marker || l instanceof L.Polyline) _tourMap.removeLayer(l); });
  const t=state.trips.find(x=>x.id===state.selTrip); if(!t) return;
  const ordered=tourStops(t.id), plan=tourPlan(t, ordered), lls=[], seen={};
  const mark=(ll,label,sub,num,color)=>{
    const k=ll[0].toFixed(4)+','+ll[1].toFixed(4), n=seen[k]=(seen[k]||0)+1;   // magasins à la même adresse : on les écarte
    const p= n>1 ? [ll[0]+0.00035*Math.cos(n*2.1), ll[1]+0.00045*Math.sin(n*2.1)] : ll;
    const ic=L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:'<div style="width:32px;height:32px;border-radius:50%;background:'+color+';color:#fff;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:Assistant">'+num+'</div>'});
    const waze='https://waze.com/ul?ll='+ll[0]+','+ll[1]+'&navigate=yes';
    L.marker(p,{icon:ic}).addTo(_tourMap).bindPopup('<div style="text-align:right;min-width:160px;font-family:Assistant"><div style="font-size:15px;font-weight:700;color:#173f3b">'+esc(label)+'</div>'+(sub?'<div style="font-size:12.5px;color:#6c7f79;margin:2px 0 8px">'+esc(sub)+'</div>':'<div style="height:6px"></div>')+'<a href="'+waze+'" target="_blank" style="display:block;text-align:center;background:#0d4d4d;color:#fff;border-radius:9px;padding:7px;font-weight:700">↗ ניווט</a></div>');
    lls.push(p);
  };
  if(plan.startLL) mark(plan.startLL,'נקודת יציאה',t.startAddr,'📍','#173f3b');
  const line=plan.startLL?[plan.startLL]:[];
  ordered.forEach((s,i)=>{ if(!s.ll) return;
    const color = s.done?'#559184':s.skipped?'#9aaba6':'#0d4d4d';
    mark(s.ll, stopName(s), (plan.etas[s.id]?'≈ '+plan.etas[s.id]+' · ':'')+stopAddress(s), s.done?'✓':s.skipped?'↷':String(i+1), color);
    if(!Tour.isHandled(s)) line.push(s.ll);
  });
  if(plan.endLL && plan.startLL) line.push(plan.endLL);
  if(line.length>1) L.polyline(line,{color:'#0d4d4d',weight:4,opacity:.7,dashArray:'6,8'}).addTo(_tourMap);
  let tries=0; const fit=()=>{ if(!_tourMap||$('#tourMap')!==el) return; _tourMap.invalidateSize(); if(_tourMap.getSize().x===0&&tries++<40){ setTimeout(fit,120); return; } if(lls.length){ try{ _tourMap.fitBounds(lls,{padding:[30,30],maxZoom:15}); }catch(e){} } };
  setTimeout(fit,40);
}

/* ---------- fenêtres (design « sheet ») ---------- */
function trSheet(title, body){
  const back=document.createElement('div'); back.className='modal-back'; back.style.zIndex='1100';   // au-dessus des boutons de la carte (1000)
  back.innerHTML=`<section class="tr-sheet" role="dialog" aria-label="${esc(title)}"><div class="tr-row"><h2>${esc(title)}</h2><button class="tr-btn" data-x aria-label="סגירה">×</button></div>${body}</section>`;
  document.body.appendChild(back);
  const close=()=>back.remove();
  back.onclick=e=>{ if(e.target===back) close(); };
  back.querySelector('[data-x]').onclick=close;
  return { el:back, close, q:s=>back.querySelector(s), qa:s=>[...back.querySelectorAll(s)] };
}

function skipSheet(id){
  const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const trip=state.trips.find(x=>x.id===t.tripId);
  const sh=trSheet('לא ביקרתי', `<p style="margin:10px 0 0;font-weight:700">${esc(stopName(t))}</p>
    <label for="trReason">סיבה</label><select id="trReason">${SKIP_REASONS.map(r=>`<option>${r}</option>`).join('')}</select>
    <label for="trMoveDate">תאריך חדש · לא חובה</label><input id="trMoveDate" type="date" min="${todayStr()}">
    <p class="tr-muted">עם תאריך: הלקוח נכנס למסלול של אותו יום (נוצר אם אין). בלי תאריך: נוצרת משימת מעקב.</p>
    <button class="tr-btn primary tr-full" style="margin-top:12px" data-ok>שמירת הסיבה</button>`);
  sh.q('[data-ok]').onclick=async()=>{
    const reason=sh.q('#trReason').value, date=sh.q('#trMoveDate').value, btn=sh.q('[data-ok]');
    const name=stopName(t), c=stopCustomer(t), city=stopBranch(t)?(t.city||''):(c?(c.city||'').trim():(t.city||''));
    btn.disabled=true;
    if(date && trip && date===trip.date){   // même jour : on le remet en fin de tournée
      const maxPos=Math.max(0,...tripStops(trip.id).map(s=>s.position||0));
      if(await updateTask(id,{ position:maxPos+1, skipped:false, skip_reason:null })){ sh.close(); afterTourChange('העצירה הועברה לסוף המסלול'); }
      else btn.disabled=false;
      return;
    }
    if(!(await updateTask(id,{ skipped:true, skip_reason:reason, done:false, done_at:null }))){ btn.disabled=false; return; }
    let msg;
    if(date){
      let dest=visitTrips().find(x=>x.date===date && x.id!==t.tripId);
      if(!dest){
        const prev=lastStartSettings();
        dest={ id:uid(), date, name:city?'מסלול '+city:'יום '+fmtDate(date), startAddr:prev.startAddr, endAddr:prev.endAddr, startTime:prev.startTime };
        const { error }=await sb.from('trips').upsert(tripToRow(dest));
        if(error){ console.error(error); flash('הסיבה נשמרה, אבל יצירת היום החדש נכשלה'); sh.close(); afterTourChange(); return; }
      }
      const maxPos=Math.max(0,...tripStops(dest.id).map(s=>s.position||0));
      const { error }=await sb.from('tasks').insert(taskToRow({ id:uid(), title:t.title||'ביקור', type:t.type||'route', customerId:t.customerId||'', branchId:t.branchId||'', city:t.city||'', dueDate:date, done:false, tripId:dest.id, position:maxPos+1 }));
      if(error){ console.error(error); msg='הסיבה נשמרה, אבל ההעברה ליום החדש נכשלה'; }
      else msg='נשמרה הסיבה · הלקוח נוסף ל'+(dest.name||'יום')+' ('+fmtDate(date)+')';
      await loadTrips();
    } else {
      const { error }=await sb.from('tasks').insert(taskToRow({ id:uid(), title:'ביקור חוזר · '+name+' ('+reason+')', type:'other', customerId:t.customerId||'', branchId:t.branchId||'', city, dueDate:'', done:false, tripId:'' }));
      msg = error ? 'הסיבה נשמרה' : 'נשמרה הסיבה ונוצרה משימת מעקב';
      if(error) console.error(error);
    }
    sh.close(); afterTourChange(msg);
  };
}

function deleteTripSheet(id){

  const link=isDl&&(state.dlinks||[]).some(l=>l.trip_id===t.id&&!l.revoked_at&&new Date(l.expires_at)>new Date());
  const lines=[
    !stops.length ? 'אין עצירות במסלול.'

      : rest ? (rest===1?'עצירה אחת שעוד לא בוצעה תימחק.':rest+' עצירות שעוד לא בוצעו יימחקו.') : '',
    done ? (done===1?'ביקור אחד שכבר בוצע נשמר בהיסטוריה של הלקוח.':done+' ביקורים שכבר בוצעו נשמרים בהיסטוריה של הלקוחות.') : '',

  ].filter(Boolean);

  sh.q('[data-no]').onclick=sh.close;

    const btn=sh.q('[data-ok]'); btn.disabled=true; btn.textContent='מוחק...';
    const { error }=await sb.rpc('staff_delete_trip',{ p_trip:t.id });
    const gone=error && /not_found/.test(error.message||'');
    if(error && !gone){ console.error(error); btn.disabled=false; btn.textContent='מחיקה';
      flash(/trip_has_proofs/.test(error.message||'')?'אי אפשר למחוק: יש במסלול תמונה או חתימה':'שגיאה במחיקה'); return; }
    sh.close();

    state.selTrip=null; goTab(isDl?'deliveries':'tasks');

async function optimizeTrip(tripId){
  const t=state.trips.find(x=>x.id===tripId); if(!t) return;
  const startLL=parseLL(t.startGps) || (t.startAddr ? await geocodeAddr(t.startAddr) : null);
  const endLL=parseLL(t.endGps) || (t.endAddr ? await geocodeAddr(t.endAddr) : null) || startLL;
  if(t.startAddr) _geo[t.startAddr.trim()]=startLL; if(t.endAddr) _geo[t.endAddr.trim()]=endLL;
  const ordered=Tour.orderStops(tripStops(tripId));
  const handled=ordered.filter(s=>Tour.isHandled(s)), pending=ordered.filter(s=>!Tour.isHandled(s));
  const withLL=[]; for(const s of pending){ withLL.push(Object.assign({},s,{ll:stopLL(s) || await geocodeAddr(s.city)})); }
  const best=Tour.optimizeOrder(startLL, withLL, endLL);
  const list=handled.concat(best).map((s,k)=>({id:s.id, position:k+1}));
  await savePositions(list);
  await afterTourChange(startLL ? 'המסלול סודר בדרך הקצרה ביותר'
    : t.startAddr ? 'כתובת היציאה לא נמצאה במפה — אפשר לתקן אותה ב-⚙ (או לבחור 📍)' : 'המסלול סודר (בלי נקודת יציאה)');
}

  const brTag=p=>p.branchId?'<span class="tr-tag br">סניף</span>':'';
  const fold=foldName;

  let listOpen=false;   // la liste reste ouverte tant qu'on est dans le champ de recherche
  const drawHits=(open)=>{

      + hits.map(p=>{ const on=isOn(p);

const DRV_ERR = { phone_exists:'המספר כבר רשום לנהג אחר', bad_phone:'מספר טלפון לא תקין (לדוגמה 050-123-4567)', name_required:'יש להזין שם',
  phone_is_staff:'המספר שייך לחשבון של צוות המשרד', staff_only:'אין הרשאה', login_required:'יש להתחבר מחדש', not_configured:'השרת עדיין לא מוגדר',
  network:'אין חיבור לשרת', server_error:'שגיאה בשרת. מנסים שוב.', not_published:'המסלול עוד לא נשלח לנהג', driver_inactive:'הנהג מושבת', not_found:'לא נמצא' };
const drvErr = r => DRV_ERR[r && r.error] || 'שגיאה. מנסים שוב.';

async function loadDelivery(){
  try{
    const [d,p,k,n,g,lk] = await Promise.all([
      sb.from('drivers').select('id,name,phone,active,created_at').order('name'),
      sb.from('delivery_proofs').select('id,task_id,trip_id,storage_path,note,received_at,driver_id').order('received_at'),
      sb.from('delivery_documents').select('task_id,morning_id'),
      sb.from('delivery_notifications').select('id,trip_id,driver_id,status,created_at').order('created_at'),
      sb.from('delivery_signatures').select('id,task_id,morning_id,receiver_name,signed_at,signed_pdf_path,original_pdf_path,image_path,document_sha256,document_number,driver_id').order('signed_at'),
      sb.from('driver_links').select('id,trip_id,driver_id,expires_at,created_at,revoked_at,revoke_reason,last_used_at').order('created_at')
    ]);
    state.drivers=d.data||[]; state.dproofs=p.data||[]; state.ddocs=k.data||[]; state.dnotes=n.data||[]; state.dsigs=g.data||[]; state.dlinks=lk.data||[];
  }catch(e){ console.error(e); }
}
let _dlTimer=null;
function deliveryChanged(){ clearTimeout(_dlTimer); _dlTimer=setTimeout(async()=>{ await loadDelivery(); if(['tasks','trip'].includes(state.tab)) softRender(); },600); }

// Appel au serveur (gestion des livreurs, notification) avec la connexion de l'équipe
async function driversApi(body){
  const { data } = await sb.auth.getSession(); const tok = data && data.session && data.session.access_token;
  if(!tok) return { ok:false, error:'login_required' };
  try{
    const r = await fetch('/api/drivers', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+tok }, body:JSON.stringify(body) });
    const j = await r.json().catch(()=>({})); return Object.assign({ httpStatus:r.status }, j);
  }catch(e){ return { ok:false, error:'network' }; }
}
// Fenêtre de confirmation (bouton vert : le rouge reste pour les erreurs et suppressions)
function dlConfirm(title, html, okLabel){
  return new Promise(res=>{
    const sh=trSheet(title, `<div style="margin-top:10px;line-height:1.6">${html}</div>
      <button class="tr-btn primary tr-full" style="margin-top:18px" data-ok>${esc(okLabel)}</button>
      <button class="tr-btn ghost tr-full" style="margin-top:6px" data-no>ביטול</button>`);
    let done=false; const fin=v=>{ if(done) return; done=true; sh.close(); res(v); };
    sh.q('[data-ok]').onclick=()=>fin(true); sh.q('[data-no]').onclick=()=>fin(false);
    sh.el.addEventListener('click',e=>{ if(e.target===sh.el) fin(false); });
    sh.q('[data-x]').addEventListener('click',()=>fin(false));
  });
}

function deliveryTag(t){
  if(!t.driverId) return '';
  const p=Delivery.progress(tripStops(t.id).map(dlRow));
  return ` · ${dlIc('truck')} ${esc(driverName(t.driverId))} · ${t.publishedAt?(p.done?p.done+'/'+p.total+' טופלו':'נשלח לנהג'):'טיוטה'}${p.openProblems?` · <span class="u-late">${p.openProblems} לטיפול</span>`:''}`;
}
// Arrêt du CRM → forme attendue par delivery-core.js
const dlRow = s => ({ id:s.id, position:s.position, created_at:s.createdAt, delivery_status:s.deliveryStatus||null, problem_resolved_at:s.problemResolvedAt||null });

// Sur une journée SANS livreur : proposer d'en faire une tournée de livraison
function screenDeliveries(){
  const today=todayStr(), trips=deliveryTrips();
  const todays=trips.filter(t=>t.date===today);
  const upcoming=trips.filter(t=>t.date&&t.date>today).sort((a,b)=>a.date<b.date?-1:1);
  const past=trips.filter(t=>!t.date||t.date<today).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1);
  const nameOf=t=>esc(t.name||('משלוחים '+fmtDate(t.date)));
  const line=t=>{ const pr=Delivery.progress(tripStops(t.id).map(dlRow)), ls=Delivery.linkState(tripLink(t), t);
    return `${pr.total===1?'משלוח אחד':pr.total+' משלוחים'} · ${t.driverId?esc(driverName(t.driverId)):'ללא נהג'} · ${!t.publishedAt?'טיוטה':pr.done?pr.done+'/'+pr.total+' טופלו':'נשלח לנהג'}${pr.openProblems?` · <span class="u-late">${pr.openProblems} לטיפול</span>`:''}${ls==='active'?' · קישור פעיל':''}`; };
  const row=t=>{ const p=(t.date||'').split('-');
    return `<button class="tr-card tr-dayrow" data-t-open="${t.id}"><span class="tr-date"><b>${p.length===3?+p[2]:'—'}</b>${p.length===3?HE_MONTHS[+p[1]-1]:''}</span>
      <span class="tr-grow"><h3>${nameOf(t)}</h3><span class="tr-muted">${line(t)}</span></span><span class="tr-chev">‹</span></button>`; };
  const hero=t=>`<section class="u-hero" style="margin-bottom:14px"><span class="u-badge">היום</span><h2>${nameOf(t)}</h2>
      <p class="u-muted" style="margin:0 0 14px">${line(t)}</p><button class="u-btn u-full" data-t-open="${t.id}">פתיחת המשלוח ←</button></section>`;
  const pastShown=state.tour.allPast?past:past.slice(0,5);
  return `<div class="tr-screen">
    ${uHeader('מסלולים לנהגים · נפרדים מהמסלולים של הסוכן','משלוחים',`<span style="display:flex;gap:8px"><button class="u-btn ghost" data-drivers>נהגים</button><button class="u-btn primary" data-dl-newtrip>＋ מסלול משלוחים</button></span>`)}
    <div class="u-dash">
      <div>${todays.length?todays.map(hero).join(''):`<section class="u-hero"><span class="u-badge">היום</span><h2>אין משלוחים היום</h2>
          <p class="u-muted" style="margin:0 0 14px">יוצרים מסלול משלוחים: בוחרים עיר ולקוחות, ואז נהג.</p><button class="u-btn u-full" data-dl-newtrip>＋ מסלול משלוחים</button></section>`}</div>
      <div>
        <h2>משלוחים מתוכננים</h2>
        ${upcoming.length?upcoming.map(row).join(''):`<div class="u-card u-empty" style="margin-top:0">אין משלוחים נוספים מתוכננים</div>`}
        ${past.length?`<p class="tr-muted" style="margin:22px 2px 6px">משלוחים קודמים</p>${pastShown.map(row).join('')}
          ${past.length>pastShown.length?`<button class="tr-btn ghost tr-full" data-t-morepast>הצג את כל ${past.length}</button>`:''}`:''}
      </div>
    </div>
    <p class="u-help">המסלולים של הסוכן נשארים ב„מסלולים”. כאן רק מסלולים לנהגים: הנהג רואה רק מסלול משלוחים שנשלח אליו.</p>
  </div>`;
}

/* ---------- l'écran d'une tournée de livraison (étape 1 : préparation par l'équipe) ---------- */
// Position EXACTE d'un arrêt : celle du magasin ou du client ; pour un lieu hors CRM, l'adresse cherchée sur la carte.
// (Jamais le centre de la ville : sinon la proposition d'ordre serait fausse.)
function dlExactLL(s){
  const c=stopCustomer(s), b=stopBranch(s);
  if(b) return parseLL(b.gps);
  if(c) return parseLL(c.gps);
  const a=(s.city||'').trim(); return a ? geoGet(a) : null;
}
// Sans position connue (et pas de recherche en cours)
function dlNoPosition(s){
  if(dlExactLL(s)) return false;
  const a=(s.city||'').trim();
  return !(!s.customerId && a && _geoPending.has(a));
}
// Arrêts pour RoutePlan, dans l'ordre enregistré : traités (statut posé) et cadenas = places fixes
function dlPlanStops(tripId){
  return Tour.orderStops(tripStops(tripId)).map(s=>({ id:s.id, handled:Delivery.isDone(dlRow(s)), locked:s.lockedPosition||0, ll:dlExactLL(s) }));
}
// Heure limite repérée dans les consignes de la livraison ou les notes du client — simple suggestion à confirmer
function dlTimeHint(s){ const c=stopCustomer(s); return RoutePlan.detectTime(s.deliveryInstructions) || RoutePlan.detectTime(c&&c.visitNotes); }
function dlStartLL(t){ return parseLL(t.startGps) || (t.startAddr ? geoGet(t.startAddr) : null); }
function dlEndLL(t){ return parseLL(t.endGps) || (t.endAddr ? geoGet(t.endAddr) : null) || dlStartLL(t); }

function screenDeliveryTrip(t){
  const ordered=Tour.orderStops(tripStops(t.id)), rows=ordered.map(dlRow), pr=Delivery.progress(rows);
  const d=driverOf(t.driverId), pub=!!t.publishedAt, plan=dlPlanStops(t.id), fixed=RoutePlan.fixedSlots(plan);
  const pending=ordered.filter(s=>!Delivery.isDone(dlRow(s)));
  const notes=state.dnotes.filter(n=>n.trip_id===t.id), last=notes[notes.length-1];
  const notifLine = !pub ? '' : !last ? `<div class="dl-note muted">${dlIc('sms')}<span>לא נשלחה הודעה לנהג.</span><button class="u-link" data-dl-notify="${t.id}">שליחת הודעה</button></div>`
    : last.status==='sent' ? `<div class="dl-note ok">${dlIc('check')}<span>הודעת SMS נשלחה ${esc(dlDateTime(last.created_at))}</span><button class="u-link" data-dl-notify="${t.id}">שליחה חוזרת</button></div>`
    : `<div class="dl-note warn">${dlIc('alert')}<span>${last.status==='not_configured'?'ההודעה לא נשלחה: שירות ה-SMS עוד לא הוגדר.':'שליחת ההודעה נכשלה ('+esc(dlDateTime(last.created_at))+').'} המסלול זמין לנהג במרחב הנהגים.</span><button class="u-link" data-dl-notify="${t.id}">ניסיון חוזר</button></div>`;
  const others=state.drivers.filter(x=>x.active && x.id!==t.driverId);
  const card=`<section class="tr-card dl-card">
    <div class="tr-row"><span class="dl-chip ${pub?'ok':'draft'}">${dlIc(pub?'send':'draft')}${pub?'נשלח לנהג':'טיוטה'}</span>
      ${pub?`<span class="tr-muted">${esc(dlDateTime(t.publishedAt))}</span>`:''}</div>
    <div class="dl-driver"><span class="dl-av">${dlIc('user')}</span><div class="tr-grow"><b>${esc(d?d.name:'נהג לא ידוע')}</b>
      <div class="tr-muted"><bdi>${esc(d?Delivery.displayPhone(d.phone):'')}</bdi></div></div>
      ${d&&!d.active?`<span class="dl-chip problem">${dlIc('off')}מושבת</span>`:''}</div>
    ${d&&!d.active?`<div class="dl-note warn">${dlIc('alert')}<span>הנהג מושבת ואינו רואה את המסלול. מעבירים לנהג אחר.</span></div>`:''}
    ${pub?'':`<p class="tr-muted" style="margin:8px 0 0">הנהג עוד לא רואה את המסלול, ולא נשלחת הודעה. ממשיכים לערוך ושולחים כשמוכן.</p>`}
    ${notifLine}
    <div class="dl-actions">
      ${pub?'':`<button class="tr-btn primary" data-dl-publish="${t.id}" ${d&&d.active&&ordered.length?'':'disabled'}>${dlIc('send')}שליחה לנהג</button>`}
      ${others.length?`<label class="sr-only" for="dlMove">העברה לנהג אחר</label><select class="u-field dl-move" id="dlMove" aria-label="העברה לנהג אחר"><option value="">${pub?'העברה לנהג אחר…':'החלפת נהג…'}</option>${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''}
      ${pub?`<button class="tr-btn ghost" data-dl-unpublish="${t.id}">החזרה לטיוטה</button>`:`<button class="tr-btn ghost" data-dl-unassign="${t.id}">ביטול השיוך</button>`}
    </div>
  </section>`;
  // lien privé : résumé dans l'en-tête, carte complète seulement juste après la création (pour copier le lien)
  const l=t.driverId?tripLink(t):null, lst=l?Delivery.linkState(l,t):null, freshUrl=l&&state.linkUrls[l.id];
  const linkChip = !t.driverId ? '' : !l ? `<span class="dl-chip muted">${dlIc('link')}אין קישור לנהג</span>`
    : `<span class="dl-chip ${Delivery.LINK_STATES[lst].tone}">${dlIc('link')}קישור · ${Delivery.LINK_STATES[lst].label}${lst==='active'?' עד <bdi>'+esc(dlDateTime(l.expires_at))+'</bdi>':''}</span>`;
  // 3 chiffres
  const metrics=`<div class="u-metrics dl-metrics">
      <div class="u-metric"><span>נותרו למסירה</span><strong>${pr.remaining}</strong><span class="mini">מתוך ${pr.total}</span></div>
      <button class="u-metric dl-mlink" data-dl-scroll="dlCheck"><span>בעיות לטיפול</span><strong class="${pr.openProblems?'u-late':''}">${pr.openProblems}</strong><span class="mini">${pr.problems>pr.openProblems?(pr.problems-pr.openProblems)+' טופלו':'לרשימת הבדיקות ↓'}</span></button>
      <div class="u-metric"><span>שעת סיום</span><strong>—</strong><span class="mini">לא חושבה · אין חישוב נסיעה בכבישים</span></div>
    </div>
    <div class="tr-progress" aria-label="${pr.done} מתוך ${pr.total} טופלו"><i style="width:${pr.pct}%"></i></div>
    <p class="tr-muted dl-small">${pr.done} מתוך ${pr.total} טופלו · ${pr.delivered} נמסרו. מסירה אינה תשלום ואינה משנה את היתרות במורנינג.</p>`;
  // départ et arrivée
  const geoLine=(addr,gps,empty)=> !addr ? `<div class="dl-geo">${empty}</div>`
    : parseLL(gps) ? `<div class="dl-geo ok">${dlIc('check')}המיקום נקבע מהרשימה</div>`
    : `<div class="dl-geo">המיקום לא נבחר מהרשימה · מקלידים ובוחרים כתובת כדי לקבוע אותו</div>`;
  const depart=`<section class="tr-card dl-depart"><h3>יציאה וסיום</h3>
    <div class="dl-depgrid">
      <div><label for="dlStart">כתובת יציאה</label><input id="dlStart" class="u-field" value="${esc(t.startAddr||'')}" placeholder="המחסן או כתובת אחרת" autocomplete="off">
        <div id="dlStartHits" class="tr-hits"></div>${geoLine(t.startAddr,t.startGps,'אין נקודת יציאה')}</div>
      <div><label for="dlTime">שעת יציאה מתוכננת</label><input id="dlTime" class="u-field" type="time" value="${esc(t.startTime||'')}"></div>
      <div><label for="dlEnd">נקודת סיום</label><input id="dlEnd" class="u-field" value="${esc(t.endAddr||'')}" placeholder="ריק = חזרה לנקודת היציאה" autocomplete="off">
        <div id="dlEndHits" class="tr-hits"></div>${t.endAddr?geoLine(t.endAddr,t.endGps,''):'<div class="dl-geo">חזרה לנקודת היציאה</div>'}</div>
    </div></section>`;
  // liste des arrêts, avec l'ordre manuel
  const list = ordered.map((s,i)=>{ const st=s.deliveryStatus||'pending', handled=Delivery.isDone(dlRow(s)), isFixed=fixed.has(i);
    const np=state.dproofs.filter(p=>p.task_id===s.id).length, nd=state.ddocs.filter(x=>x.task_id===s.id).length, ns=state.dsigs.filter(g=>g.task_id===s.id).length;
    const upB=handled?null:RoutePlan.moveBlock(plan,s.id,-1), downB=handled?null:RoutePlan.moveBlock(plan,s.id,1), firstB=handled?null:RoutePlan.firstBlock(plan,s.id);
    return `<div class="dl-stopwrap${handled?' done':''}"><div class="dl-stoprow"><button class="dl-stop" data-dl-stop="${s.id}">
      <span class="tr-num" aria-hidden="true">${i+1}</span>
      <span class="tr-grow"><span class="tr-row" style="align-items:flex-start"><b>${esc(stopName(s))}</b>${dlChip(st)}</span>
        <span class="tr-muted" style="display:block">${esc(stopAddress(s))}</span>
        ${(s.lockedPosition&&!handled)||s.receiveUntil?`<span class="dl-tags">${s.lockedPosition&&!handled?`<span class="dl-chip muted">${dlIc('lock')}נעול במקום ${i+1}</span>`:''}${s.receiveUntil?`<span class="dl-chip warnc">${dlIc('clock')}קבלה עד ${esc(s.receiveUntil)}</span>`:''}</span>`:''}
        <span class="dl-meta">${s.deliveredAt?`<span>${dlIc('clock')}${esc(dlTime(s.deliveredAt))}</span>`:''}
          <span>${dlIc('camera')}${np?(np===1?'תמונה אחת':np+' תמונות'):'אין תמונה'}</span>${s.problemResolvedAt?`<span>${dlIc('check')}הבעיה טופלה</span>`:''}${nd?`<span>${dlIc('file')}${nd===1?'תעודה אחת':nd+' תעודות'}</span>`:''}${ns?`<span>${dlIc('draft')}${ns===1?'חתימה אחת':ns+' חתימות'}</span>`:''}${s.deliveryInstructions?`<span>הנחיות ✓</span>`:''}</span>
        ${s.deliveryNote?`<span class="tr-muted" style="display:block;margin-top:3px">„${esc(s.deliveryNote)}”</span>`:''}</span>
    </button><button class="dl-more" data-dl-more="${s.id}" aria-label="פעולות נוספות: ${esc(stopName(s))}" title="פעולות נוספות">⋯</button></div>
    ${handled?'':`<div class="dl-tools">
      <button class="tr-btn ghost${upB?' is-off':''}" data-dl-move="${s.id}" data-dir="-1" aria-disabled="${!!upB}" aria-label="להזיז את ${esc(stopName(s))} למעלה">↑</button>
      <button class="tr-btn ghost${downB?' is-off':''}" data-dl-move="${s.id}" data-dir="1" aria-disabled="${!!downB}" aria-label="להזיז את ${esc(stopName(s))} למטה">↓</button>
      <button class="tr-btn ghost dl-wideonly${firstB?' is-off':''}" data-dl-first="${s.id}" aria-disabled="${!!firstB}">קבע ראשון</button>
      <button class="tr-btn ghost dl-wideonly" data-dl-lock="${s.id}">${dlIc('lock')}${s.lockedPosition?'שחרור נעילה':'נעילת מיקום'}</button>
      <button class="tr-btn ghost dl-narrowonly" data-dl-order="${s.id}">שינוי סדר</button>
    </div>`}</div>`; }).join('');
  // « מה כדאי לבדוק ? » : seulement des faits tirés des vraies données
  const checks=[];
  for(const s of ordered.filter(s=>Delivery.openProblem(dlRow(s))))
    checks.push(`<div class="dl-alert problem"><div class="tr-grow"><b>${esc(stopName(s))}</b> ${dlChip(s.deliveryStatus)}
      ${s.deliveryNote?`<div class="tr-muted">„${esc(s.deliveryNote)}”</div>`:''}</div>
      <div class="dl-alert-actions"><button class="tr-btn" data-dl-resolve="${s.id}">${dlIc('check')}טופל</button><button class="tr-btn ghost" data-dl-stop="${s.id}">פרטי העצירה</button></div></div>`);
  for(const s of pending){ const h=dlTimeHint(s); if(!h && !s.receiveUntil) continue;
    const fb=RoutePlan.firstBlock(plan,s.id);
    checks.push(s.receiveUntil
      ? `<div class="dl-alert ok"><div class="tr-grow"><b>${esc(stopName(s))} · אושר: קבלה עד ${esc(s.receiveUntil)}</b>
        <div class="tr-muted">האישור תקף למשלוח הזה בלבד, לא לביקורים הבאים של הלקוח.</div></div>
        <div class="dl-alert-actions"><button class="tr-btn ghost" data-dl-timeedit="${s.id}">שינוי</button>${fb?'':`<button class="tr-btn ghost" data-dl-first="${s.id}" aria-disabled="false">קבע ראשון</button>`}</div></div>`
      : `<div class="dl-alert warn"><div class="tr-grow"><b>${esc(stopName(s))} · שעה שזוהתה בהערה</b>

  const noDocs=pending.filter(s=>s.customerId && !state.ddocs.some(x=>x.task_id===s.id));   // regroupés en une seule alerte

      <div class="tr-muted">לבדיקה בלבד: המשלוח לא נחסם. לוחצים על שם כדי לבחור תעודות.</div>
      <div class="dl-alert-actions">${noDocs.map(s=>`<button class="tr-btn ghost" data-dl-stop="${s.id}">${dlIc('file')}${esc(stopName(s))}</button>`).join('')}</div></details>`);
  const checkCard=`<section class="tr-card dl-check" id="dlCheck"><h3>מה כדאי לבדוק?${checks.length?` <span class="dl-count">${checks.length}</span>`:''}</h3>
    ${checks.length?checks.join(''):`<p class="tr-muted" style="margin:6px 0 0">${dlIc('check')} אין מה לבדוק כרגע.</p>`}</section>`;
  // préparation : ordre inverse des arrêts restants, avec le nombre de bons (jamais un nombre de cartons)
  const loadCard = pending.length ? `<section class="tr-card dl-load"><h3>${dlIc('truck')} הכנת תעודות לפי סדר טעינה</h3>
    <p class="tr-muted" style="margin:4px 0 8px">מהעצירה האחרונה לראשונה. מספר התעודות אינו מספר ארגזים.</p>
    ${pending.slice().reverse().map((s,k)=>{ const nd=state.ddocs.filter(x=>x.task_id===s.id).length;
      return `<div class="dl-loadrow"><span>${k+1}. ${esc(stopName(s))}</span><b>${nd?(nd===1?'תעודה אחת':nd+' תעודות'):'אין תעודה'}</b></div>`; }).join('')}</section>` : '';
  return `<div class="tr-screen">
    <button class="u-back" data-nav="deliveries">→ כל המשלוחים</button>
    ${uHeader(esc(dateLong(t.date))+' · משלוח', esc(t.name||('יום '+fmtDate(t.date))),
      `<span class="dl-headact">${t.driverId?`<button class="u-btn ghost" data-dl-linkpanel="${t.id}">${dlIc('link')}ניהול קישור</button>`:''}<button class="u-btn ghost" data-t-settings aria-label="הגדרות המסלול">⚙ הגדרות</button></span>`)}
    ${t.driverId?`<div class="dl-headchips"><span class="dl-chip ${pub?'ok':'draft'}">${dlIc('user')}${esc(d?d.name:'נהג')} · ${pub?'נשלח לנהג':'טיוטה'}</span>${linkChip}</div>`:''}

          ${pub?`<p class="dl-live">${dlIc('alert')}שינוי הסדר מתעדכן מיד אצל הנהג</p>`:''}
          ${ordered.length?list:`<p class="tr-muted">אין עצירות עדיין.</p>`}
        </section>
      </div>
      <div>
        ${checkCard}
        ${loadCard}

      </div>
    </div>

}

/* ---------- préparation de la tournée : ordre, cadenas, heure confirmée, départ/arrivée ---------- */
// Enregistre un nouvel ordre (positions 1..n) : affichage immédiat, puis enregistrement des positions qui changent
async function dlApplyOrder(tripId, ids, msg){
  const changed=[];
  ids.forEach((id,k)=>{ const s=state.tasks.find(x=>x.id===id); if(s && s.position!==k+1){ s.position=k+1; changed.push({ id, position:k+1 }); } });
  render();
  if(changed.length) await savePositions(changed);
  if(msg) flash(msg);
}
// Après un retrait : les arrêts verrouillés reprennent leur place
async function dlNormalize(tripId){
  const plan=dlPlanStops(tripId), ids=RoutePlan.arrange(plan);
  if(ids.some((id,k)=>plan[k].id!==id)) await dlApplyOrder(tripId, ids);
}
async function dlToggleLock(id){
  const s=state.tasks.find(x=>x.id===id); if(!s) return;
  const ids=RoutePlan.arrange(dlPlanStops(s.tripId)), val=s.lockedPosition ? null : ids.indexOf(id)+1;
  if(await updateTask(id,{ locked_position:val })){ s.lockedPosition=val||0; render(); flash(val?'העצירה ננעלה במקום '+val:'הנעילה שוחררה'); }
}
async function dlSetTime(id, val){
  const s=state.tasks.find(x=>x.id===id); if(!s) return;
  if(await updateTask(id,{ receive_until:val||null })){ s.receiveUntil=val||''; render(); flash(val?'אושר: קבלה עד '+val+' (למשלוח הזה בלבד)':'האישור בוטל'); }
}
// Pourquoi une action d'ordre est refusée (texte pour l'équipe)
function dlBlockText(b, dir){
  if(!b) return '';
  if(b.code==='self-handled') return 'העצירה כבר טופלה ונשארת במקומה.';
  if(b.code==='self-locked') return 'העצירה נעולה במקום '+b.slot+'. משחררים את הנעילה כדי להזיז אותה.';
  if(b.code==='edge') return dir<0?'העצירה כבר במקום הראשון.':'העצירה כבר במקום האחרון.';
  if(b.code==='fixed-beyond') return (dir<0?'מעליה':'מתחתיה')+' יש רק עצירות שטופלו או נעולות, והן לא זזות.';
  if(b.code==='already-first') return 'העצירה כבר במקום הפנוי הראשון. עצירות שטופלו או נעולות נשארות לפניה.';
  return 'הפעולה לא אפשרית.';
}
function dlMakeFirst(tripId, id){
  const plan=dlPlanStops(tripId), why=RoutePlan.firstBlock(plan, id);
  if(why) return flash(dlBlockText(why));
  dlApplyOrder(tripId, RoutePlan.makeFirst(plan, id), 'העצירה הועברה למקום הפנוי הראשון');
}
// Menu ⋯ d'un arrêt
function dlMoreSheet(id){

    <button class="tr-btn ghost tr-full dl-dangertxt" style="margin-top:8px" data-a="rm">הסרת עצירה</button>`);
  sh.q('[data-a="open"]').onclick=()=>{ sh.close(); deliveryStopSheet(id); };
  sh.q('[data-a="rm"]').onclick=()=>{ sh.close(); removeStopSheet(id); };
}
// Panneau « שינוי סדר » (téléphone) : קבע ראשון + cadenas, avec la raison quand c'est bloqué
function dlOrderSheet(id){
  const s=state.tasks.find(x=>x.id===id); if(!s) return;
  const plan=dlPlanStops(s.tripId), place=RoutePlan.arrange(plan).indexOf(id)+1, fb=RoutePlan.firstBlock(plan, id);
  const sh=trSheet('שינוי סדר', `<p style="margin:10px 0 0;font-size:17px"><b>${esc(stopName(s))}</b></p>
    <p class="tr-muted" style="margin:2px 0 14px">מקום נוכחי: ${place}${s.lockedPosition?' · נעול':''}</p>
    <button class="tr-btn tr-full${fb?' is-off':''}" data-a="first" aria-disabled="${!!fb}">קבע ראשון</button>
    ${fb?`<p class="tr-muted dl-why">${dlBlockText(fb)}</p>`:''}
    <button class="tr-btn tr-full" style="margin-top:8px" data-a="lock">${dlIc('lock')}${s.lockedPosition?'שחרור נעילה (נעול במקום '+place+')':'נעילה במקום '+place}</button>
    <p class="tr-muted" style="margin-top:12px;line-height:1.55">עצירה נעולה שומרת על המקום שלה גם כשמזיזים או מסדרים את האחרות. החצים ↑ ↓ נמצאים ברשימה.</p>`);
