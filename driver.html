<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4d4d">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>מסלולים · נהגים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./leaflet.min.css">
<script src="./leaflet.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./delivery-core.js"></script>
<style>
  /* Espace livreur : sobre, pensé pour le téléphone. Rouge réservé aux erreurs et aux problèmes. */
  :root{
    --g:#0d4d4d; --g-hover:#0a3d3d; --g2:#e6efee; --bg:#eef1f1; --card:#fff;
    --text:#16302f; --muted:#5b7170; --line:#dce4e3; --line2:#e8eeed;
    --red:#b4462f; --red-bg:#fbefec; --red-line:#efd3cc;
    --shadow:0 1px 2px #0d4d4d0f,0 4px 14px #0d4d4d0d;
    --nav-h:68px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Assistant,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  body{min-height:100vh;overflow-x:hidden}
  button,input,textarea,select{font-family:inherit;font-size:17px;color:inherit}
  a{color:var(--g)}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  svg.i{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  svg.i.sm{width:18px;height:18px}
  svg.i.lg{width:28px;height:28px}

  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
  .wrap.has-bar{padding-bottom:calc(var(--nav-h) + 150px + env(safe-area-inset-bottom))}
  .wrap.nonav{padding-bottom:40px}
  h1{font-size:27px;line-height:1.2;margin:4px 0 6px;font-weight:800;letter-spacing:-.2px}
  h2{font-size:21px;line-height:1.25;margin:0 0 4px;font-weight:800}
  h3{font-size:17px;margin:0;font-weight:700}
  p{margin:0}
  .kicker{font-size:16px;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:16px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grow{flex:1;min-width:0}
  .stack>*+*{margin-top:12px}
  .sec{margin:26px 2px 10px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sec .count{font-size:16px;color:var(--muted);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 9px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .card.hero{border-color:#c7d9d6;box-shadow:0 2px 3px #0d4d4d12,0 10px 26px #0d4d4d14}
  .card.flat{box-shadow:none}
  .card.tap{display:block;width:100%;text-align:right;cursor:pointer;font:inherit;color:inherit}
  .card.tap:active{transform:scale(.995)}
  .brand{font-size:24px;font-weight:800;color:var(--g);letter-spacing:-.3px}
  .brand i{color:#79a38c;font-style:normal}
  .brand small{display:block;font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0}

  /* boutons : 52 px de haut, une seule action principale par écran */
  .btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--g);font-weight:700;font-size:17px;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 18px;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--g);border-color:var(--g);color:#fff}
  .btn.primary:hover{background:var(--g-hover)}
  .btn.soft{background:var(--g2);border-color:var(--g2)}
  .btn.danger{color:var(--red);border-color:var(--red-line);background:#fff}
  .btn.ghost{background:none;border-color:transparent}
  .btn.full{width:100%}
  .btn[disabled]{opacity:.55;cursor:default;transform:none}
  .btn .spin{width:20px;height:20px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .linkbtn{background:none;border:0;color:var(--g);font-weight:700;padding:10px 0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
  .linkbtn[disabled]{color:var(--muted);cursor:default}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:700;padding:8px 0;min-height:44px;cursor:pointer}
  .iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--g);display:inline-grid;place-items:center;cursor:pointer}

  /* champs : 17 px (pas de zoom automatique sur iPhone) */
  label.lbl{display:block;font-weight:700;margin:16px 0 7px}
  .field{width:100%;min-height:54px;border:1px solid #cfdad8;border-radius:14px;background:#fbfcfc;padding:12px 14px;font-size:18px}
  .field:focus{outline:3px solid #0d4d4d2e;border-color:var(--g)}
  textarea.field{min-height:96px;resize:vertical;line-height:1.45}
  .field.code{font-size:28px;letter-spacing:10px;text-align:center;font-weight:700}
  .hint{font-size:16px;color:var(--muted);margin-top:8px}

  /* messages */
  .msg{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:13px 14px;font-weight:600;margin-top:14px}
  .msg.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
  .msg.info{background:var(--g2);color:var(--g)}
  .msg.warn{background:#f6f2e8;color:#6b5321;border:1px solid #eadfc4}
  .msg svg{margin-top:1px}

  /* statuts : toujours icône + texte */
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px 4px 12px;font-size:16px;font-weight:700;white-space:nowrap;border:1px solid transparent}
  .chip svg.i{width:17px;height:17px}
  .chip.ok{background:var(--g2);color:var(--g)}
  .chip.muted{background:#f1f4f4;color:var(--muted);border-color:var(--line2)}
  .chip.problem{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
  .chip.plain{background:#fff;color:var(--g);border-color:var(--line)}

  .progress{height:10px;border-radius:99px;background:#dfe8e6;overflow:hidden;margin:10px 0 6px}
  .progress i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .3s}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:16px;margin-top:6px}
  .meta span{display:inline-flex;align-items:center;gap:6px}

  /* tournées */
  .card.tap.tripcard{display:flex;gap:14px;align-items:center;padding:14px 16px}
  .tripcard h3,.tripcard .meta{display:flex}
  .tripcard .grow{display:block}
  .datebox{width:58px;flex:0 0 58px;border-radius:14px;background:var(--g2);color:var(--g);text-align:center;padding:7px 0}
  .datebox b{display:block;font-size:24px;line-height:1.05}
  .datebox span{font-size:16px;font-weight:700}
  .chev{color:#9db1ae}

  .bigrem{font-size:40px;font-weight:800;line-height:1;color:var(--g)}
  .stops{padding:0}
  .stop{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-top:1px solid var(--line2);background:none;width:100%;text-align:right;cursor:pointer;min-height:68px}
  .stop:first-child{border-top:0}
  .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;background:#f1f4f4;color:var(--muted);border:1px solid var(--line2)}
  .num.next{background:var(--g);color:#fff;border-color:var(--g)}
  .num.ok{background:var(--g2);color:var(--g);border-color:var(--g2)}
  .num.problem{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
  .stop h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .sub{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#e1e9e8;border-radius:14px;padding:4px;margin:22px 0 12px}
  .seg button{min-height:44px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px #0d4d4d1f}
  #tripMap{height:min(62vh,460px);border-radius:18px;border:1px solid var(--line);overflow:hidden;background:#f3f5f2}
  .soft-tiles .leaflet-tile-pane{filter:saturate(.25) brightness(1.08) contrast(.88)}
  .leaflet-container{font-family:Assistant,sans-serif}
  .leaflet-control-attribution{font-size:11px}
  .pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--g);border:3px solid #fff;box-shadow:0 2px 7px #0004}
  .pin.done{background:#8fb3ab}.pin.problem{background:var(--red)}

  /* livraison */
  .info-line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
  .info-line:first-child{border-top:0;padding-top:2px}
  .info-line .ic{color:var(--g);margin-top:1px}
  .note-box{background:#f6f8f4;border:1px solid #e3e9df;border-radius:14px;padding:12px 14px;white-space:pre-line}
  .doc{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px 12px;margin-top:8px;cursor:pointer;text-align:right}
  .doc .ic{width:40px;height:40px;border-radius:11px;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:0 0 40px}
  .proofs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  .proof{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}
  .proof .th{width:64px;height:64px;flex:0 0 64px;border-radius:10px;background:#e9eeee center/cover no-repeat;display:grid;place-items:center;color:#9db1ae}
  .proof.failed{border-color:var(--red-line);background:#fffaf9}
  .actionbar{position:fixed;inset-inline:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(#eef1f100,#eef1f1 18px);padding:18px 16px 12px}
  .actionbar .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
  .done-card{display:flex;gap:12px;align-items:flex-start}

  /* navigation du livreur : deux entrées seulement */
  .nav{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
  .nav button{border:0;background:none;color:var(--muted);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
  .nav button.on{color:var(--g)}
  .nav button.on svg{stroke-width:2.4}

  /* panneaux (téléphone) */
  .back-drop{position:fixed;inset:0;background:#0b2b2a66;z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  .sheet .grab{width:44px;height:5px;border-radius:9px;background:#d5dedd;margin:0 auto 10px}
  .sheet h2{font-size:22px}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:600px){.back-drop{align-items:center}.sheet{border-radius:22px}}
  .choice{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;margin-top:10px;cursor:pointer;text-align:right;font-weight:700;font-size:17px}
  .choice.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red-line);color:var(--red)}
  .choice .dot{width:22px;height:22px;border-radius:50%;border:2px solid #b9c8c6;flex:0 0 22px;margin-inline-start:auto}
  .choice.on .dot{border:7px solid var(--red)}
  .shot{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px;background:#f7f9f9}
  .shot img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#222}
  .shot .bar{display:flex;justify-content:space-between;gap:8px;padding:8px}
  .drop{border:2px dashed #b9cbc8;border-radius:18px;padding:26px 16px;text-align:center;background:#f8fbfa;margin-top:14px}
  .viewer{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center}
  .viewer img{max-width:100%;max-height:100%}
  .viewer button{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;background:#fff;border:0;border-radius:12px;min-height:48px;padding:0 16px;font-weight:700}

  .skel{background:linear-gradient(90deg,#e4eaea 0,#f2f5f5 50%,#e4eaea 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;height:120px;margin-top:12px}
  @keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
  .spin{animation:rot .9s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:300;background:var(--g);color:#fff;border-radius:14px;padding:13px 18px;font-weight:700;max-width:92vw;box-shadow:0 8px 24px #0d4d4d40;display:flex;gap:8px;align-items:center}
  .toast.err{background:var(--red)}
  .offline{background:#f6f2e8;color:#6b5321;border-bottom:1px solid #eadfc4;padding:9px 16px;text-align:center;font-weight:700;font-size:16px;display:flex;gap:8px;justify-content:center;align-items:center}
  .login{max-width:420px;margin:0 auto;padding:44px 18px 40px}
  .logo{width:64px;height:64px;border-radius:20px;background:var(--g);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
  .logo svg.i{width:34px;height:34px}
  /* maquette « Une livraison. Une action claire. » */
  .cardh{font-size:19px;margin:0 0 10px;font-weight:800}
  .card+.card{margin-top:14px}
  .docrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
  .docrow:first-of-type{border-top:0}
  .docrow .ic{width:40px;height:40px;border-radius:11px;background:var(--g2);color:var(--g);display:grid;place-items:center;flex:0 0 40px}
  .success{text-align:center;margin:28px 0 8px}
  .success-icon{width:78px;height:78px;border-radius:50%;background:var(--g2);color:var(--g);display:grid;place-items:center;margin:0 auto 18px}
  .success-icon.problem{background:var(--red-bg);color:var(--red)}
  .success-icon svg.i.lg{width:38px;height:38px}
  .status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .card.hero.today{background:var(--g);border-color:var(--g);color:#fff}
  .today .meta,.today .small,.today .status{color:#d3e4dc}
  .today .chip.ok{background:#ffffff1f;color:#fff}
  .today .progress{background:#ffffff2b}.today .progress i{background:#d3e4c5}
  .today .btn.primary{background:#fff;color:var(--g);border-color:#fff}
  .logo.sm{width:44px;height:44px;border-radius:14px;margin:0}
  .logo.sm svg.i{width:24px;height:24px}
  /* étape 2 : signature liée au document */
  .binding{border-inline-start:4px solid var(--g);background:var(--g2);padding:12px 14px;border-radius:12px;margin-top:12px;display:grid;gap:2px}
  .binding b{font-size:17px}.binding span{color:var(--muted)}
  .docid{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace;font-size:16px}
  .pdfpage{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px;box-shadow:var(--shadow)}
  .signpad{position:relative;border:2px solid #8ba99c;border-radius:16px;background:#fff;overflow:hidden;margin-top:6px}
  .signpad canvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}
  .signhint{position:absolute;inset-inline:16px;bottom:14px;border-top:1px dashed #b7cabf;padding-top:6px;color:var(--muted);pointer-events:none}
  .sigimg{display:block;width:100%;max-height:170px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:10px}
  .docrow.wrapd{flex-wrap:wrap}
  .docbtns{display:flex;gap:8px;width:100%;padding-inline-start:52px}
  .docbtns .btn{flex:1;min-height:48px;padding:0 10px}
  /* accès par lien */
  .linkinfo{display:flex;gap:8px;align-items:center;background:var(--g2);color:var(--g);border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:12px}
  .linkdead{background:var(--red-bg);color:var(--red);border-bottom:1px solid var(--red-line);padding:12px 16px;font-weight:800;display:flex;gap:8px;align-items:flex-start;justify-content:center;text-align:center}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ==========================================================================
   Espace livreur — accès personnel par numéro de téléphone et code SMS.
   Le livreur ne voit que SES tournées publiées : la base le vérifie à chaque appel
   (fonctions driver_* et règles du stockage). Rien du CRM n'est chargé ici.
   ========================================================================== */
const SUPABASE_URL = 'https://fryxliuhaayyedmskohm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_czw0QR_TnL5SY_Rjaq7lrw_q55YRGny';
// session séparée de celle du CRM (même téléphone, deux espaces distincts)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-driver-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const DL = window.Delivery;
// Accès par lien privé : la clé est après « # » dans l'adresse (jamais envoyée aux serveurs, absente des journaux).
// Elle est gardée pour cet onglet seulement, puis retirée de la barre d'adresse.
const LINK = (() => {
  const t = DL.linkTokenFrom(location.hash);
  if (t) { try { sessionStorage.setItem('drv-link', t); } catch (e) {} history.replaceState(null, '', location.pathname + location.search + '#/'); return t; }
  try { return sessionStorage.getItem('drv-link'); } catch (e) { return null; }
})();
// Chaque appel passe la clé dans un en-tête ; le serveur revérifie le lien à chaque fois
async function linkApi(action, body) {
  const r = await fetch('/api/link', { method: 'POST', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'application/json', 'x-link-token': LINK },
    body: JSON.stringify(Object.assign({ action }, body || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { const e = new Error(j.error || 'http ' + r.status); e.code = j.error || ''; e.status = r.status; if (/^link_/.test(e.code)) { const was = S.linkDead; S.linkDead = e.code; if (!was) setTimeout(render, 0); } throw e; }
  if (S.linkDead) { S.linkDead = null; setTimeout(render, 0); }
  return j;
}
const isLinkErr = e => /^link_/.test(String((e && e.code) || ''));
const RESEND_SECONDS = 60;
const DOC_TYPES = { 305: 'חשבונית מס', 320: 'חשבונית מס/קבלה', 330: 'זיכוי', 400: 'קבלה', 300: 'חשבון עסקה', 200: 'תעודת משלוח' };
const HE_MONTHS = ['ינו׳', 'פבר׳', 'מרץ', 'אפר׳', 'מאי', 'יוני', 'יולי', 'אוג׳', 'ספט׳', 'אוק׳', 'נוב׳', 'דצמ׳'];

/* ---------- utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'trip' && h[1] && h[2] === 'stop' && h[3] && h[4] === 'sign' && h[5]) return { view: 'sign', tripId: h[1], stopId: h[3], docId: h[5], step: h[6] || '1' };
  if (h[0] === 'trip' && h[1]) return { view: h[2] === 'stop' && h[3] ? (h[4] === 'done' ? 'done' : 'stop') : 'trip', tripId: h[1], stopId: h[3] || null };
  if (h[0] === 'account') return { view: 'account' };
  return { view: 'trips' };
}
const go = hash => { if (location.hash !== hash) location.hash = hash; else render(); };

let _toastT = null;
function toast(text, err) {
  let el = $('#toastBox');
  if (!el) { el = document.createElement('div'); el.id = 'toastBox'; document.body.appendChild(el); }
  el.className = 'toast' + (err ? ' err' : '');
  el.innerHTML = ic(err ? 'alert' : 'check') + '<span>' + esc(text) + '</span>';
  $('#toast').textContent = text;
  clearTimeout(_toastT); _toastT = setTimeout(() => el.remove(), 3200);
}
// Erreurs du serveur pendant le travail (hors connexion)
function workError(e) {
  if (isLinkErr(e)) return DL.LINK_DEAD_TEXT + ' מה שהוקלד נשאר כאן; אחרי הארכת הקישור אפשר לנסות שוב.';
  const m = String((e && (e.message || e.details)) || e || '');
  if (/failed to fetch|network|load failed/i.test(m) || !navigator.onLine) return 'אין חיבור לאינטרנט. מנסים שוב כשהחיבור חוזר.';
  if (/not_found/.test(m)) return 'המסלול הזה כבר לא משויך אליך. פונים למשרד.';
  if (/not_driver|JWT|jwt|401|403/.test(m)) return 'הגישה שלך לא בתוקף. מתחברים מחדש.';
  if (/already_validated/.test(m)) return 'המשלוח הזה כבר אושר. לשינוי פונים למשרד.';
  if (/note_required/.test(m)) return 'נא לכתוב הסבר קצר.';
  return 'משהו השתבש. מנסים שוב.';
}

const fmtWait = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

async function sendCode(isResend) {
  const L = S.login;
  if (!isResend) {
    L.phone = $('#phone').value;
    const e164 = DL.normalizePhone(L.phone);
    if (!e164) { L.error = 'מספר הטלפון לא תקין. לדוגמה: 050-123-4567'; return render(); }
    L.e164 = e164;
  }
  L.busy = true; L.error = ''; render();
  const { error } = await sb.auth.signInWithOtp({ phone: L.e164, options: { shouldCreateUser: false } }).catch(e => ({ error: e }));
  L.busy = false;
  if (error) {
    const m = DL.authError(error);
    if (m.kind === 'wait') { L.step = 'code'; L.resendAt = Date.now() + m.seconds * 1000; L.error = isResend ? m.text : ''; }
    else L.error = m.text;
    return render();
  }
  L.step = 'code'; L.code = ''; L.resendAt = Date.now() + RESEND_SECONDS * 1000;
  render();
  if (isResend) toast('נשלח קוד חדש');
  setTimeout(() => { const c = $('#code'); if (c) c.focus(); }, 50);
}
async function verifyCode() {
  const L = S.login;
  L.code = ($('#code').value || '').replace(/\D/g, '');
  if (L.code.length !== 6) { L.error = 'הקוד כולל 6 ספרות.'; return render(); }
  L.busy = true; L.error = ''; render();
  const { error } = await sb.auth.verifyOtp({ phone: L.e164, token: L.code, type: 'sms' }).catch(e => ({ error: e }));
  L.busy = false;
  if (error) { L.error = DL.authError(error).text; L.code = ''; render(); const c = $('#code'); if (c) c.focus(); return; }
  // onAuthStateChange charge l'espace
}

async function loadTrips() {

  if (error) { S.tripsError = workError(error); return; }
  S.trips = data || []; S.tripsAt = Date.now();
}
async function apiTrip(id) {
  if (S.mode !== 'link') return sb.rpc('driver_trip', { p_trip: id });
  try {
    const j = await linkApi('trip'); S.link = j.link; S.me = { name: j.link.driver_name };
    if (id && id !== j.trip.id) return { error: new Error('not_found') };     // une seule tournée par lien
    return { data: j.trip };
  } catch (e) { return { error: e }; }
}
async function apiSetStatus(task, status, note) {
  if (S.mode !== 'link') return sb.rpc('driver_set_status', { p_task: task, p_status: status, p_note: note }).catch(e => ({ error: e }));
  try { return { data: (await linkApi('status', { task_id: task, status, note })).result }; } catch (e) { return { error: e }; }
}
const blobToDataUrl = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });
async function apiProof(item) {
  if (S.mode !== 'link') {
    const up = await sb.storage.from('delivery-proofs').upload(item.path, item.blob, { contentType: item.mime, cacheControl: '0', upsert: false });
    // déjà déposé lors d'un essai précédent : on passe à l'enregistrement (pas de doublon, pas de perte)
    if (up.error && !/exists|duplicate|409/i.test(String(up.error.message || up.error.statusCode || ''))) return { error: up.error };
    return sb.rpc('driver_add_proof', { p_task: item.taskId, p_path: item.path, p_note: item.note, p_captured_at: item.capturedAt, p_mime: item.mime, p_bytes: item.bytes });
  }
  try { return { data: (await linkApi('proof', { task_id: item.taskId, id: item.id, image: await blobToDataUrl(item.blob), note: item.note, captured_at: item.capturedAt })).proof }; }
  catch (e) { return { error: e }; }
}
// liens temporaires de lecture : [{ path, url }]
async function apiUrls(bucket, paths, sec) {
  if (S.mode !== 'link') {
    const { data } = await sb.storage.from(bucket).createSignedUrls(paths, sec).catch(() => ({ data: null }));
    return (data || []).filter(x => x.signedUrl).map(x => ({ path: x.path, url: x.signedUrl }));
  }
  try { return (await linkApi('urls', { paths, expires: sec })).urls || []; } catch (e) { return []; }
}
async function apiUrl(bucket, p, sec) {
  const u = (await apiUrls(bucket, [p], sec)).find(x => x.path === p);
  return u ? { data: { signedUrl: u.url } } : { error: new Error(S.linkDead || 'url') };
}
async function apiSignFetch(payload) {
  if (S.mode === 'link') return fetch('/api/link', { method: 'POST', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'application/json', 'x-link-token': LINK }, body: JSON.stringify(Object.assign({ action: 'sign' }, payload)) });
  const { data } = await sb.auth.getSession(); const tok = data && data.session && data.session.access_token;
  if (!tok) { const e = new Error('JWT'); e.status = 401; throw e; }
  return fetch('/api/driver-sign', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(payload) });
}
async function loadTrip(id) {
  S.tripLoading = true; S.tripError = '';
  const { data, error } = await apiTrip(id);
  S.tripLoading = false;
  if (error) { S.trip = null; S.tripError = workError(error); return; }
  data.stops = DL.orderStops(data.stops || []);
  S.trip = data;
  // les pièces déjà reçues par le serveur sont retirées de la file de l'appareil
  const got = new Set(data.stops.flatMap(s => (s.proofs || []).map(p => p.path)));
  for (const q of S.queue.filter(q => got.has(q.path))) await qDelete(q.id);
  S.queue = S.queue.filter(q => !got.has(q.path));
}

    `<div class="sec">בהמשך ${t.upcoming.length ? `<span class="count">${t.upcoming.length}</span>` : ''}</div>` +
    (t.upcoming.length ? t.upcoming.map(row).join('') : `<p class="muted" style="padding:0 2px">אין מסלולים נוספים כרגע.</p>`) +
    (t.past.length ? `<button class="linkbtn" style="margin-top:14px" data-act="toggle-past">${S.showPast ? 'הסתרת' : 'הצגת'} מסלולים קודמים (${t.past.length})</button>
      ${S.showPast ? t.past.map(row).join('') : ''}` : '') +
    `<p class="muted" style="margin-top:22px;text-align:center">${ic('lock', 'sm')} מוצגים רק המסלולים שהמשרד שלח אליך.</p>`;
}
function errorCard(text, act) {
  return `<div class="card flat" style="margin-top:16px;text-align:center;padding:26px 18px">
    <div class="logo" style="background:var(--red-bg);color:var(--red);width:56px;height:56px">${ic(navigator.onLine ? 'alert' : 'wifi')}</div>

    <button class="btn soft" style="margin-top:14px" data-act="${act}">${ic('refresh')}ניסיון חוזר</button></div>`;
}

/* ==========================================================================
   MA TOURNÉE : titre, progression, prochaine livraison, liste (la carte est secondaire)
   ========================================================================== */
function screenTrip(r) {
  const back = S.mode === 'link' ? '' : `<button class="back" data-go="#/trips">${ic('back', 'sm')}המסלולים שלי</button>`;
  if (!S.trip || S.trip.id !== r.tripId) return back + (S.tripError ? errorCard(S.tripError, 'reload-trip') : '<div class="skel"></div><div class="skel" style="height:200px"></div>');
  const T = S.trip, stops = T.stops, pr = DL.progress(stops), next = DL.nextStop(stops);
  const area = DL.areaOf(stops.map(s => s.city));
  const nextCard = next ? (() => { const i = stops.indexOf(next) + 1, nav = navUrl(next), tel = telUrl(next.phone);
    return `<article class="card hero" style="margin-top:16px">
      <div class="between"><span class="chip plain">${ic('route')}המשלוח הבא · ${i} מתוך ${stops.length}</span></div>
      <h2 style="margin-top:12px;font-size:24px">${esc(next.name)}</h2>
      <p class="muted">${esc(addr(next)) || 'אין כתובת'}</p>
      ${next.instructions ? `<div class="note-box small" style="margin-top:10px">${esc(next.instructions)}</div>` : ''}
      <div class="btns">

        ${tel ? `<a class="btn" href="${esc(tel)}">${ic('phone')}התקשרות</a>` : `<span class="btn" aria-disabled="true" style="opacity:.5">${ic('phone')}אין טלפון</span>`}
      </div>
      <button class="btn soft full" style="margin-top:10px" data-go="#/trip/${T.id}/stop/${next.id}">פרטי המשלוח ${ic('open')}</button>
    </article>`; })()
    : `<article class="card hero done-card" style="margin-top:16px"><span class="logo" style="width:48px;height:48px;margin:0;background:var(--g2);color:var(--g)">${ic('check')}</span>
        <div><h2>${stops.length ? 'כל המשלוחים טופלו' : 'אין משלוחים במסלול'}</h2><p class="muted">${stops.length ? 'תודה! המשרד רואה את כל הסטטוסים.' : 'המשרד עדיין לא הוסיף עצירות.'}</p></div></article>`;
  const list = stops.map((s, k) => { const st = DL.statusOf(s), info = DL.statusInfo(st), isNext = next && s.id === next.id;
    const cls = st === 'pending' ? (isNext ? 'next' : '') : info.tone === 'ok' ? 'ok' : 'problem';
    return `<button class="stop" data-go="#/trip/${T.id}/stop/${s.id}">
      <span class="num ${cls}" aria-hidden="true">${st === 'pending' ? k + 1 : ic(info.icon, 'sm')}</span>

      ${st === 'pending' ? (isNext ? `<span class="chip plain">הבא</span>` : '') : chip(st)}
    </button>`; }).join('');
  return back + `<header><div class="kicker">${esc(dateLong(T.date))}${area ? ' · ' + esc(area) : ''}</div><h1>${esc(T.name || 'המסלול')}</h1></header>
    <section class="card" style="margin-top:12px" aria-label="התקדמות">
      <div class="between"><div><span class="bigrem">${pr.remaining}</span> <span class="muted" style="font-weight:700">${pr.remaining === 1 ? 'משלוח נותר' : 'משלוחים נותרו'}</span></div>
        <span class="small muted">${pr.done} מתוך ${pr.total} טופלו</span></div>

      ${pr.problems ? `<div class="meta" style="color:var(--red)"><span>${ic('alert', 'sm')}${pr.problems === 1 ? 'בעיה אחת דווחה' : pr.problems + ' בעיות דווחו'}</span></div>` : ''}

    <div class="seg" role="tablist" aria-label="תצוגה">
      <button role="tab" aria-selected="${S.tripMode === 'list'}" class="${S.tripMode === 'list' ? 'on' : ''}" data-act="mode" data-mode="list">${ic('list', 'sm')}רשימה</button>
      <button role="tab" aria-selected="${S.tripMode === 'map'}" class="${S.tripMode === 'map' ? 'on' : ''}" data-act="mode" data-mode="map">${ic('map', 'sm')}מפה</button>
    </div>
    ${S.tripMode === 'map' ? `<div id="tripMap" aria-label="מפת העצירות"></div><p class="hint">המיקומים לפי הכתובות במערכת. אין כאן זמני הגעה משוערים.</p>`

}
function drawMap() {
  const el = $('#tripMap'); if (!el || !S.trip) return;
  if (!window.L) { setTimeout(drawMap, 200); return; }
  if (_map) { try { _map.remove(); } catch (e) {} _map = null; }
  _map = L.map(el, { zoomControl: true, attributionControl: false }).setView([32.08, 34.85], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(_map);
  L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(_map);
  el.classList.add('soft-tiles');
  const pts = [], next = DL.nextStop(S.trip.stops);
  S.trip.stops.forEach((s, k) => {
    const ll = parseLL(s.gps); if (!ll) return;
    const st = DL.statusOf(s), cls = st === 'pending' ? '' : DL.statusInfo(st).tone === 'ok' ? 'done' : 'problem';
    const icon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: `<div class="pin ${cls}">${st === 'pending' ? k + 1 : (cls === 'done' ? '✓' : '!')}</div>` });
    const m = L.marker(ll, { icon, title: s.name, keyboard: true }).addTo(_map);
    m.bindPopup(`<div style="text-align:right;min-width:170px"><b style="font-size:16px">${esc(s.name)}</b><div style="color:#5b7170;margin:3px 0 10px">${esc(addr(s))}</div>
      <a href="#/trip/${S.trip.id}/stop/${s.id}" style="display:block;text-align:center;background:#0d4d4d;color:#fff;border-radius:10px;padding:9px;font-weight:700;text-decoration:none">${s === next ? 'המשלוח הבא · פתיחה' : 'פתיחה'}</a></div>`);
    pts.push(ll);
  });
  setTimeout(() => { if (!_map) return; _map.invalidateSize(); if (pts.length) _map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 }); }, 60);
}

/* ==========================================================================
   UNE LIVRAISON : client, appeler / naviguer, consignes et documents, photo du bon, validation
   ========================================================================== */
function stopOf(r) { return S.trip && S.trip.id === r.tripId ? S.trip.stops.find(s => s.id === r.stopId) : null; }
// État des photos d'une livraison, en un coup d'œil (« התקבל » seulement après confirmation du serveur)
function proofSummary(s) {
  const got = (s.proofs || []).length, q = S.queue.filter(x => x.taskId === s.id);
  if (q.some(x => x.state === 'sending')) return `<span class="chip muted">${ic('spinner', 'spin')}שליחה מתבצעת</span>`;
  if (q.some(x => x.state === 'failed')) return `<span class="chip problem">${ic('alert')}השליחה נכשלה</span>`;
  if (q.length) return `<span class="chip muted">${ic('clock')}ממתין לשליחה</span>`;
  if (got) return `<span class="chip ok">${ic('check')}${got === 1 ? 'תמונה אחת התקבלה' : got + ' תמונות התקבלו'}</span>`;
  return `<span class="chip muted">${ic('camera')}טרם צורפו תמונות</span>`;
}
function screenStop(r) {
  const back = `<button class="back" data-go="#/trip/${r.tripId}">${ic('back', 'sm')}למסלול</button>`;
  if (!S.trip || S.trip.id !== r.tripId) return back + (S.tripError ? errorCard(S.tripError, 'reload-trip') : '<div class="skel"></div>');
  const s = stopOf(r);
  if (!s) return back + `<div class="msg err">${ic('alert')}<span>המשלוח הזה לא נמצא במסלול.</span></div>`;
  const k = S.trip.stops.indexOf(s) + 1, st = DL.statusOf(s), done = DL.isDone(s);
  const nav = navUrl(s), tel = telUrl(s.phone), tel2 = telUrl(s.phone2);
  const local = S.queue.filter(q => q.taskId === s.id);
  const pieces = (s.proofs || []).map(p => ({ kind: 'server', path: p.path, note: p.note, at: p.received_at }))
    .concat(local.map(q => ({ kind: 'local', q })));
  const pieceHtml = x => {
    if (x.kind === 'server') return `<div class="proof"><button class="th" data-act="view-proof" data-path="${esc(x.path)}" aria-label="הגדלת התמונה" style="border:0;cursor:pointer${S.thumbs[x.path] ? ';background-image:url(' + esc(S.thumbs[x.path]) + ')' : ''}">${S.thumbs[x.path] ? '' : ic('image')}</button>
      <div class="grow"><span class="chip ok">${ic('check')}התקבל</span><div class="small muted" style="margin-top:4px">${timeIL(x.at)}${x.note ? ' · ' + esc(x.note) : ''}</div></div></div>`;
    const q = x.q, ps = DL.PROOF_STATES[q.state] || DL.PROOF_STATES.waiting;
    return `<div class="proof ${q.state === 'failed' ? 'failed' : ''}"><button class="th" data-act="view-local" data-id="${q.id}" aria-label="הגדלת התמונה" style="border:0;cursor:pointer;background-image:url(${esc(q.url || '')})"></button>
      <div class="grow"><span class="chip ${ps.tone}">${q.state === 'sending' ? ic('spinner', 'spin') : ic(ps.icon)}${esc(q.state === 'failed' ? 'השליחה נכשלה' : ps.label)}</span>
        <div class="small ${q.state === 'failed' ? '' : 'muted'}" style="margin-top:4px;${q.state === 'failed' ? 'color:var(--red)' : ''}">${q.state === 'failed' ? esc(q.error || 'התמונה נשמרה במכשיר.') : q.state === 'sending' ? 'ממתין לאישור מהשרת. לא סוגרים את המסך.' : 'התמונה שמורה במכשיר עד שתתקבל.'}</div>
        ${q.state === 'failed' || q.state === 'waiting' ? `<button class="linkbtn" data-act="retry" data-id="${q.id}">${ic('refresh', 'sm')}ניסיון נוסף</button>` : ''}</div></div>`;
  };
  const docs = s.docs || [];
  return back + `<header><h1>${esc(s.name)}</h1><p class="muted" style="font-size:17px">${esc(addr(s)) || 'אין כתובת'}</p></header>
    <div class="between" style="margin-top:10px">${chip(st)}<span class="muted">עצירה ${k} מתוך ${S.trip.stops.length}</span></div>
    ${done && s.delivered_at ? `<p class="muted" style="margin-top:6px">אושר ב-${timeIL(s.delivered_at)}</p>` : ''}
    <div class="btns">
      ${nav ? `<a class="btn" href="${esc(nav)}" target="_blank" rel="noopener">${ic('nav')}ניווט</a>` : `<span class="btn" aria-disabled="true" style="opacity:.5">${ic('nav')}אין כתובת</span>`}
      ${tel ? `<a class="btn" href="${esc(tel)}">${ic('phone')}התקשרות</a>` : `<span class="btn" aria-disabled="true" style="opacity:.5">${ic('phone')}אין טלפון</span>`}
    </div>
    ${done && s.delivery_note ? `<div class="msg ${DL.isProblem(s) ? 'err' : 'info'}">${ic('note')}<span>${esc(s.delivery_note)}</span></div>` : ''}
    <section class="card" style="margin-top:16px">
      <h2 class="cardh">חשוב לדעת</h2>
      ${s.instructions ? `<div class="note-box">${esc(s.instructions)}</div>` : '<p class="muted">אין הנחיות מיוחדות.</p>'}
      ${s.contact ? `<div class="info-line"><span class="ic">${ic('user')}</span><div><div class="small muted">איש קשר</div><b>${esc(s.contact)}</b></div></div>` : ''}
      ${s.phone || s.phone2 ? `<div class="info-line"><span class="ic">${ic('phone')}</span><div><div class="small muted">טלפון</div>${[s.phone ? `<a class="ltr" href="${esc(tel)}">${esc(s.phone)}</a>` : '', s.phone2 ? `<a class="ltr" href="${esc(tel2)}">${esc(s.phone2)}</a>` : ''].filter(Boolean).join(' · ')}</div></div>` : ''}
    </section>
    <section class="card">
      <h2 class="cardh">מסמכי המשלוח</h2>
      ${docs.length ? docs.map(d => docRowHtml(s, d)).join('')
        : '<p class="muted">לא צורפו מסמכים למשלוח.</p>'}
    </section>
    <section class="card">
      <div class="between"><h2 class="cardh" style="margin:0">הוכחת מסירה</h2>${proofSummary(s)}</div>
      <p class="muted" style="margin-top:6px">מצלמים את התעודה החתומה — מלאה וברורה.</p>
      ${pieces.length ? `<div class="proofs">${pieces.map(pieceHtml).join('')}</div>` : ''}
      <button class="btn full" style="margin-top:14px" data-act="photo">${ic('camera')}${pieces.length ? 'הוספת תמונה' : 'הוספת תמונות'}</button>
    </section>
    ${done ? `<div class="msg info">${ic('lock')}<span>המשלוח אושר. לשינוי הסטטוס פונים למשרד.</span></div>`
      : `<button class="btn primary full" style="margin-top:22px" data-act="deliver">${ic('check')}אישור מסירה</button>
         <button class="btn danger full" style="margin-top:12px" data-act="problem">${ic('alert')}דיווח על בעיה</button>`}`;
}
// Après la validation : un résumé clair, puis retour au parcours
function screenDone(r) {
  const s = stopOf(r);
  if (!s || !DL.isDone(s)) return screenStop(r);
  const ok = DL.statusOf(s) === 'delivered', next = DL.nextStop(S.trip.stops);
  return `<div class="success"><div class="success-icon ${ok ? '' : 'problem'}">${ic(ok ? 'check' : 'alert', 'lg')}</div>
      <h1>${ok ? 'המסירה אושרה' : 'הדיווח נרשם'}</h1><p class="muted">${ok ? 'המשרד רואה את העדכון.' : 'המשרד קיבל את הדיווח ויטפל בו.'}</p></div>
    <section class="card"><h3>${esc(s.name)}</h3>
      <div class="between" style="margin-top:10px">${chip(DL.statusOf(s))}<span class="muted">${s.delivered_at ? timeIL(s.delivered_at) : ''}</span></div>
      ${s.delivery_note ? `<div class="note-box" style="margin-top:12px">${esc(s.delivery_note)}</div>` : ''}
      <div class="between" style="margin-top:14px"><span class="muted">הוכחת מסירה</span>${proofSummary(s)}</div>
    </section>
    <button class="btn primary full" style="margin-top:18px" data-go="#/trip/${S.trip.id}">${next ? 'המשך למשלוח הבא' : 'חזרה למסלול'} ${ic('open')}</button>
    ${next ? `<p class="muted" style="text-align:center;margin-top:10px">הבא: ${esc(next.name)}</p>` : `<p class="muted" style="text-align:center;margin-top:10px">כל המשלוחים במסלול טופלו.</p>`}`;
}

/* ---------- panneaux ---------- */
function sheet(title, body, onClose) {
  const root = $('#sheets'), back = document.createElement('div');
  back.className = 'back-drop';
  back.innerHTML = `<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>
    <div class="between"><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="סגירה">${ic('x')}</button></div>${body}</section>`;
  root.appendChild(back);
  const prev = document.activeElement;
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); if (onClose) onClose(); if (prev && prev.focus) try { prev.focus(); } catch (e) {} };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', e => { if (e.target === back) close(); });
  back.querySelector('[data-x]').onclick = close;
  setTimeout(() => { const f = back.querySelector('textarea,input,button.btn'); if (f && f.tagName !== 'BUTTON') f.focus(); }, 60);
  return { el: back, close, q: s => back.querySelector(s) };
}

// Confirmation « Livré » : récapitulatif (client, résultat, photos) avant l'envoi définitif
function deliverSheet(s) {
  const got = (s.proofs || []).length, pend = S.queue.filter(q => q.taskId === s.id && q.state !== 'received').length;
  const sh = sheet('לאשר שהמשלוח נמסר?', `<h3 style="margin-top:12px;font-size:19px">${esc(s.name)}</h3><p class="muted">${esc(addr(s))}</p>
    <div class="card flat" style="margin-top:12px">
      <div class="between"><span>תוצאה</span>${chip('delivered')}</div>
      <div class="between" style="margin-top:12px"><span>הוכחת מסירה</span>${proofSummary(s)}</div>
    </div>
    ${got || pend ? '' : `<div class="msg warn">${ic('camera')}<span>עוד לא צורפה תמונה של התעודה החתומה. אפשר לצלם לפני האישור.</span></div>`}
    ${pend ? `<div class="msg warn">${ic('upload')}<span>${pend === 1 ? 'תמונה אחת עוד לא התקבלה' : pend + ' תמונות עוד לא התקבלו'}. היא תמשיך להישלח גם אחרי האישור.</span></div>` : ''}
    <label class="lbl" for="dNote">הערה <span class="muted">(לא חובה)</span></label>
    <textarea id="dNote" class="field" maxlength="1000" placeholder="למשל: נמסר לדנה במחסן"></textarea>
    <div id="dErr"></div>
    <button class="btn primary full" style="margin-top:16px" data-ok>${ic('check')}כן, המשלוח נמסר</button>
    <button class="btn full" style="margin-top:10px" data-back>חזרה לבדיקה</button>
    <p class="hint" style="text-align:center">אחרי האישור לא ניתן לשנות. מסירה אינה תשלום ואינה משנה את היתרה במורנינג.</p>`);
  sh.q('[data-back]').onclick = () => sh.close();
  sh.q('[data-ok]').onclick = () => submitStatus(sh, s, 'delivered', sh.q('#dNote').value);
}
// Livraison partielle / client absent / impossible : motif + explication obligatoire, puis récapitulatif
function problemSheet(s, preset) {
  let chosen = preset ? preset.chosen : null;
  const opts = ['partial', 'absent', 'impossible'];
  const sh = sheet('דיווח על בעיה', `<p style="margin-top:6px"><b>${esc(s.name)}</b></p><p class="muted">מה קרה?</p>
    <div role="radiogroup" aria-label="מה קרה">${opts.map(o => { const i = DL.STATUSES[o]; return `<button class="choice${chosen === o ? ' on' : ''}" role="radio" aria-checked="${chosen === o}" data-opt="${o}">${ic(i.icon)}${esc(i.label)}<span class="dot"></span></button>`; }).join('')}</div>
    <label class="lbl" for="pNote">הסבר קצר <span style="color:var(--red)">*</span></label>
    <textarea id="pNote" class="field" maxlength="1000" placeholder="מה נשאר למסור, או מה מנע את המסירה?">${esc(preset ? preset.note : '')}</textarea>
    <div id="pErr"></div>
    <button class="btn primary full" style="margin-top:16px" data-next>המשך לבדיקה</button>`);
  sh.el.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    chosen = b.dataset.opt;
    sh.el.querySelectorAll('[data-opt]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); });
  });
  sh.q('[data-next]').onclick = () => {
    const note = sh.q('#pNote').value, err = !chosen ? 'יש לבחור מה קרה.' : DL.checkStatusInput(chosen, note);
    if (err) { sh.q('#pErr').innerHTML = `<div class="msg err" role="alert">${ic('alert')}<span>${esc(err)}</span></div>`; return; }
    sh.close();
    const c = sheet('אישור דיווח', `<h3 style="margin-top:12px;font-size:19px">${esc(s.name)}</h3>

        ${shots.map((x, i) => `<div class="shot"><img src="${esc(x.url)}" alt="תמונה ${i + 1} של התעודה"><div class="bar">
          <button class="btn" style="min-height:46px" data-redo="${i}">${ic('camera')}צילום מחדש</button>
          <button class="btn ghost" style="min-height:46px" data-del="${i}">${ic('x')}הסרה</button></div></div>`).join('')}
        <button class="btn full" style="margin-top:12px" data-cam>${ic('camera')}הוספת עמוד נוסף</button>
        <label class="lbl" for="phNote">הערה <span class="muted">(לא חובה)</span></label>
        <textarea id="phNote" class="field" maxlength="1000" placeholder="למשל: חתם יוסי, מנהל המשמרת"></textarea>
        <button class="btn primary full" style="margin-top:16px" data-send>${ic('upload')}שליחת תמונות (${shots.length})</button>`;
    }
    box.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => sh.q('#camIn').click());
    box.querySelectorAll('[data-gal]').forEach(b => b.onclick = () => sh.q('#galIn').click());
    box.querySelectorAll('[data-redo]').forEach(b => b.onclick = () => { redoIdx = +b.dataset.redo; sh.q('#redoIn').click(); });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const [x] = shots.splice(+b.dataset.del, 1); URL.revokeObjectURL(x.url); draw(); });
    const send = box.querySelector('[data-send]');
    if (send) send.onclick = async () => {
      send.disabled = true; send.innerHTML = ic('spinner', 'spin') + 'מכין…';
      const note = (sh.q('#phNote').value || '').trim();
      const files = shots.map(x => x.file); sh.close();

  const add = (files, replaceAt) => {
    const list = [...files].filter(f => f && /^image\//.test(f.type || 'image/'));

    if (replaceAt >= 0) { URL.revokeObjectURL(shots[replaceAt].url); shots[replaceAt] = { file: list[0], url: URL.createObjectURL(list[0]) }; }
    else list.forEach(f => shots.push({ file: f, url: URL.createObjectURL(f) }));

  sh.q('#redoIn').onchange = e => { add(e.target.files, redoIdx); e.target.value = ''; redoIdx = -1; };
  draw();
  photoSheet._add = add;   // pour l'aperçu local (tests)
}

// Réduit la photo (bon lisible, envoi rapide) : 2000 px max, JPEG
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (blob && blob.size > 0) return blob;
  } catch (e) { /* format non lu par le navigateur : on garde l'original s'il est accepté */ }
  if (/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  throw new Error('format');
}

/* ---------- file d'envoi : la pièce reste sur l'appareil tant que le serveur n'a pas confirmé ---------- */
const IDB = { db: null };
function idb() {
  if (IDB.db) return Promise.resolve(IDB.db);
  return new Promise(res => {
    try {
      const r = indexedDB.open('driver-proofs', 2);
      r.onupgradeneeded = () => { const db = r.result;
        if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('sigs')) db.createObjectStore('sigs', { keyPath: 'requestId' }); };
      r.onsuccess = () => { IDB.db = r.result; res(IDB.db); };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function qPut(item) { const db = await idb(); if (!db) return; const { url, ...rec } = item; await new Promise(r => { const t = db.transaction('queue', 'readwrite'); t.objectStore('queue').put(rec); t.oncomplete = t.onerror = r; }); }
async function qDelete(id) { const db = await idb(); if (!db) return; await new Promise(r => { const t = db.transaction('queue', 'readwrite'); t.objectStore('queue').delete(id); t.oncomplete = t.onerror = r; }); }
async function qLoad() {
  const db = await idb(); if (!db) return [];
  const all = await new Promise(r => { const t = db.transaction('queue', 'readonly'); const q = t.objectStore('queue').getAll(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); });
  const uid = S.session && S.session.user && S.session.user.id;
  return all.filter(x => x.owner === uid).map(x => Object.assign(x, { state: x.state === 'sending' ? 'waiting' : x.state, url: URL.createObjectURL(x.blob) }));
}

async function queueProofs(s, files, note) {
  const items = [];
  for (const f of files) {
    let blob;
    try { blob = await compress(f); } catch (e) { toast('פורמט התמונה לא נתמך. מצלמים שוב.', true); continue; }
    const id = uuid();
    const item = { id, owner: S.session.user.id, tripId: S.trip.id, taskId: s.id, path: DL.proofPath(S.trip.id, s.id, id, 'jpg'), blob,
      mime: 'image/jpeg', bytes: blob.size, note: note || null, capturedAt: new Date().toISOString(), state: 'waiting', error: '', url: URL.createObjectURL(blob) };
    await qPut(item); S.queue.push(item); items.push(item);
  }
  render();
  for (const it of items) await sendProof(it);
}
// Deux étapes, toutes deux confirmées par le serveur : fichier déposé, puis pièce enregistrée.
async function sendProof(item) {
  if (item.state === 'sending' || item.state === 'received') return;
  item.state = 'sending'; item.error = ''; render();
  try {
    const { data, error } = await apiProof(item);
    if (error) throw error;
    if (!data || !data.id || !data.received_at) throw new Error('no_confirmation');
    item.state = 'received';
    await qDelete(item.id);
    const stop = S.trip && S.trip.id === item.tripId ? S.trip.stops.find(x => x.id === item.taskId) : null;
    if (stop) { stop.proofs = (stop.proofs || []).concat([{ id: data.id, path: data.path, note: data.note, received_at: data.received_at }]); S.thumbs[data.path] = item.url; }
    S.queue = S.queue.filter(q => q.id !== item.id);
    toast('התמונה התקבלה');
  } catch (e) {
    item.state = 'failed';
    const m = String((e && (e.message || e.statusCode)) || e);
    item.error = isLinkErr(e) ? 'תוקף הקישור פג. התמונה שמורה במכשיר; אחרי הארכת הקישור — ניסיון נוסף.'
      : !navigator.onLine || /fetch|network|load failed/i.test(m) ? 'אין חיבור. התמונה שמורה במכשיר ותישלח שוב.'
      : /not_found|row-level|security|403|Unauthorized/i.test(m) ? 'המשלוח כבר לא משויך אליך. התמונה שמורה במכשיר; פונים למשרד.'
      : /too large|413|size/i.test(m) ? 'התמונה גדולה מדי. מצלמים שוב.' : 'השליחה נכשלה. התמונה שמורה במכשיר.';
    await qPut(item);
  }
  render();
}
async function retryAll() {
  if (S.mode === 'link' && S.linkDead) return;
  for (const q of S.queue.filter(q => q.state === 'failed' || q.state === 'waiting')) await sendProof(q);
  for (const g of S.sigs.filter(g => (g.state === 'failed' || g.state === 'waiting') && g.errorCode !== 'document_changed')) await sendSig(g);
}

// Miniatures des pièces reçues + bons de livraison : liens temporaires, vérifiés par la base à chaque demande
async function fillThumbs() {

/* ==========================================================================
   ÉTAPE 2 — SIGNATURE LIÉE AU DOCUMENT PRÉCIS
   1. le document exact (PDF Morning rattaché à l'arrêt) est affiché en entier et son empreinte SHA-256 calculée ;
   2. nom du réceptionnaire + signature au doigt ;
   3. vérification, puis envoi. Le serveur revérifie l'empreinte, garde une copie figée et fait l'exemplaire signé.
   « התקבל » seulement après sa réponse. En cas d'échec, le même envoi (même identifiant) est gardé sur l'appareil.
   ========================================================================== */
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
let _pdfjs = null;
function loadPdfJs() {
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS_BASE + 'build/pdf.min.js';
    s.onload = () => { const lib = window.pdfjsLib; if (!lib) { _pdfjs = null; rej(new Error('pdfjs')); return; } lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.js'; res(lib); };
    s.onerror = () => { _pdfjs = null; rej(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}
const sigKey = (taskId, morningId) => taskId + '|' + morningId;
const docLabel = d => (DOC_TYPES[d.type] || 'מסמך') + ' ' + (d.number || '');
const fmtDocDate = d => d.doc_date ? d.doc_date.split('-').reverse().join('/') : '';
const shortSha = sha => sha ? sha.slice(0, 8) + '…' + sha.slice(-4) : '';
function signCtx(r) {
  const s = stopOf(r); if (!s) return null;
  const d = (s.docs || []).find(x => x.morning_id === r.docId); if (!d) return null;
  const key = sigKey(s.id, d.morning_id);
  return { s, d, key, dr: S.drafts[key] || (S.drafts[key] = { receiver: '', strokes: [] }), q: S.sigs.find(x => x.taskId === s.id && x.morningId === d.morning_id) };
}

// Une ligne de « מסמכי המשלוח » : consulter, signer, état de la signature
function docRowHtml(s, d) {
  const sig = d.signature, q = S.sigs.find(x => x.taskId === s.id && x.morningId === d.morning_id);
  const st = sig ? `<span class="chip ok">${ic('check')}נחתם · ${esc(sig.receiver_name)}</span>`

      : q.state === 'failed' ? `<span class="chip problem">${ic('alert')}השליחה נכשלה</span>` : `<span class="chip muted">${ic('clock')}ממתין לשליחה</span>`)
    : `<span class="chip muted">${ic('sign')}ממתין לחתימה</span>`;
  const go = `#/trip/${S.trip.id}/stop/${s.id}/sign/${d.morning_id}/${q ? 'status' : '1'}`;
  return `<div class="docrow wrapd"><span class="ic">${ic('file')}</span>
    <div class="grow"><b>${esc(docLabel(d))}</b><div class="small muted">Morning${fmtDocDate(d) ? ' · ' + esc(fmtDocDate(d)) : ''}</div><div style="margin-top:6px">${st}</div></div>
    <div class="docbtns">
      <button class="btn" data-act="open-doc" data-path="${esc(d.pdf_path || '')}" ${d.pdf_path ? '' : 'disabled'}>${d.pdf_path ? 'צפייה' : 'לא זמין'}</button>
      ${sig ? (sig.signed_pdf_path ? `<button class="btn soft" data-act="open-signed" data-path="${esc(sig.signed_pdf_path)}">${ic('check')}המסמך החתום</button>` : '')
        : d.pdf_path ? `<button class="btn soft" data-go="${go}">${q ? 'מצב השליחה' : ic('sign') + 'חתימה'}</button>` : ''}
    </div></div>`;
}

function binding(c) {
  const sha = (c.q && c.q.sha) || c.dr.sha || (c.d.signature && c.d.signature.document_sha256), pages = (c.q && c.q.pageCount) || c.dr.pageCount;
  return `<div class="binding"><b>${esc(docLabel(c.d))} · ${esc(c.s.name)}</b>
    <span>${esc(fmtDocDate(c.d))}${pages ? ' · ' + (pages === 1 ? 'עמוד אחד' : pages + ' עמודים') : ''}</span>
    ${sha ? `<span>טביעת המסמך <bdi class="docid">${esc(shortSha(sha))}</bdi></span>` : ''}</div>`;
}

function screenSign(r) {
  const c = signCtx(r);
  const toStop = `#/trip/${r.tripId}/stop/${r.stopId}`;
  if (!S.trip || S.trip.id !== r.tripId) return `<button class="back" data-go="${toStop}">${ic('back', 'sm')}למשלוח</button>` + (S.tripError ? errorCard(S.tripError, 'reload-trip') : '<div class="skel"></div>');
  if (!c) return `<button class="back" data-go="${toStop}">${ic('back', 'sm')}למשלוח</button><div class="msg err">${ic('alert')}<span>המסמך הזה לא מצורף למשלוח.</span></div>`;
  const base = `#/trip/${r.tripId}/stop/${r.stopId}/sign/${r.docId}/`;
  const step = (c.d.signature || c.q) && r.step !== 'status' ? 'status' : r.step;
  const head = (back, kicker, title) => `<button class="back" data-go="${back}">${ic('back', 'sm')}חזרה</button><header><div class="kicker">${kicker}</div><h1>${title}</h1></header>`;
  const dr = c.dr;

  if (step === '1') {
    const body = dr.loading ? `<div class="msg info">${ic('spinner', 'spin')}<span>טוען את המסמך…</span></div><div class="skel" style="height:420px"></div>`
      : dr.error ? `<div class="msg err" role="alert">${ic('alert')}<span>${esc(dr.error)}</span></div><button class="btn full" style="margin-top:12px" data-act="sig-load">${ic('refresh')}ניסיון נוסף</button>`
      : dr.pages ? dr.pages.map((p, i) => `<img class="pdfpage" src="${p}" alt="עמוד ${i + 1} מתוך ${dr.pages.length} של ${esc(docLabel(c.d))}">`).join('') +
        `<div class="msg info">${ic('file')}<span>זה המסמך שאליו תצורף החתימה. בודקים שהלקוח והפריטים נכונים לפני ההמשך.</span></div>
         <button class="btn primary full" style="margin-top:18px" data-go="${base}2">המשך לשם ולחתימה ${ic('open')}</button>` : '';
    return head(toStop, 'שלב 1 מתוך 3', 'המסמך לחתימה') + binding(c) + body;
  }
  if (step === '2') {
    if (!dr.sha) return head(base + '1', 'שלב 2 מתוך 3', 'שם וחתימה') + `<div class="msg warn">${ic('file')}<span>קודם פותחים את המסמך.</span></div><button class="btn primary full" style="margin-top:14px" data-go="${base}1">פתיחת המסמך</button>`;
    return head(base + '1', 'שלב 2 מתוך 3', 'שם וחתימה') + binding(c) + `
      <label class="lbl" for="sigName">שם מלא של המקבל <span style="color:var(--red)">*</span></label>
      <input id="sigName" class="field" autocomplete="off" maxlength="100" placeholder="מי קיבל את המשלוח?" value="${esc(dr.receiver)}">
      <label class="lbl" id="padLabel">חתימת המקבל <span style="color:var(--red)">*</span></label>
      <p class="muted" style="margin-top:-4px">חותמים באצבע בתוך המסגרת.</p>
      <div class="signpad"><canvas id="sigPad" aria-labelledby="padLabel" aria-describedby="padHelp"></canvas><div class="signhint" id="inkHint">חותמים כאן</div></div>
      <p class="muted" id="padHelp" style="margin-top:8px">החתימה תצורף ל${esc(docLabel(c.d))} בלבד.</p>
      <button class="btn full" data-act="sig-clear">${ic('x')}ניקוי החתימה</button>
      <div id="sigErr"></div>
      <button class="btn primary full" style="margin-top:16px" data-act="sig-review">בדיקה לפני שליחה</button>`;
  }
  if (step === '3') {
    if (!dr.sigPng) return head(base + '2', 'שלב 3 מתוך 3', 'בדיקה לפני שליחה') + `<div class="msg warn">${ic('sign')}<span>חסרים שם או חתימה.</span></div><button class="btn primary full" style="margin-top:14px" data-go="${base}2">חזרה לשם ולחתימה</button>`;
    return head(base + '2', 'שלב 3 מתוך 3', 'בדיקה לפני שליחה') + binding(c) +
      (dr.pages ? `<img class="pdfpage" src="${dr.pages[0]}" alt="עמוד 1 של ${esc(docLabel(c.d))}">${dr.pages.length > 1 ? `<p class="muted" style="margin-top:6px">ועוד ${dr.pages.length - 1 === 1 ? 'עמוד אחד' : (dr.pages.length - 1) + ' עמודים'} — אותו מסמך שנפתח בשלב 1.</p>` : ''}` : '') +
      `<section class="card" style="margin-top:14px"><h2 class="cardh">פרטי החתימה</h2>
        <div class="between"><span class="muted">שם המקבל</span><b>${esc(dr.receiver)}</b></div>
        <img class="sigimg" src="${dr.sigPng}" alt="החתימה של ${esc(dr.receiver)} עבור ${esc(docLabel(c.d))}"></section>
      <div class="msg info">${ic('lock')}<span>האישור שולח יחד את המסמך המוצג, שם המקבל והחתימה. המסמך המקורי במורנינג לא משתנה.</span></div>
      <button class="btn primary full" style="margin-top:16px" data-act="sig-send">${ic('upload')}אישור ושליחת המסמך החתום</button>
      <button class="btn full" style="margin-top:10px" data-go="${base}2">חזרה לתיקון</button>`;
  }
  // état de l'envoi
  const q = c.q, sig = c.d.signature, done = S.sigDone[c.key];

// 1) charger le document exact : octets → empreinte → pages
async function loadSignDoc(r) {
  const c = signCtx(r); if (!c || !c.d.pdf_path) return;
  const dr = c.dr;
  if (dr.sha || dr.loading) return;
  dr.loading = true; dr.error = ''; render();
  try {
    const { data, error } = await apiUrl('morning-pdf', c.d.pdf_path, 120);
    if (error || !data) throw error || new Error('lien');
    const resp = await fetch(data.signedUrl, { cache: 'no-store' });
    if (!resp.ok) throw new Error('pdf ' + resp.status);
    const bytes = new Uint8Array(await resp.arrayBuffer());
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    const sha = [...hash].map(b => b.toString(16).padStart(2, '0')).join('');
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: bytes.slice(), cMapUrl: PDFJS_BASE + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS_BASE + 'standard_fonts/' }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p), base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(2.2, 1100 / base.width) });
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      pages.push(cv.toDataURL('image/jpeg', 0.85));
    }
    Object.assign(dr, { sha, pages, pageCount: pages.length });
  } catch (e) {
    dr.error = !navigator.onLine || /fetch|network|load failed/i.test(String(e && e.message)) ? 'אין חיבור לאינטרנט. מנסים שוב כשהחיבור חוזר.' : 'לא הצלחנו לפתוח את המסמך. מנסים שוב, או פונים למשרד.';
  }
  dr.loading = false; render();
}

// 2) zone de signature : points normalisés (0..1), redessinés si la taille change ; seul le cadre bloque le défilement
let _padObs = null;
function initPad(r) {
  const c = signCtx(r), cv = $('#sigPad'); if (!c || !cv) return;
  const dr = c.dr, name = $('#sigName');
  if (name) name.oninput = () => { dr.receiver = name.value; };
  const draw = () => {
    const rect = cv.getBoundingClientRect(), k = Math.max(1, window.devicePixelRatio || 1);
    cv.width = Math.round(rect.width * k); cv.height = Math.round(rect.height * k);
    const g = cv.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, rect.width, rect.height);
    g.lineWidth = 2.8; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#163d47';
    for (const st of dr.strokes) { if (!st.length) continue; g.beginPath(); g.moveTo(st[0].x * rect.width, st[0].y * rect.height); for (const p of st.slice(1)) g.lineTo(p.x * rect.width, p.y * rect.height); g.stroke(); }
    const h = $('#inkHint'); if (h) h.style.display = dr.strokes.length ? 'none' : '';
  };
  const pt = e => { const b = cv.getBoundingClientRect(); return { x: Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), y: Math.max(0, Math.min(1, (e.clientY - b.top) / b.height)) }; };

  cv.addEventListener('pointermove', e => { if (!cur || e.pointerId !== pid) return; e.preventDefault(); cur.push(pt(e)); draw(); });
  const end = e => { if (e.pointerId !== pid) return; cur = null; pid = null; dr.sigPng = null; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

}

  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#163d47';
  for (const st of strokes) { if (!st.length) continue; g.beginPath(); g.moveTo(st[0].x * w, st[0].y * h); for (const p of st.slice(1)) g.lineTo(p.x * w, p.y * h); g.stroke(); }

  const c = signCtx(r); if (!c) return;

async function sendSig(item) {

  item.state = 'sending'; item.error = ''; item.errorCode = ''; render();
  try {
    const resp = await apiSignFetch({ request_id: item.requestId, task_id: item.taskId, morning_id: item.morningId, sha256: item.sha, receiver_name: item.receiver,
        strokes: item.strokes, signature_png: item.sigPng, block_png: item.blockPng, client_time: item.clientTime });
    const j = await resp.json().catch(() => ({}));
    if (!resp.ok || !j.ok || !j.signature || !j.signature.signed_at) { const e = new Error(j.error || 'http ' + resp.status); e.code = j.error || ''; e.status = resp.status; if (/^link_/.test(e.code)) S.linkDead = e.code; throw e; }
    if (S.mode === 'link') S.linkDead = null;

    S.sigs = S.sigs.filter(x => x.requestId !== item.requestId);

    const stop = S.trip && S.trip.id === item.tripId ? S.trip.stops.find(x => x.id === item.taskId) : null;

      : e.code === 'document_changed' ? 'המסמך השתנה מאז שנפתח. פותחים אותו מחדש וחותמים שוב.'

      : !navigator.onLine || /fetch|network|load failed/i.test(m) ? 'אין חיבור. המסמך, השם והחתימה שמורים במכשיר.'

  const dead = S.mode === 'link' && S.linkDead ? `<div class="linkdead" role="alert">${ic('lock', 'sm')}<span>${esc(DL.LINK_DEAD_TEXT)}</span></div>` : '';
  const info = S.mode === 'link' && !S.linkDead && S.link ? `<div class="linkinfo">${ic('lock', 'sm')}<span>גישה זמנית בקישור · בתוקף עד ${esc(fmtIL(S.link.expires_at))}</span></div>` : '';
  app.innerHTML = off + dead + `<main class="wrap${hasBar ? ' has-bar' : ''}">${info}${body}</main>` + navBar(r.view);
  if (r.view === 'trip' && S.tripMode === 'map') setTimeout(drawMap, 30);
  if (r.view === 'stop') fillThumbs();
  if (r.view === 'sign') afterSign(r);
}

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'phone') sendCode(false); else verifyCode();
});
document.addEventListener('input', e => {
  if (e.target.id === 'code') { const v = e.target.value.replace(/\D/g, '').slice(0, 6); e.target.value = v; S.login.code = v; if (v.length === 6 && !S.login.busy) verifyCode(); }
  if (e.target.id === 'phone') S.login.phone = e.target.value;
});
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, r = route();
  if (act === 'resend') return sendCode(true);
  if (act === 'change-phone') { Object.assign(S.login, { step: 'phone', code: '', error: '' }); return render(); }
  if (act === 'refresh') { a.disabled = true; await loadTrips(); render(); toast('עודכן'); return; }
  if (act === 'reload-trip') { S.tripError = ''; render(); await loadTrip(r.tripId); return render(); }
  if (act === 'toggle-past') { S.showPast = !S.showPast; return render(); }
  if (act === 'mode') { S.tripMode = a.dataset.mode; return render(); }
  if (act === 'logout') { if ((S.queue.length || S.sigs.length) && !confirm('יש תמונות או חתימות שעוד לא התקבלו. להתנתק בכל זאת?')) return; await sb.auth.signOut(); return; }
  const s = stopOf(r);
  if (act === 'deliver' && s) return deliverSheet(s);
  if (act === 'problem' && s) return problemSheet(s);
  if (act === 'photo' && s) return photoSheet(s);
  if (act === 'retry') { const q = S.queue.find(x => x.id === a.dataset.id); if (q) sendProof(q); return; }
  if (act === 'open-doc') return openDoc(a.dataset.path);
  if (act === 'open-signed') return openSigned(a.dataset.path);
  if (act === 'sig-load') { const c = signCtx(r); if (c) { c.dr.error = ''; loadSignDoc(r); } return; }
  if (act === 'sig-clear') { const c = signCtx(r); if (c) { c.dr.strokes = []; c.dr.sigPng = null; const n = $('#sigName'); if (n) c.dr.receiver = n.value; render(); } return; }
  if (act === 'sig-review') return signReview(r);
  if (act === 'sig-send') { a.disabled = true; return signSend(r); }
  if (act === 'sig-retry') { const c = signCtx(r); if (c && c.q) sendSig(c.q); return; }
  if (act === 'sig-restart') return signRestart(r);
  if (act === 'view-proof') return viewImage(S.thumbs[a.dataset.path]);
  if (act === 'view-local') { const q = S.queue.find(x => x.id === a.dataset.id); return viewImage(q && q.url); }
});

// Changement d'écran : on recharge la tournée affichée (toujours la version du serveur)
window.addEventListener('hashchange', async () => {
  window.scrollTo(0, 0);
  const r = route();
  if (S.role !== 'driver') return render();
  if (S.mode === 'link' && (r.view === 'trips' || r.view === 'account')) { if (S.trip) location.replace('#/trip/' + S.trip.id); else render(); return; }
  if (r.view === 'trips') { render(); await loadTrips(); return render(); }
  if (r.view === 'trip' || r.view === 'stop' || r.view === 'done' || r.view === 'sign') {
    const fresh = S.trip && S.trip.id === r.tripId;
    render();
    if (!fresh || r.view === 'trip') { await loadTrip(r.tripId); render(); }
    return;
  }
  render();
});
window.addEventListener('online', () => { S.online = true; render(); retryAll(); });
window.addEventListener('offline', () => { S.online = false; render(); });

async function enter(session) {
  S.session = session;
  try { await loadMe(); } catch (e) { S.role = null; S.ready = true; app_error(e); return; }
  S.ready = true;
  if (S.role !== 'driver') return render();
  S.queue = await qLoad();
  S.sigs = await sLoad();
  const r = route();
  render();
  await loadTrips();
  if (r.view === 'trip' || r.view === 'stop' || r.view === 'done' || r.view === 'sign') await loadTrip(r.tripId);
  render();
  if ((S.queue.length || S.sigs.length) && navigator.onLine) retryAll();
}
function app_error(e) {
  $('#app').innerHTML = `<main class="login">${errorCard(workError(e), 'boot')}</main>`;
  const b = document.querySelector('[data-act="boot"]'); if (b) b.onclick = () => location.reload();
}
async function enterLink() {
  S.mode = 'link'; S.role = 'driver'; S.session = { user: { id: 'link' } };
  S.queue = await qLoad(); S.sigs = await sLoad();
  await loadTrip(null);
  S.ready = true;
  if (S.trip && !location.hash.startsWith('#/trip/' + S.trip.id)) location.replace('#/trip/' + S.trip.id); else render();
  if (S.trip && (S.queue.length || S.sigs.length) && navigator.onLine) retryAll();
}
let _entered = null;
if (LINK) enterLink(); else {
sb.auth.onAuthStateChange((event, session) => {
  const uid = session && session.user && session.user.id;
  if (uid && uid !== _entered) { _entered = uid; setTimeout(() => enter(session), 0); }
  else if (!session) { _entered = null; Object.assign(S, { session: null, role: null, me: null, trips: null, trip: null, queue: [], sigs: [], drafts: {}, sigDone: {}, ready: true }); S.login = { step: 'phone', phone: S.login.phone, e164: '', code: '', busy: false, error: '', resendAt: 0 }; render(); }
  else if (session) S.session = session;
});
sb.auth.getSession().then(({ data }) => { if (!data.session) { S.ready = true; render(); } });
}
render();
</script>
